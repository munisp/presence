# AMD-MAP-06: static-tile serving (TR-44).
#
# Layout: /usr/share/nginx/html/bundles/<version>/{manifest.json,
# vectors.json, z/x/y.png}, with "current" symlinking the bundle this
# image ships. The PWA/console proxies rewrite /tiles/... to
# /current/... — the client learns the version from the manifest the
# edge served (AMD-MAP-05), and the registry pins the expected hash.
#
# Cache discipline:
#  - Tiles are immutable FOREVER at a versioned path — a pixel can only
#    change under a new bundle version (the builder's hash is pinned in
#    the registry, AMD-MAP-02), so a year-long immutable cache is safe.
#  - manifest.json / vectors.json revalidate every load: the client
#    pins on the version INSIDE, so a fresh manifest is cheap and a
#    stale one is impossible to mistake.
#  - Tile z/x/y triples are location-revealing in aggregate, so the
#    access log is OFF for tile hits (AMD-MAP-06 log redaction); the
#    edge metrics carry the discovery traffic instead.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html/bundles;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Manifest and vectors: always revalidate.
    location ~ ^/[^/]+/manifest\.json$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location ~ ^/[^/]+/vectors\.json$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Versioned tiles: immutable for a year, no access log.
    location ~ ^/[^/]+/(?<z>[0-9]+)/(?<x>[0-9]+)/(?<y>[0-9]+)\.png$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Everything else is a 404 — there is no directory listing, no API.
    location / {
        return 404;
    }
}
