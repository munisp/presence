[package]
name = "match-core"
version = "0.1.0"
edition = "2021"
description = "Presence match core (TECH-18): the ARC-allocated Rust implementation of the interest-matching engine, pinned to 1e-9 against the shared golden corpus"
license = "MIT"

[lib]
name = "match_core"
path = "src/lib.rs"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
