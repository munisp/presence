# SEC-28: production secrets live in a managed store, never in git, client
# binaries or CI logs. The External Secrets Operator materialises the single
# presence-secrets Secret the workloads reference from the store — no Secret
# manifest with data/stringData exists in this repository (CI-pinned).
#
# Requires the External Secrets Operator (https://external-secrets.io):
#   helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
# then:
#   kubectl apply -f deploy/k8s/external-secrets.yaml
#
# The ClusterSecretStore below is the environment-specific piece: pick ONE
# backend block for the environment and fill in its connection details from
# the ESO provider docs. Nothing else in the platform changes.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: presence-secrets-store
spec:
  provider:
    # --- Option A: AWS Secrets Manager -------------------------------------
    # aws:
    #   service: SecretsManager
    #   region: eu-west-1
    #   auth:
    #     jwt:
    #       serviceAccountRef: { name: external-secrets, namespace: external-secrets }
    # --- Option B: HashiCorp Vault ------------------------------------------
    vault:
      server: "https://vault.example.internal"
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: presence
          serviceAccountRef: { name: external-secrets, namespace: external-secrets }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: presence-secrets
  namespace: presence
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: presence-secrets-store }
  target:
    name: presence-secrets   # the name every Deployment references
    creationPolicy: Owner
  data:
    # Every key referenced by a secretKeyRef anywhere in deploy/k8s MUST
    # appear here — validate_deploy.py pins the coverage.
    - secretKey: EDGE_DATABASE_URL
      remoteRef: { key: presence/edge, property: DATABASE_URL }
    - secretKey: MATCH_DATABASE_URL
      remoteRef: { key: presence/match, property: DATABASE_URL }
    - secretKey: CENTRIFUGO_API_KEY
      remoteRef: { key: presence/centrifugo, property: API_KEY }
    - secretKey: CENTRIFUGO_TOKEN_HMAC_SECRET_KEY
      remoteRef: { key: presence/centrifugo, property: TOKEN_HMAC_SECRET_KEY }
    - secretKey: RECOVERY_HASH_KEY
      remoteRef: { key: presence/edge, property: RECOVERY_HASH_KEY }
    - secretKey: KEYCLOAK_ADMIN
      remoteRef: { key: presence/keycloak, property: ADMIN }
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef: { key: presence/keycloak, property: ADMIN_PASSWORD }
    - secretKey: POSTGRES_USER
      remoteRef: { key: presence/postgres, property: USER }
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: presence/postgres, property: PASSWORD }
    # FR-56: push pipeline credentials. Optional in the store — the pipeline
    # is dormant until they exist (edge.yaml marks every ref optional).
    - secretKey: APNS_TEAM_ID
      remoteRef: { key: presence/push, property: APNS_TEAM_ID }
    - secretKey: APNS_KEY_ID
      remoteRef: { key: presence/push, property: APNS_KEY_ID }
    - secretKey: APNS_KEY_P8
      remoteRef: { key: presence/push, property: APNS_KEY_P8 }
    - secretKey: APNS_TOPIC
      remoteRef: { key: presence/push, property: APNS_TOPIC }
    - secretKey: FCM_PROJECT_ID
      remoteRef: { key: presence/push, property: FCM_PROJECT_ID }
    - secretKey: FCM_ACCESS_TOKEN
      remoteRef: { key: presence/push, property: FCM_ACCESS_TOKEN }
