# AMD-CON-01: console static serving.
#  - SPA fallback: /auth/callback (the OIDC return path) and any deep link
#    land on index.html; routing is by hash from there.
#  - Same-origin API: /v1/ is proxied to the edge, so the console never
#    needs a CORS surface (there is none on the edge — by design).
#  - Cache discipline matches the service worker contract: HTML and the
#    SW are never cached beyond must-revalidate; the compiled bundle is
#    revalidated; icons are long-lived.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        application/manifest+json webmanifest;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # The console talks to its own origin only (API proxied below); the
    # OIDC issuer is reached by redirect, not by fetch from the page —
    # except the token endpoint, so connect-src allows the issuer host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8080 https://auth.presence.example; frame-ancestors 'none'; base-uri 'self'" always;

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    location /dist/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /v1/ {
        proxy_pass http://edge:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
