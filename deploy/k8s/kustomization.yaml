apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: presence
resources:
  - namespace.yaml
  - postgres.yaml
  - valkey.yaml
  - centrifugo.yaml
  - keycloak.yaml
  - match.yaml
  - edge.yaml
  - apisix.yaml
  - networkpolicy.yaml
  - backup.yaml
# canary.yaml requires the Flagger CRDs; apply it separately after Flagger is
# installed (see README.md). prometheusrules.yaml likewise requires the
# Prometheus Operator CRDs; apply it with the monitoring stack.
