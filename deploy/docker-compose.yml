# Presence P0 stack (PRS-ARC-002): Postgres 17 + PostGIS, Valkey 8,
# Centrifugo, match service, edge. Five processes, async work off the scan
# path. Run from the repo root:  docker compose -f deploy/docker-compose.yml up --build

services:
  postgres:
    build: ./postgres   # postgis + pgvector (FR-09/TECH-09 linking)
    image: presence/postgres:p0
    environment:
      POSTGRES_USER: presence
      POSTGRES_PASSWORD: presence
      POSTGRES_DB: presence
    volumes:
      - ../db/migrations/0001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ../db/seed/taxonomy.sql:/docker-entrypoint-initdb.d/02_taxonomy.sql:ro
      - ../db/migrations/0002_offer_lifecycle.sql:/docker-entrypoint-initdb.d/03_lifecycle.sql:ro
      - ../db/migrations/0003_account_deletion.sql:/docker-entrypoint-initdb.d/04_account.sql:ro
      - ../db/migrations/0004_discovery_safety.sql:/docker-entrypoint-initdb.d/05_safety.sql:ro
      - ../db/migrations/0005_floors_checkin.sql:/docker-entrypoint-initdb.d/06_floors.sql:ro
      - ../db/migrations/0006_profile_safety.sql:/docker-entrypoint-initdb.d/07_profile_safety.sql:ro
      - ../db/migrations/0007_group_surface.sql:/docker-entrypoint-initdb.d/08_group_surface.sql:ro
      - ../db/migrations/0008_moderation.sql:/docker-entrypoint-initdb.d/09_moderation.sql:ro
      - ../db/migrations/0009_rooms.sql:/docker-entrypoint-initdb.d/10_rooms.sql:ro
      - ../db/migrations/0010_devices.sql:/docker-entrypoint-initdb.d/11_devices.sql:ro
      - ../db/migrations/0011_linking.sql:/docker-entrypoint-initdb.d/12_linking.sql:ro
      - ../db/seed/taxonomy_embeddings.sql:/docker-entrypoint-initdb.d/13_taxonomy_embeddings.sql:ro
      - ../db/migrations/0012_taxonomy_cms.sql:/docker-entrypoint-initdb.d/14_taxonomy_cms.sql:ro
      - ../db/migrations/0013_telemetry.sql:/docker-entrypoint-initdb.d/15_telemetry.sql:ro
      - ../db/migrations/0014_markets.sql:/docker-entrypoint-initdb.d/16_markets.sql:ro
      - ../db/migrations/0015_recovery.sql:/docker-entrypoint-initdb.d/17_recovery.sql:ro
      - ../db/migrations/0016_age_assurance.sql:/docker-entrypoint-initdb.d/18_age_assurance.sql:ro
      - ../db/migrations/0017_geofence_review.sql:/docker-entrypoint-initdb.d/19_geofence_review.sql:ro
      - ../db/migrations/0018_analytics_publication.sql:/docker-entrypoint-initdb.d/20_analytics_publication.sql:ro
      - ../db/migrations/0019_reporting_compliance.sql:/docker-entrypoint-initdb.d/21_reporting_compliance.sql:ro
      - ../db/migrations/0020_venue_registry.sql:/docker-entrypoint-initdb.d/22_venue_registry.sql:ro
      - ../db/migrations/0021_attestation_push.sql:/docker-entrypoint-initdb.d/23_attestation_push.sql:ro
      - ../db/migrations/0022_jit_elevation.sql:/docker-entrypoint-initdb.d/24_jit_elevation.sql:ro
      - ../deploy/keycloak/init.sql:/docker-entrypoint-initdb.d/00_keycloak.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presence"]
      interval: 5s
      timeout: 3s
      retries: 12

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  centrifugo:
    image: centrifugo/centrifugo:v6
    command: centrifugo --health
    environment:
      CENTRIFUGO_HTTP_API: "true"
      CENTRIFUGO_HTTP_API_KEY: p0-dev-api-key
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: p0-dev-secret-change-me
      CENTRIFUGO_ADMIN: "true"
      CENTRIFUGO_ADMIN_PASSWORD: p0-dev-admin
      CENTRIFUGO_ADMIN_SECRET: p0-dev-admin-secret
      # TECH-06: Valkey (Redis-compatible) as the engine — presence/pub-sub
      # state is shared across replicas instead of per-process memory.
      CENTRIFUGO_ENGINE_TYPE: redis
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: redis://valkey:6379/1
    depends_on:
      valkey:
        condition: service_healthy
    ports: ["8000:8000"]

  # TECH-07 / ARC-002 §8.2: Keycloak, three realms imported at boot
  # (consumer / workforce / partners — see deploy/keycloak/).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: p0-dev-admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: presence
      KC_DB_PASSWORD: presence
      KC_HOSTNAME: localhost
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  # APISIX gateway (TECH-21: sole public ingress; SEC-06/TR-26: TLS 1.3
  # terminates here in dev too, mirroring the K8s listener). Public API
  # traffic goes through :9443 (e.g. https://localhost:9443/v1/scan).
  # Run `bash deploy/apisix/dev-tls.sh` once per checkout first — the
  # self-signed dev cert is gitignored.
  apisix:
    image: apache/apisix:3.11.0-debian
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./apisix/tls:/usr/local/apisix/conf/tls:ro
    ports: ["9443:9443"]
    depends_on:
      - edge
      - centrifugo
      - keycloak

  match:
    build: ../services/match
    environment:
      PORT: "4100"
      DATABASE_URL: postgres://presence_match:presence-dev@postgres:5432/presence
      VALKEY_URL: redis://valkey:6379
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    ports: ["4100:4100"]

  edge:
    build: ../services/edge
    environment:
      PORT: "4000"
      DATABASE_URL: postgres://presence_app:presence-dev@postgres:5432/presence
      VALKEY_URL: redis://valkey:6379
      MATCH_SERVICE_URL: http://match:4100
      CENTRIFUGO_URL: http://centrifugo:8000
      CENTRIFUGO_API_KEY: p0-dev-api-key
      JWT_SECRET: p0-dev-secret-change-me
      RECOVERY_HASH_KEY: p0-dev-recovery-key-change-me   # SEC-09 dev-only HMAC key (SEC-28)
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/consumer
    depends_on:
      - match
      - centrifugo
      - keycloak
    ports: ["4000:4000"]

volumes:
  pgdata:
