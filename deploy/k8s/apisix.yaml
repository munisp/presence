# APISIX gateway — the sole public ingress (TECH-21, INF-11, TR-26).
# Runs in etcd-less standalone data-plane mode for P0: routes are the
# ConfigMap below, versioned with the repo. TLS 1.3 only, HTTP/2, HSTS+CSP,
# request-id propagation (NFR-31), Prometheus metrics for the HPA/Flagger
# SLO signals (INF-10/INF-16).
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix
  namespace: presence
  labels: { app: apisix, app.kubernetes.io/part-of: presence }
data:
  config.yaml: |
    deployment:
      role: data_plane
      role_data_plane:
        config_provider: yaml
    apisix:
      node_listen:
        - port: 9080
        - port: 9443
          enable_http2: true
          tls: true
      enable_admin: false
      proxy_mode: http&stream
    nginx_config:
      http:
        ssl_protocols: TLSv1.3        # TR-26: TLS 1.3 only — downgrade is impossible at the listener
        ssl_session_cache: shared:SSL:10m
        ssl_session_timeout: 10m
        # INF-11: OCSP stapling at the gateway — clients receive the CA's
        # revocation attestation inside the handshake and never query the CA
        # themselves. The chain is cert-manager's tls.crt (leaf +
        # intermediates); the responder lookup stays on cluster DNS.
        ssl_stapling: on
        ssl_stapling_verify: on
        ssl_trusted_certificate: /usr/local/apisix/conf/ssl/tls.crt
        resolver: kube-dns.kube-system.svc.cluster.local valid=300s
        resolver_timeout: 5s
    plugins:
      - prometheus
      - request-id
      - response-rewrite
      - limit-count
  apisix.yaml: |
    routes:
      - id: edge-api
        uri: /v1/*
        upstream:
          type: roundrobin
          nodes: { "edge.presence.svc.cluster.local:4000": 1 }
        plugins:
          request-id:
            header_name: X-Request-Id
            include_in_response: true
          response-rewrite:
            headers:
              set:
                Strict-Transport-Security: "max-age=63072000; includeSubDomains"   # INF-11
                Content-Security-Policy: "default-src 'none'; frame-ancestors 'none'"   # INF-11 (API surface)
                X-Content-Type-Options: nosniff
          # INF-13: per-source-IP flood shedding at the gateway, before any
          # in-process work. 1200 req/60 s ≈ 20 rps — far above a real client
          # (the app issues a handful of requests per minute), far below a
          # flood. Rejected requests are 429 + counted by the prometheus
          # plugin; loadtest/ratelimit-probe.js is the pre-launch test.
          limit-count:
            count: 1200
            time_window: 60
            key: remote_addr
            rejected_code: 429
            show_limit_quota_header: true
      - id: realtime-ws
        uri: /connection/*
        upstream:
          type: roundrobin
          nodes: { "centrifugo.presence.svc.cluster.local:8000": 1 }
        enable_websocket: true
        plugins:
          request-id:
            header_name: X-Request-Id
            include_in_response: true
      - id: keycloak-oidc
        # Public IdP surface only: realm endpoints + certs/assets. The admin
        # console (/admin) is intentionally not routed (SEC surface).
        uris: ["/realms/*", "/resources/*"]
        upstream:
          type: roundrobin
          nodes: { "keycloak.presence.svc.cluster.local:8080": 1 }
        plugins:
          # INF-13: tighter window on the auth surface — token and
          # registration endpoints are the classic credential-stuffing /
          # brute-force target. 120 req/60 s per IP leaves real sign-in
          # bursts (token refresh storms after push wakes) unaffected.
          limit-count:
            count: 120
            time_window: 60
            key: remote_addr
            rejected_code: 429
    ssl:
      - snis: ["api.presence.example"]
        cert: __INJECTED_FROM_SECRET__   # cert.pem/key.pem mounted from the apisix-tls secret (cert-manager issued)
        key: __INJECTED_FROM_SECRET__
    #END
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
  namespace: presence
  labels: { app: apisix, app.kubernetes.io/part-of: presence }
spec:
  replicas: 2
  selector:
    matchLabels: { app: apisix }
  template:
    metadata:
      labels: { app: apisix, app.kubernetes.io/part-of: presence }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: apisix
          image: apache/apisix:3.11.0-debian
          ports:
            - { containerPort: 9080 }
            - { containerPort: 9443 }
            - { containerPort: 9091 }   # prometheus export
          readinessProbe: { httpGet: { path: /status, port: 9080 }, periodSeconds: 5 }
          volumeMounts:
            - name: conf
              mountPath: /usr/local/apisix/conf/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: conf
              mountPath: /usr/local/apisix/conf/apisix.yaml
              subPath: apisix.yaml
              readOnly: true
            - name: tls
              mountPath: /usr/local/apisix/conf/ssl
              readOnly: true
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: conf
          configMap: { name: apisix }
        - name: tls
          secret:
            secretName: apisix-tls   # cert-manager issued; the gateway staples the CA's OCSP attestation from this chain (INF-11)
---
# Sole public entry point (TECH-21). Everything else in the namespace is
# ClusterIP/headless and unreachable from outside (INF-12).
apiVersion: v1
kind: Service
metadata:
  name: apisix
  namespace: presence
  labels: { app: apisix }
spec:
  type: LoadBalancer
  selector: { app: apisix }
  ports:
    - { name: https, port: 443, targetPort: 9443 }
    - { name: http-redirect, port: 80, targetPort: 9080 }   # APISIX redirects :80 → https (INF-11)
