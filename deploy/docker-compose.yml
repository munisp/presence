# Presence P0 stack (PRS-ARC-002): Postgres 17 + PostGIS, Valkey 8,
# Centrifugo, match service, edge. Five processes, async work off the scan
# path. Run from the repo root:  docker compose -f deploy/docker-compose.yml up --build

services:
  postgres:
    build: ./postgres   # postgis + pgvector (FR-09/TECH-09 linking)
    image: presence/postgres:p0
    # PITR (INF-18/NFR-16): WAL archiving on, a segment forced every 300 s so
    # the point-in-time window never exceeds 5 minutes; every segment is
    # dual-encrypted by wal-archive.sh (SEC-11).
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/presence-backup/wal-archive.sh %p %f
      - -c
      - archive_timeout=300
    environment:
      POSTGRES_USER: presence
      POSTGRES_PASSWORD: presence
      POSTGRES_DB: presence
      # SEC-11 DEV-ONLY recipients — throwaway local-loop keys; production
      # recipients come from postgres-backup-config (deploy/k8s/backup.yaml)
      # and the matching private keys never enter any manifest.
      BACKUP_AGE_RECIPIENT_INNER: age1dzxr48zxrwvtr2zxvrqna235htq8ws2ze0det3a7th94kah49p9snscufh
      BACKUP_AGE_RECIPIENT_OUTER: age1953ydc8hnz8cv2wnj5y6cmuzwyf3q99am25yukahpf2tgv0mkeps6ryz32
      BACKUP_REPLICATION_PASSWORD: presence-backup-dev   # DEV-ONLY, like POSTGRES_PASSWORD above
    volumes:
      - ../db/migrations/0001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ../db/seed/taxonomy.sql:/docker-entrypoint-initdb.d/02_taxonomy.sql:ro
      - ../db/migrations/0002_offer_lifecycle.sql:/docker-entrypoint-initdb.d/03_lifecycle.sql:ro
      - ../db/migrations/0003_account_deletion.sql:/docker-entrypoint-initdb.d/04_account.sql:ro
      - ../db/migrations/0004_discovery_safety.sql:/docker-entrypoint-initdb.d/05_safety.sql:ro
      - ../db/migrations/0005_floors_checkin.sql:/docker-entrypoint-initdb.d/06_floors.sql:ro
      - ../db/migrations/0006_profile_safety.sql:/docker-entrypoint-initdb.d/07_profile_safety.sql:ro
      - ../db/migrations/0007_group_surface.sql:/docker-entrypoint-initdb.d/08_group_surface.sql:ro
      - ../db/migrations/0008_moderation.sql:/docker-entrypoint-initdb.d/09_moderation.sql:ro
      - ../db/migrations/0009_rooms.sql:/docker-entrypoint-initdb.d/10_rooms.sql:ro
      - ../db/migrations/0010_devices.sql:/docker-entrypoint-initdb.d/11_devices.sql:ro
      - ../db/migrations/0011_linking.sql:/docker-entrypoint-initdb.d/12_linking.sql:ro
      - ../db/seed/taxonomy_embeddings.sql:/docker-entrypoint-initdb.d/13_taxonomy_embeddings.sql:ro
      - ../db/migrations/0012_taxonomy_cms.sql:/docker-entrypoint-initdb.d/14_taxonomy_cms.sql:ro
      - ../db/migrations/0013_telemetry.sql:/docker-entrypoint-initdb.d/15_telemetry.sql:ro
      - ../db/migrations/0014_markets.sql:/docker-entrypoint-initdb.d/16_markets.sql:ro
      - ../db/migrations/0015_recovery.sql:/docker-entrypoint-initdb.d/17_recovery.sql:ro
      - ../db/migrations/0016_age_assurance.sql:/docker-entrypoint-initdb.d/18_age_assurance.sql:ro
      - ../db/migrations/0017_geofence_review.sql:/docker-entrypoint-initdb.d/19_geofence_review.sql:ro
      - ../db/migrations/0018_analytics_publication.sql:/docker-entrypoint-initdb.d/20_analytics_publication.sql:ro
      - ../db/migrations/0019_reporting_compliance.sql:/docker-entrypoint-initdb.d/21_reporting_compliance.sql:ro
      - ../db/migrations/0020_venue_registry.sql:/docker-entrypoint-initdb.d/22_venue_registry.sql:ro
      - ../db/migrations/0021_attestation_push.sql:/docker-entrypoint-initdb.d/23_attestation_push.sql:ro
      - ../db/migrations/0022_jit_elevation.sql:/docker-entrypoint-initdb.d/24_jit_elevation.sql:ro
      - ../db/migrations/0023_geofence_qa.sql:/docker-entrypoint-initdb.d/25_geofence_qa.sql:ro
      - ../db/migrations/0024_kyc_avatars.sql:/docker-entrypoint-initdb.d/26_kyc_avatars.sql:ro
      - ../db/migrations/0025_p2p_transfers.sql:/docker-entrypoint-initdb.d/27_p2p_transfers.sql:ro
      - ../db/migrations/0026_dsar_transfers.sql:/docker-entrypoint-initdb.d/28_dsar_transfers.sql:ro
      - ../db/migrations/0027_wallets.sql:/docker-entrypoint-initdb.d/29_wallets.sql:ro
      - ../db/migrations/0028_wallet_activation.sql:/docker-entrypoint-initdb.d/30_wallet_activation.sql:ro
      - ../db/migrations/0029_rail_hardening.sql:/docker-entrypoint-initdb.d/31_rail_hardening.sql:ro
      - ../db/migrations/0030_innovations.sql:/docker-entrypoint-initdb.d/32_innovations.sql:ro
      - ../db/migrations/0031_dating.sql:/docker-entrypoint-initdb.d/33_dating.sql:ro
      - ../db/migrations/0032_marketplace.sql:/docker-entrypoint-initdb.d/34_marketplace.sql:ro
      - ../db/migrations/0033_escrow_hardening.sql:/docker-entrypoint-initdb.d/35_escrow_hardening.sql:ro
      - ../db/migrations/0034_vertical_flags.sql:/docker-entrypoint-initdb.d/36_vertical_flags.sql:ro
      - ../db/migrations/0035_barter_swaps.sql:/docker-entrypoint-initdb.d/37_barter_swaps.sql:ro
      - ../db/migrations/0036_service_bookings.sql:/docker-entrypoint-initdb.d/38_service_bookings.sql:ro
      - ../db/migrations/0037_onboarding.sql:/docker-entrypoint-initdb.d/39_onboarding.sql:ro
      - ../deploy/keycloak/init.sql:/docker-entrypoint-initdb.d/00_keycloak.sql:ro
      - ../deploy/postgres/initdb/zz_backup_access.sh:/docker-entrypoint-initdb.d/zz_backup_access.sh:ro
      - pgdata:/var/lib/postgresql/data
      - pgbackups:/backups
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presence"]
      interval: 5s
      timeout: 3s
      retries: 12

  # On-demand backup operations (SEC-11, INF-18, NFR-24) — tools profile, not
  # part of the running stack:
  #   docker compose -f deploy/docker-compose.yml run --rm backup
  #       -> base-backup.sh (default command)
  #   docker compose -f deploy/docker-compose.yml run --rm backup \
  #       /usr/local/bin/presence-backup/restore-rehearse.sh
  #       -> the dual-authorised restore drill; run
  #          deploy/postgres/dev-keys/generate-dev-keys.sh first
  backup:
    image: presence/postgres:p0
    profiles: ["tools"]
    user: "70"   # postgres — matches the k8s CronJob securityContext
    command: ["/usr/local/bin/presence-backup/base-backup.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: presence
      BACKUP_AGE_RECIPIENT_INNER: age1dzxr48zxrwvtr2zxvrqna235htq8ws2ze0det3a7th94kah49p9snscufh
      BACKUP_AGE_RECIPIENT_OUTER: age1953ydc8hnz8cv2wnj5y6cmuzwyf3q99am25yukahpf2tgv0mkeps6ryz32
      BACKUP_REPLICATION_PASSWORD: presence-backup-dev   # DEV-ONLY
      # SEC-11 dual-authorisation rehearsal: two distinct DEV-ONLY identity
      # files (gitignored; generate-dev-keys.sh creates them).
      BACKUP_AGE_IDENTITY_INNER_FILE: /run/backup-keys/inner.agekey
      BACKUP_AGE_IDENTITY_OUTER_FILE: /run/backup-keys/outer.agekey
      BACKUP_REHEARSAL_OPERATOR_IDS: dev-ops-a,dev-ops-b   # DEV-ONLY
    volumes:
      - pgbackups:/backups
      - ../deploy/postgres/dev-keys:/run/backup-keys:ro
    depends_on:
      postgres: { condition: service_healthy }

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  centrifugo:
    image: centrifugo/centrifugo:v6
    command: centrifugo --health
    environment:
      CENTRIFUGO_HTTP_API: "true"
      CENTRIFUGO_HTTP_API_KEY: p0-dev-api-key
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: p0-dev-secret-change-me
      CENTRIFUGO_ADMIN: "true"
      CENTRIFUGO_ADMIN_PASSWORD: p0-dev-admin
      CENTRIFUGO_ADMIN_SECRET: p0-dev-admin-secret
      # TECH-06: Valkey (Redis-compatible) as the engine — presence/pub-sub
      # state is shared across replicas instead of per-process memory.
      CENTRIFUGO_ENGINE_TYPE: redis
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: redis://valkey:6379/1
    depends_on:
      valkey:
        condition: service_healthy
    ports: ["8000:8000"]

  # TECH-07 / ARC-002 §8.2: Keycloak, three realms imported at boot
  # (consumer / workforce / partners — see deploy/keycloak/).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: p0-dev-admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: presence
      KC_DB_PASSWORD: presence
      KC_HOSTNAME: localhost
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  # APISIX gateway (TECH-21: sole public ingress; SEC-06/TR-26: TLS 1.3
  # terminates here in dev too, mirroring the K8s listener). Public API
  # traffic goes through :9443 (e.g. https://localhost:9443/v1/scan).
  # Run `bash deploy/apisix/dev-tls.sh` once per checkout first — the
  # self-signed dev cert is gitignored.
  apisix:
    image: apache/apisix:3.11.0-debian
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./apisix/tls:/usr/local/apisix/conf/tls:ro
    ports: ["9443:9443"]
    depends_on:
      - edge
      - centrifugo
      - keycloak

  match:
    build: ../services/match
    environment:
      PORT: "4100"
      DATABASE_URL: postgres://presence_match:presence-dev@postgres:5432/presence
      VALKEY_URL: redis://valkey:6379
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    ports: ["4100:4100"]

  edge:
    build: ../services/edge
    environment:
      PORT: "4000"
      DATABASE_URL: postgres://presence_app:presence-dev@postgres:5432/presence
      VALKEY_URL: redis://valkey:6379
      MATCH_SERVICE_URL: http://match:4100
      CENTRIFUGO_URL: http://centrifugo:8000
      CENTRIFUGO_API_KEY: p0-dev-api-key
      JWT_SECRET: p0-dev-secret-change-me
      RECOVERY_HASH_KEY: p0-dev-recovery-key-change-me   # SEC-09 dev-only HMAC key (SEC-28)
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/consumer
      # FR-01: the DEVICE-REACHABLE issuer the app signs in against, served
      # at GET /v1/client/config (the URL above is the in-cluster one the
      # edge verifies against). Android emulators reach the host as
      # 10.0.2.2 — see docs/security/client-auth.md.
      KEYCLOAK_PUBLIC_ISSUER_URL: http://localhost:8080/realms/consumer
      KEYCLOAK_CLIENT_ID: presence-app   # the realm-exported public client
      # TR-33: TLS pinning policy for GET /v1/client/config. Public SPKI
      # fingerprints, plain env; empty pins = disabled. Remove/rotate by
      # editing the value + bumping the version — no app update.
      CLIENT_CONFIG_VERSION: "1"   # monotonic; bump on every change
      CLIENT_TLS_PINS: ""   # comma-separated sha256/SPKI base64 pins
      # TR-27: minimum client protocol version served; builds below the floor
      # learn it from the (exempt) bootstrap config and prompt for an update.
      CLIENT_MIN_VERSION: "1"
    depends_on:
      - match
      - centrifugo
      - keycloak
    ports: ["4000:4000"]

volumes:
  pgdata:
  pgbackups:
