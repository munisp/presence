# INF-02: staging environment — promotion target for signed digests that
# have rolled out cleanly in integration (promote.yml). Near-production
# shape at reduced scale; synthetic data only (INF-03 — enforced by
# scripts/check_env_separation.py).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../
patches:
  - target: { kind: Namespace, name: presence }
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: presence
        labels:
          presence.dev/environment: staging
          presence.dev/data-policy: synthetic-only   # INF-03
  - target: { kind: Deployment, name: edge }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: edge
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: edge
                env:
                  - name: DEPLOY_ENV
                    value: staging
  - target: { kind: Deployment, name: match }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: match
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: match
                env:
                  - name: DEPLOY_ENV
                    value: staging
  - target: { kind: HorizontalPodAutoscaler, name: edge }
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: edge
      spec:
        minReplicas: 2
        maxReplicas: 8
  - target: { kind: HorizontalPodAutoscaler, name: match }
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: match
      spec:
        minReplicas: 2
        maxReplicas: 8
