# CI (SEC-26): tests, deploy invariants, secret scanning, dependency audit
# and licence policy on every pull request and push to main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pytest pyyaml jsonschema openpyxl -r analytics/requirements.txt
      - run: python -m pytest tests/ -q

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # edge has no committed lockfile yet; match does (npm ci).
      - run: npm install --prefix services/edge
      - run: npm test --prefix services/edge

  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix services/match
      - run: npm test --prefix services/match

  # AMD-CON: the ops console — zero runtime dependencies, npm ci + tsc + node:test.
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix console
      - run: npm test --prefix console

  # AMD-PWA: the member PWA — zero runtime dependencies, npm ci + tsc + node:test.
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix pwa
      - run: npm test --prefix pwa

  deploy-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml
      - run: python3 scripts/validate_deploy.py
      - run: python3 scripts/check_env_separation.py   # INF-03 separation gate
      - run: python3 scripts/check_tls_posture.py      # INF-11 static TLS/OCSP gate

  # SEC-26: secret scanning on every PR.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  # SEC-26: dependency vulnerability audit; SEC-25: licence policy.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vulnerability audit (match service)
        run: npm audit --prefix services/match --audit-level=high
      - name: Licence policy (SEC-25)
        run: |
          ALLOWED="MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Python-2.0;Unlicense;BlueOak-1.0.0"
          npm install --prefix services/edge --no-audit --no-fund
          # --excludePrivatePackages: the first-party @presence/* packages are
          # private and carry no OSS licence; the policy gates third-party deps.
          npx --yes license-checker --production --excludePrivatePackages true --onlyAllow "$ALLOWED" --summary --start services/edge
          npx --yes license-checker --production --excludePrivatePackages true --onlyAllow "$ALLOWED" --summary --start services/match

  # SEC-18: third-party SDK allowlist — fail-closed over the client
  # dependency manifests (client/).
  sdk-allowlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_sdk_allowlist.py

  # TECH-01: the consumer client — typecheck the RN surface and run the
  # framework-free unit suites (TR-29/TR-30) on every push.
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix client --no-audit --no-fund
      - run: npm run typecheck --prefix client
      - run: npm test --prefix client

  # TR-39: every gold table must be registered in the data catalogue with
  # owner, grain, freshness SLO and retention before any product surface may
  # use it. Fail-closed on drift either way.
  gold-catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r analytics/requirements.txt
      - run: python3 scripts/check_gold_catalogue.py

  # TR-21: the 250k-node closure rebuild, timed against a real Postgres on
  # every PR and push to main. Budget: 600 s; a runaway plan change fails.
  taxonomy-scale:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: scale
          POSTGRES_DB: scale
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]"
      - run: python3 scripts/scale_taxonomy_closure.py
        env:
          DATABASE_URL: postgres://postgres:scale@localhost:5432/scale

  # INF-17: every migration is rehearsed against a production-sized
  # synthetic snapshot on a real Postgres before it can land.
  migration-rehearsal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: rehearse
          POSTGRES_DB: rehearse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]"
      - run: python3 scripts/rehearse_migrations.py
        env:
          DATABASE_URL: postgres://postgres:rehearse@localhost:5432/rehearse

  # TECH-24: the full-chain rehearsal stubs every spatial predicate, so no
  # geofence gate ever fires there. This job is the complement: the same 38
  # migrations on REAL PostGIS (the deploy image's base), with known-answer
  # polygons fired through the density gate, the overlap gate, the publish
  # path and the QA report (TR-41/TR-42/FR-90).
  geofence-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_PASSWORD: rehearse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]"
      - run: python3 scripts/verify_geogates.py
        env:
          DATABASE_URL: postgres://postgres:rehearse@localhost:5432/postgres

  # TECH-18: the Rust match core — cargo test pins it to the same golden
  # corpus as the TS engine and the Python reference (1e-9, 120 pairs).
  match-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/match-core
      - run: cargo test --locked --manifest-path services/match-core/Cargo.toml

  # TECH-18: the Go presence/venue/consent service cores — go vet + go test
  # hold the ports to the same constants the TS edge serves with.
  go-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: gofmt -l . | (! grep .)
        working-directory: services/presence-go
      - run: go vet ./... && go test ./...
        working-directory: services/presence-go
      - run: gofmt -l . | (! grep .)
        working-directory: services/venue-go
      - run: go vet ./... && go test ./...
        working-directory: services/venue-go
      - run: gofmt -l . | (! grep .)
        working-directory: services/consent-go
      - run: go vet ./... && go test ./...
        working-directory: services/consent-go
