# Routes for the dev compose stack (standalone mode — see config.yaml).
# Keep in sync with the ConfigMap in deploy/k8s/apisix.yaml; only the
# upstream hostnames differ (compose service names vs cluster DNS).
routes:
  - id: edge-api
    uri: /v1/*
    upstream:
      type: roundrobin
      nodes: { "edge:4000": 1 }
    plugins:
      request-id:
        header_name: X-Request-Id
        include_in_response: true
      response-rewrite:
        headers:
          set:
            Strict-Transport-Security: "max-age=63072000; includeSubDomains"   # INF-11
            Content-Security-Policy: "default-src 'none'; frame-ancestors 'none'"   # INF-11 (API surface)
            X-Content-Type-Options: nosniff
  - id: realtime-ws
    uri: /connection/*
    upstream:
      type: roundrobin
      nodes: { "centrifugo:8000": 1 }
    enable_websocket: true
    plugins:
      request-id:
        header_name: X-Request-Id
        include_in_response: true
  - id: keycloak-oidc
    uris: ["/realms/*", "/resources/*"]
    upstream:
      type: roundrobin
      nodes: { "keycloak:8080": 1 }
  # AMD-CON-01: the workforce console PWA, host-matched. The edge-api route
  # above still matches /v1/* on this host (longer prefix wins), so the
  # console and the API share an origin at the gateway — no CORS surface.
  - id: ops-console
    host: ops.presence.example
    uris: ["/*"]
    upstream:
      type: roundrobin
      nodes: { "console:8080": 1 }
    plugins:
      request-id:
        header_name: X-Request-Id
        include_in_response: true
ssl:
  - snis: ["localhost"]
    cert: /usr/local/apisix/conf/tls/dev-cert.pem   # SEC-06 dev-only cert from deploy/apisix/dev-tls.sh
    key: /usr/local/apisix/conf/tls/dev-key.pem
#END
