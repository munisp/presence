# APISIX standalone (etcd-less) config for the dev compose stack.
# Mirrors deploy/k8s/apisix.yaml with compose service names.
#
# SEC-06: TLS 1.3 terminates here in dev too — the public listener is
# 9443 (HTTP/2, TLS-only); plaintext 9080 is gone from the published
# ports. The self-signed dev certificate comes from
# deploy/apisix/dev-tls.sh (run it once per checkout); K8s uses
# cert-manager instead (SEC-07).
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml
apisix:
  node_listen:
    - port: 9443
      enable_http2: true
      tls: true
  enable_admin: false
  proxy_mode: http&stream
nginx_config:
  http:
    ssl_protocols: TLSv1.3        # TR-26: TLS 1.3 only — downgrade is impossible at the listener
    ssl_session_cache: shared:SSL:10m
    ssl_session_timeout: 10m
plugins:
  - request-id
  - response-rewrite
  - limit-count
#END
