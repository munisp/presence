# NFR-33: the P0 alert set as a PrometheusRule. One alert per required class:
# SLO burn, error spike, presence-publish failure, match-rate collapse and
# moderation queue age. Every alert names its owner (NFR-34) and links its
# runbook entry (docs/runbook.md).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: presence-alerts
  namespace: presence
  labels:
    app: presence
spec:
  groups:
    - name: presence.slo
      rules:
        - alert: PresenceSLOBurn
          # p95 above the 120 ms budget (INF-01/INF-10) sustained over 15 min.
          expr: |
            histogram_quantile(0.95,
              sum(rate(presence_http_request_duration_seconds_bucket[5m])) by (le)
            ) > 0.120
          for: 15m
          labels:
            severity: page
            owner: edge-oncall
          annotations:
            summary: "Edge p95 latency burning the 120 ms SLO"
            runbook: "docs/runbook.md#presencesloburn"

        - alert: PresenceErrorSpike
          # 5xx share above 2% of requests over 10 min.
          expr: |
            sum(rate(presence_http_requests_total{status=~"5.."}[5m]))
              /
            sum(rate(presence_http_requests_total[5m])) > 0.02
          for: 10m
          labels:
            severity: page
            owner: edge-oncall
          annotations:
            summary: "Edge 5xx rate above 2%"
            runbook: "docs/runbook.md#presenceerrorspike"

        - alert: PresencePublishFailure
          # Any presence publish failing — the discovery surface is down for
          # the affected users (FR-12).
          expr: |
            increase(presence_publish_failures_total[5m]) > 0
          for: 5m
          labels:
            severity: page
            owner: edge-oncall
          annotations:
            summary: "Presence publishes failing"
            runbook: "docs/runbook.md#presencepublishfailure"

        - alert: MatchRateCollapse
          # Served matches per second collapsed to under 20% of the trailing
          # hour while scans continue — the scoring path is sick, not quiet.
          expr: |
            sum(rate(match_served_total[10m]))
              <
            0.2 * sum(rate(match_served_total[1h] offset 1h))
              and
            sum(rate(match_scan_requests_total[10m])) > 0.1
          for: 15m
          labels:
            severity: page
            owner: match-oncall
          annotations:
            summary: "Match serve rate collapsed relative to scan demand"
            runbook: "docs/runbook.md#matchratecollapse"

        - alert: ModerationQueueAge
          # Oldest untriaged report older than one hour (moderation SLA).
          expr: |
            max(moderation_oldest_open_report_seconds) > 3600
          for: 10m
          labels:
            severity: ticket
            owner: trust-safety-lead
          annotations:
            summary: "Moderation queue ageing past the 1 h SLA"
            runbook: "docs/runbook.md#moderationqueueage"

        - alert: RealtimeDeliverySlow
          # NFR-07: message delivery sender → recipient device, p95 ≤ 500 ms.
          # The server-side leg is the realtime publish; when its p95 sits
          # above the 500 ms budget for 15 min the end-to-end SLO cannot be
          # met and the realtime path needs attention first.
          expr: |
            histogram_quantile(0.95,
              sum(rate(presence_realtime_publish_duration_seconds_bucket[5m])) by (le)
            ) > 0.5
          for: 15m
          labels:
            severity: page
            owner: realtime-oncall
          annotations:
            summary: "Realtime publish p95 above the 500 ms NFR-07 budget"
            runbook: "docs/runbook.md#realtimedeliveryslow"

        - alert: ScanAvailabilityBurn
          # NFR-13: 99.9% measured scan-path availability over 30 days.
          # Multi-window burn-rate alert on the scan error budget (0.1%):
          # fast window 1 h/5 m at 14.4x burn, slow window 6 h/30 m at 6x —
          # both must fire, so a single bad minute cannot page. The scan path
          # is /v1/scan plus its presence-publish dependency.
          expr: |
            (
              sum(rate(presence_http_requests_total{route=~"/v1/(scan|presence)",status=~"5.."}[1h]))
              /
              sum(rate(presence_http_requests_total{route=~"/v1/(scan|presence)"}[1h]))
              > 14.4 * 0.001
            )
            and
            (
              sum(rate(presence_http_requests_total{route=~"/v1/(scan|presence)",status=~"5.."}[6h]))
              /
              sum(rate(presence_http_requests_total{route=~"/v1/(scan|presence)"}[6h]))
              > 6 * 0.001
            )
          for: 5m
          labels:
            severity: page
            owner: edge-oncall
          annotations:
            summary: "Scan path burning the 99.9% availability budget (NFR-13)"
            runbook: "docs/runbook.md#scanavailabilityburn"
