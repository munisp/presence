# AMD-CON-01: the workforce ops console PWA (see console/ and
# docs/ux/ops-console.md). The static shell is served by the console image
# (nginx); two ConfigMaps make the same image work in-cluster: one pins
# the environment's OIDC issuer/redirect (config.json), one repoints the
# /v1/ proxy at the cluster edge service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: console-config
  namespace: presence
data:
  config.json: |
    {
      "issuer": "https://auth.presence.example/realms/workforce",
      "clientId": "workforce-console",
      "redirectUri": "https://ops.presence.example/auth/callback",
      "scope": "openid profile",
      "apiBase": ""
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: console-nginx
  namespace: presence
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        types {
            application/manifest+json webmanifest;
        }

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://auth.presence.example; frame-ancestors 'none'; base-uri 'self'" always;

        location = /sw.js {
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        location /icons/ {
            add_header Cache-Control "public, max-age=604800, immutable" always;
        }

        location /dist/ {
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        location /v1/ {
            proxy_pass http://edge.presence.svc.cluster.local:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: presence
  labels: { app: console }
spec:
  replicas: 2
  selector:
    matchLabels: { app: console }
  template:
    metadata:
      labels: { app: console }
    spec:
      containers:
        - name: console
          image: presence/console:p0   # built from console/ (Dockerfile, nginx:1.27-alpine)
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /index.html, port: 8080 }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          volumeMounts:
            - name: console-config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
            - name: console-nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: console-config
          configMap: { name: console-config }
        - name: console-nginx
          configMap: { name: console-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: presence
spec:
  selector: { app: console }
  ports: [{ port: 8080, targetPort: 8080 }]
