# Edge API (TECH-03). Public traffic reaches it only through APISIX
# (NetworkPolicy, INF-12). Verifies Keycloak RS256 tokens via the realm JWKS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: presence
  labels: { app: edge, app.kubernetes.io/part-of: presence }
spec:
  replicas: 3
  selector:
    matchLabels: { app: edge }
  template:
    metadata:
      labels: { app: edge, app.kubernetes.io/part-of: presence }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: edge
          image: presence/edge:p0   # built from services/edge (Dockerfile, node:22-alpine)
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4000 }]
          env:
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: presence-secrets, key: EDGE_DATABASE_URL } }
            - name: VALKEY_URL
              value: redis://valkey:6379
            - name: MATCH_SERVICE_URL
              value: http://match:4100
            - name: CENTRIFUGO_URL
              value: http://centrifugo:8000
            - name: CENTRIFUGO_API_KEY
              valueFrom: { secretKeyRef: { name: presence-secrets, key: CENTRIFUGO_API_KEY } }
            # AMD-CRT-04: the edge signs client connection tokens with the
            # same HMAC secret Centrifugo verifies against (POST
            # /v1/realtime/token); the public URL ships in the bootstrap
            # config so deployments without a realtime tier fail closed.
            - name: CENTRIFUGO_TOKEN_HMAC_SECRET_KEY
              valueFrom: { secretKeyRef: { name: presence-secrets, key: CENTRIFUGO_TOKEN_HMAC_SECRET_KEY } }
            - name: REALTIME_PUBLIC_WS_URL
              value: wss://rt.presence.example/connection/websocket   # per environment
            - name: RECOVERY_HASH_KEY   # SEC-09: HMAC key for recovery-phone hashes — rotation is a rolling restart
              valueFrom: { secretKeyRef: { name: presence-secrets, key: RECOVERY_HASH_KEY } }
            - name: KEYCLOAK_ISSUER
              value: https://auth.presence.example/realms/consumer   # per environment
            # FR-01: the DEVICE-REACHABLE issuer the app signs in against,
            # served at GET /v1/client/config. KEYCLOAK_ISSUER above is the
            # URL the EDGE verifies tokens against — a phone cannot resolve
            # an in-cluster name. Both are public values (no secret material).
            - name: KEYCLOAK_PUBLIC_ISSUER_URL
              value: https://auth.presence.example/realms/consumer   # per environment
            - name: KEYCLOAK_CLIENT_ID
              value: presence-app   # the realm-exported public client (deploy/keycloak/realm-consumer.json)
            - name: OTEL_EXPORTER_OTLP_ENDPOINT   # TECH-11/12: traces by default
              value: http://otel-collector.monitoring:4318
            - name: DEPLOY_ENV
              value: production   # per environment
            # FR-56: push pipeline credentials — the pipeline is dormant when
            # the store leaves these unset (APNs needs all four; FCM the pair).
            - name: APNS_TEAM_ID
              valueFrom: { secretKeyRef: { name: presence-secrets, key: APNS_TEAM_ID, optional: true } }
            - name: APNS_KEY_ID
              valueFrom: { secretKeyRef: { name: presence-secrets, key: APNS_KEY_ID, optional: true } }
            - name: APNS_KEY_P8
              valueFrom: { secretKeyRef: { name: presence-secrets, key: APNS_KEY_P8, optional: true } }
            - name: APNS_TOPIC
              valueFrom: { secretKeyRef: { name: presence-secrets, key: APNS_TOPIC, optional: true } }
            - name: FCM_PROJECT_ID
              valueFrom: { secretKeyRef: { name: presence-secrets, key: FCM_PROJECT_ID, optional: true } }
            - name: FCM_ACCESS_TOKEN
              valueFrom: { secretKeyRef: { name: presence-secrets, key: FCM_ACCESS_TOKEN, optional: true } }
            # AMD-WA-02/04: WhatsApp Cloud API wires. Unset app secret /
            # verify token answers 503 on the webhook; unset access token /
            # phone number id makes the notification leg a documented
            # no-op. WHATSAPP_DEV_ECHO deliberately has NO k8s entry — the
            # echo sender is compose-only and must never exist here.
            - name: WHATSAPP_APP_SECRET
              valueFrom: { secretKeyRef: { name: presence-secrets, key: WHATSAPP_APP_SECRET, optional: true } }
            - name: WHATSAPP_VERIFY_TOKEN
              valueFrom: { secretKeyRef: { name: presence-secrets, key: WHATSAPP_VERIFY_TOKEN, optional: true } }
            - name: WHATSAPP_ACCESS_TOKEN
              valueFrom: { secretKeyRef: { name: presence-secrets, key: WHATSAPP_ACCESS_TOKEN, optional: true } }
            - name: WHATSAPP_PHONE_NUMBER_ID
              valueFrom: { secretKeyRef: { name: presence-secrets, key: WHATSAPP_PHONE_NUMBER_ID, optional: true } }
            # SEC-03: the JIT elevation role binding. Without the client
            # credentials the binding is a documented no-op and operators
            # bind manually (deploy/keycloak/README.md).
            - name: KEYCLOAK_ADMIN_BASE_URL
              value: http://keycloak:8080   # in-cluster; per environment
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              valueFrom: { secretKeyRef: { name: presence-secrets, key: KEYCLOAK_ADMIN_CLIENT_ID, optional: true } }
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: presence-secrets, key: KEYCLOAK_ADMIN_CLIENT_SECRET, optional: true } }
            # TR-33: TLS pinning policy served at GET /v1/client/config. Pins
            # are PUBLIC sha256/SPKI fingerprints (no secret material), so they
            # live as plain env. Empty pins = pinning disabled. Rotating or
            # REMOVING pins = edit the value + bump CLIENT_CONFIG_VERSION —
            # no app update, installed clients can never be bricked by a pin.
            - name: CLIENT_CONFIG_VERSION
              value: "1"   # monotonic; bump on every change (TR-20 discipline)
            - name: CLIENT_TLS_PINS
              value: ""   # comma-separated sha256/SPKI base64 pins; empty disables pinning
            # TR-27: minimum client protocol version served. Builds below this
            # floor learn it from GET /v1/client/config (exempt from the 426
            # floor) and must prompt for an update. Raise only with a
            # coordinated client rollout — the floor is a kill-switch, not a
            # target.
            - name: CLIENT_MIN_VERSION
              value: "1"
          readinessProbe: { httpGet: { path: /healthz, port: 4000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 4000 }, periodSeconds: 10 }
          resources:   # INF-05: 3 x 2 vCPU / 4 GB
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "2", memory: 4Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: presence
  labels: { app: edge }
spec:
  selector: { app: edge }
  ports: [{ name: http, port: 4000, targetPort: 4000 }]
---
# INF-10: same autoscaling contract as match — p95 > 120 ms for 3 minutes
# scales out; scale-in <= 1 pod per 10 minutes. NFR-11: this HPA is the
# linear 2x scale-out mechanism — no schema or client change; the
# loadtest/capacity.js PEAK_MULTIPLIER=2 run observes the pod count doubling.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edge
  namespace: presence
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: edge }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: External
      external:
        metric:
          name: presence_http_request_p95_ms   # prometheus-adapter: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{app="edge"}[3m])) * 1000
        target: { type: Value, value: "120" }
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 75 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 600
    scaleUp:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
