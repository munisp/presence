# Presence public API contract (TR-23)
#
# This document is the machine-readable schema for the edge API. The same
# constraints are enforced at runtime: every body/query/params schema on the
# Fastify routes sets additionalProperties: false, and unknown fields fail
# with a 400 before the handler runs. TECH-14: the contract suite
# (tests/test_openapi_contract.py) generates its assertions from this file —
# strictness of every body schema, doc↔route coverage in both directions.

openapi: 3.0.3
info:
  title: Presence edge API
  version: 1.0.0
  description: >-
    PRS-SRS-001 §5. All /v1 endpoints require a Keycloak consumer-realm bearer
    token (RS256 via JWKS; HS256 dev fallback per ADR-0003), except the
    unauthenticated bootstrap config GET /v1/client/config (TR-33). Sign-in is
    passkey-only (FR-01): the client runs Authorization Code + PKCE (S256) in
    the system browser against the passkey-only consumer realm, learns the
    device-reachable issuer from the bootstrap config, and attaches the FR-05
    x-device-id header alongside the bearer on every authed call. Responses never
    carry coordinates, metres, bearings, or pre-OPEN identity (TR-13/FR-25/
    FR-30). Schema violations answer 400; semantic violations answer 422;
    consent/offer conflicts answer 409. Every mutating endpoint accepts an
    optional Idempotency-Key header (TR-24): while the key is remembered
    (24 h), a replayed request returns the recorded response with
    Idempotency-Replayed: true instead of executing twice; a replay still in
    flight answers 409. Every response carries x-api-version, and a client
    build that identifies itself (x-client-version) below the server's
    published floor answers 426 upgrade_required (TR-27) — the bootstrap
    config is exempt so outdated clients can always learn their status.
servers:
  - url: https://localhost:9443
    description: local compose, via the APISIX gateway over TLS 1.3 (TECH-21, SEC-06)
paths:
  /healthz:
    get:
      summary: Liveness probe (unauthenticated)
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
  /v1/client/config:
    get:
      summary: Client security and compatibility config (TR-33, TR-27)
      security: []
      description: >-
        Unauthenticated bootstrap config the client reads at startup, before
        login completes. Carries the monotonic config version and the TLS
        certificate-pinning policy: pins present means pinning enabled, empty
        means disabled. Ops rotate or remove the pin set by changing
        server-side configuration and bumping the version only — no app
        update, so a pin incident can never brick installed clients (the
        SRS's condition on pinning being allowed at all). SPKI pin
        fingerprints are public values; the payload carries no user data.
        The api object is the bootstrap channel of TR-27: a client whose
        protocol version is below minClientVersion (or that does not
        understand version) must prompt for an update rather than fail
        silently. This route is exempt from the 426 floor on purpose.
        The auth object is the FR-01 sign-in bootstrap: the device-reachable
        issuer of the passkey-only consumer realm and the realm's public
        client id. The client runs Authorization Code + PKCE (S256) in the
        system browser against this issuer — the passkey ceremony never
        touches app code, and no password is ever set. An empty issuer
        means sign-in is unavailable; the client must not guess endpoints.
      responses:
        "200":
          description: >-
            Current client config. AMD-NET-04: responses carry a strong
            ETag ("v{configVersion}-{pin-set hash}") and
            Cache-Control: max-age=60; send If-None-Match to revalidate.
          headers:
            ETag:
              schema: { type: string }
              description: strong validator derived from the config version and the pin-set hash (AMD-NET-04)
            Cache-Control:
              schema: { type: string }
              description: max-age=60
          content:
            application/json:
              schema:
                type: object
                required: [configVersion, pinning, api, auth, realtime]
                properties:
                  configVersion: { type: integer, minimum: 1 }
                  pinning:
                    type: object
                    required: [enabled, pins]
                    properties:
                      enabled: { type: boolean }
                      pins:
                        type: array
                        items: { type: string }
                  api:
                    type: object
                    required: [version, minClientVersion]
                    properties:
                      version:
                        type: integer
                        minimum: 1
                        description: the API major this edge speaks (TR-27)
                      minClientVersion:
                        type: integer
                        minimum: 1
                        description: minimum client protocol version served (TR-27)
                  auth:
                    type: object
                    required: [issuer, clientId]
                    properties:
                      issuer:
                        type: string
                        description: device-reachable issuer of the passkey-only consumer realm (FR-01)
                      clientId:
                        type: string
                        description: the realm's public client for the app (FR-01)
                  realtime:
                    type: object
                    required: [wsUrl]
                    properties:
                      wsUrl:
                        type: string
                        description: >-
                          AMD-CRT-04: the device-reachable Centrifugo
                          websocket URL (through the gateway). Empty means
                          the deployment has no realtime tier and the
                          client adapter stays off — fail closed. The
                          connection token comes from the authed
                          /v1/realtime/token, never from this payload.
        "304":
          description: >-
            AMD-NET-04: config unchanged since the client's ETag — no body,
            one round trip (the AMD-NET-05 configRevalidate budget).
  /v1/realtime/token:
    post:
      summary: Issue a Centrifugo connection token (AMD-CRT-04)
      description: >-
        Issues the HS256 connection JWT the client's realtime adapter
        presents to Centrifugo. The token lives 600 seconds (the client
        refreshes 60 s before expiry) and its channels claim allowlists
        exactly the member's own user channel plus the pair channel of
        every pair they belong to that has not closed — the subscription
        privacy boundary is enforced server-side by Centrifugo against
        this claim. Fail closed: without the HMAC secret configured the
        route answers 503 rather than issuing anything.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Connection token and its subscription allowlist.
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresIn, channels]
                properties:
                  token:
                    type: string
                    description: HS256 JWT — sub, iat, exp, channels
                  expiresIn:
                    type: integer
                    description: token lifetime in seconds (600)
                  channels:
                    type: array
                    items: { type: string }
                    description: the subscription allowlist — user:{id} plus pair:{pairId} per open pair
        "503":
          description: Realtime tier not configured (no HMAC secret) — fail closed.
  /v1/presence:
    post:
      summary: Enter or heartbeat presence (FR-14, FR-16, TR-12/14/15)
      description: >-
        Body carries a client-computed H3 cell only — coordinate-shaped fields
        are rejected (TR-15). Age-blocked or deleted accounts receive the
        neutral 403 (FR-02/FR-04); invisible accounts cannot publish at all
        (FR-18). A publish without a live session starts one and returns its
        FR-16 session id; heartbeats present the live id to keep it, and a
        stale id is rejected with a 409. Consecutive fixes that imply
        impossible travel are refused with a 422 (SEC-20). Client-side
        publish disciplines (client/): the platform accuracy grant is read
        before any publish and approximate-only refuses with the check-in
        offer (FR-88); the published cell is the modal cell of a five-minute
        window unless the device moved more than one cell (FR-92); the
        publish cadence is 300 s standard and never more often than 600 s in
        reduced-power mode (FR-85) — both strictly below the 900 s FR-14
        session TTL.
      parameters:
        - name: x-app-attest-assertion
          in: header
          required: true
          schema: { type: string }
          description: App Attest / Play Integrity assertion (FR-51/SEC-19).
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cell]
              additionalProperties: false
              properties:
                cell: { type: string, description: H3 cell id, resolution 11 }
                venueId: { type: string }
                floorId:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{1,32}$"
                  description: >-
                    FR-99 floor attribution from a verified check-in
                    (FR-100); requires venueId and a floor the venue declared
                sessionId:
                  type: string
                  pattern: "^[0-9a-f]{32}$"
                  description: live FR-16 session id on heartbeats; omit to start a new session
      responses:
        "200":
          description: Presence stored with the 900 s TTL.
          content:
            application/json:
              schema:
                type: object
                required: [ok, cell, ttl, sessionId, event]
                properties:
                  ok: { type: boolean }
                  cell: { type: string, description: cell as stored, coarsened to the venue resolution }
                  ttl: { type: integer, example: 900 }
                  sessionId: { type: string, description: FR-16 session id — the only handle scan results expose pre-OPEN }
                  event:
                    type: [object, "null"]
                    description: >-
                      FR-43: when the venue hosts a live event (now inside its
                      window) the presence is attributable to it and the event
                      is echoed back; null otherwise.
                    properties:
                      eventId: { type: string, format: uuid }
                      name: { type: string }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "401": { description: Missing token or app-attestation assertion. }
        "403": { description: Discovery unavailable (neutral — FR-02/FR-04) or account invisible (FR-18). }
        "409": { description: Presented session id is not the live one; start a new session (FR-16). }
        "422": { description: Invalid H3 cell, coordinate-shaped payload (TR-15), impossible travel (SEC-20), or an undeclared floorId (FR-99). }
    delete:
      summary: Leave; presence and cell membership are removed (FR-19)
      description: >-
        FR-19: clients withdraw presence within 60 seconds of the app
        entering the background unless the user enabled background
        presence; this endpoint is the withdrawal wire target.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Presence removed.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
  /v1/presence/checkin:
    post:
      summary: Redeem a check-in token (FR-100)
      description: >-
        The client scans the venue's per-floor code (QR/NFC) and posts the
        token here; the edge verifies the HMAC signature against the venue's
        server-side secret and answers with the (venueId, floorId) pair to
        attribute the next presence publish to. Tokens are short-lived
        (≤ 300 s) and single-purpose; an invalid, tampered or expired token
        answers the same 401 — no oracle on which part failed. FR-88: this
        endpoint is the alternative every reduced-accuracy refusal offers —
        check-in needs no location grant at all.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, maxLength: 512, description: pc1.<claims>.<signature> }
      responses:
        "200":
          description: Token verified; floor attribution for the next presence publish.
          content:
            application/json:
              schema:
                type: object
                required: [venueId, floorId, expiresAt]
                properties:
                  venueId: { type: string, format: uuid }
                  floorId: { type: string }
                  expiresAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "401": { description: Invalid or expired check-in token (FR-100). }
  /v1/presence/intent:
    put:
      summary: Declare a time-boxed intent (FR-17)
      description: >-
        One word from the governed vocabulary, attached to live presence.
        It expires with presence or after sixty minutes, whichever comes
        first; it never persists to the profile. A shared active intent is
        surfaced as a match signal on scan results.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent]
              additionalProperties: false
              properties:
                intent:
                  type: string
                  enum: [coffee, food, chat, walk, dance, network, explore, quiet]
      responses:
        "200": { description: Intent declared; expires with presence or in 60 minutes. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "409": { description: No live presence; enter a venue first. }
        "422": { description: Intent outside the governed vocabulary. }
    get:
      summary: My current intent (FR-17)
      responses:
        "200": { description: Current intent. }
        "204": { description: No active intent. }
    delete:
      summary: Clear my intent early (FR-17)
      description: Idempotent.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Cleared (or none was set). }
  /v1/devices/attestation-challenge:
    post:
      summary: Mint a verified-enrolment challenge (FR-51/SEC-19)
      description: >-
        Single-use 256-bit challenge, 120-second TTL. The verified enrolment
        signs sha256(challenge:userId) with the platform attestation key and
        presents it in the enrolment body's `attestation` object; the
        registry enforces a monotonic counter. Protocol and the documented
        fallback: docs/security/attestation.md.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Challenge minted. }
  /v1/devices:
    post:
      summary: Enrol a device (FR-05, FR-07, FR-51/SEC-19)
      description: >-
        Attestation-gated enrolment. At most three devices stay enrolled
        concurrently; a fourth is refused (FR-05) and the account's other
        sessions are notified. The attestation key hash is registered for
        duplicate-account detection — a collision is recorded silently and
        the response stays neutral either way (FR-07). Re-enrolling an
        already-enrolled device refreshes it. With the optional
        `attestation` object the key is cryptographically verified
        (challenge-bound signature, monotonic counter) and the account
        becomes discovery-eligible (FR-51); without it the enrolment is
        accepted but unverified and the account cannot appear in results
        until it verifies.
      parameters:
        - name: x-app-attest-assertion
          in: header
          required: false
          schema: { type: string }
          description: >-
            App Attest / Play Integrity assertion. Required when the body
            carries no `attestation` object (FR-51/SEC-19).
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                label: { type: string }
                attestation:
                  type: object
                  additionalProperties: false
                  required: [platform, publicKey, counter, signature]
                  properties:
                    platform: { type: string, enum: [app_attest, play_integrity] }
                    publicKey: { type: string, description: base64 SPKI (P-256) }
                    counter: { type: integer, minimum: 0 }
                    signature: { type: string, description: base64 ECDSA P-256 over sha256(challenge:userId) }
      responses:
        "201": { description: Device enrolled (or refreshed). }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "401": { description: Missing app-attestation assertion, or the verified assertion failed. }
        "409": { description: Device limit reached; revoke a device first (FR-05). }
        "422": { description: Label or attestation object fails validation. }
    get:
      summary: My enrolled devices (FR-05)
      responses:
        "200": { description: Own device list, enrolment order. }
  /v1/devices/{deviceId}:
    delete:
      summary: Revoke one of my devices (FR-05, SEC-02)
      description: >-
        Idempotent; a foreign or already-revoked id is a no-op. Revocation
        denies the device's sessions immediately — the denylist write
        precedes the response, meeting the 60-second SEC-02 budget.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Revoked (or nothing to revoke). }
  /v1/devices/{deviceId}/push-token:
    put:
      summary: Register the device's push token (FR-56)
      description: >-
        One current APNs/FCM token per device, owner-managed. Push payloads
        carry only a notification type and an opaque identifier — never
        profile content, reason text, handles or location.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platform, token]
              properties:
                platform: { type: string, enum: [ios, android] }
                token: { type: string, maxLength: 512 }
      responses:
        "200": { description: Token registered. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "404": { description: Device not found (or revoked). }
        "409": { description: Token already registered on another device. }
        "422": { description: Token is not a plausible push token. }
  /v1/moderation/attestation-fallbacks/{userId}:
    post:
      summary: Approve an attestation fallback waiver (SEC-19)
      description: >-
        Moderator only. One open waiver per account; the waiver makes the
        account discovery-eligible without a verified key, is written to
        admin_audit, and is revocable. Procedure:
        docs/security/attestation.md.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201": { description: Waiver approved (idempotent). }
        "403": { description: Moderator role required. }
    delete:
      summary: Revoke an attestation fallback waiver (SEC-19)
      description: Moderator only; audited. The account leaves discovery within one corpus refresh.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Waiver revoked. }
        "403": { description: Moderator role required. }
        "404": { description: No open waiver for this account. }
  /v1/console/elevation/requests:
    post:
      summary: Request just-in-time elevation (SEC-03)
      description: >-
        Workforce realm + elevation-eligible role. One open request per
        subject and scope; re-requesting is idempotent. The justification
        is screened like any other free text. Approval is four-eyes: a
        DIFFERENT moderator must decide, and the grant lives at most 4
        hours (pinned to the realm session ceiling). docs/security/elevation.md.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [justification]
              additionalProperties: false
              properties:
                scope: { type: string, enum: [moderation] }
                # Bounds (10–500 chars) are enforced by the edge parser so
                # they can return a 422 with an explanation.
                justification: { type: string }
      responses:
        "201": { description: Request recorded (or the open request returned). }
        "403": { description: Elevation-eligible role required. }
        "422": { description: Scope or justification invalid, or screening failed. }
  /v1/console/elevation/requests/mine:
    get:
      summary: My elevation requests (SEC-03)
      description: Workforce realm + elevation-eligible role; the requester's own requests, newest first.
      responses:
        "200": { description: The requester's elevation requests. }
        "403": { description: Elevation-eligible role required. }
  /v1/moderation/elevation:
    get:
      summary: The elevation queue (SEC-03)
      description: Moderator only. Pending requests oldest-first, then the most recent decisions.
      responses:
        "200": { description: Pending requests followed by recent decisions. }
        "403": { description: Moderator role required. }
  /v1/moderation/elevation/{requestId}/approve:
    post:
      summary: Approve an elevation request, four-eyes (SEC-03)
      description: >-
        Moderator only; the approver must differ from the requester
        (enforced by the definer AND the table CHECK). The grant window is
        4 hours from the decision; the edge binds the workforce realm role
        for exactly that window. Audited.
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Grant approved; expiresAt returned. }
        "403": { description: Moderator role required. }
        "404": { description: Elevation request not found. }
        "409": { description: Not pending, or four-eyes violation. }
  /v1/moderation/elevation/{requestId}/reject:
    post:
      summary: Reject an elevation request (SEC-03)
      description: Moderator only; closes the pending request without a grant. Audited.
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Request rejected. }
        "403": { description: Moderator role required. }
        "404": { description: Elevation request not found. }
        "409": { description: Request is not pending. }
  /v1/moderation/elevation/{requestId}/revoke:
    post:
      summary: Revoke a live elevation grant (SEC-03)
      description: >-
        Moderator only; ends the grant early and unbinds the realm role in
        the same request. Audited.
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Grant revoked. }
        "403": { description: Moderator role required. }
        "404": { description: Elevation request not found. }
        "409": { description: Grant is not active. }
  /v1/devices/mock-location-refusal:
    post:
      summary: Record a client mock-location refusal (SEC-36)
      description: >-
        The client detected the platform mock-location flag and refused to
        publish presence; this endpoint records the refusal in the
        append-only security-event store (SEC-30) for abuse review. The
        refusal is never disclosed to other users — the only read path is
        the moderation console.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                platform: { type: string, enum: [android, ios] }
      responses:
        "202":
          description: Refusal recorded.
          content:
            application/json:
              schema:
                type: object
                required: [recorded]
                properties:
                  recorded: { type: boolean }
        "400": { $ref: "#/components/responses/SchemaViolation" }
  /v1/profile/interests/link:
    post:
      summary: Link free text to taxonomy nodes (FR-09, TECH-09)
      description: >-
        Proposes up to five governed taxonomy nodes for a free-text phrase,
        ranked by pgvector cosine similarity over the taxonomy embedding
        space. Sensitive and redirected nodes never surface, and nodes the
        caller already declared are excluded. This route never writes:
        per-node confirmation happens client-side and each confirmed node
        is added through the governed interests endpoint (FR-08).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: { type: string }
      responses:
        "200":
          description: Ranked link candidates with the embedder identity.
          content:
            application/json:
              schema:
                type: object
                required: [embedder, candidates]
                properties:
                  embedder: { type: string }
                  candidates:
                    type: array
                    items:
                      type: object
                      required: [nodeId, label, similarity]
                      properties:
                        nodeId: { type: string }
                        label: { type: string }
                        similarity: { type: number }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "422": { description: Text fails validation or screening. }
  /v1/taxonomy/releases:
    post:
      summary: Create a draft taxonomy release (FR-59)
      description: >-
        Workforce taxonomists only. The release carries an ordered list of
        governed operations (add_node, edit_label, set_sensitive, deprecate,
        add_link, remove_link); node deletion is not an operation. Nothing
        touches the live taxonomy until publish.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, ops]
              additionalProperties: false
              properties:
                message: { type: string }
                ops:
                  type: array
                  items: { type: object }
      responses:
        "201": { description: Draft release created. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Taxonomist role required. }
        "422": { description: Message or an operation fails validation. }
    get:
      summary: List taxonomy releases (FR-59)
      responses:
        "200": { description: Newest first, at most 100. }
        "403": { description: Taxonomist role required. }
  /v1/taxonomy/releases/{releaseId}:
    get:
      summary: Release detail with operations (FR-59, TR-20)
      parameters:
        - name: releaseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Release with its ordered operations and diff summary. }
        "403": { description: Taxonomist role required. }
        "404": { description: Release not found. }
  /v1/taxonomy/releases/{releaseId}/submit:
    post:
      summary: Submit a draft for review (FR-59)
      parameters:
        - name: releaseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Release is in review. }
        "403": { description: Taxonomist role required. }
        "409": { description: Release not found or not a draft. }
  /v1/taxonomy/releases/{releaseId}/approve:
    post:
      summary: Approve a release — second person only (FR-59)
      description: The author can never approve their own release.
      parameters:
        - name: releaseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Release approved. }
        "403": { description: Taxonomist role required. }
        "409": { description: Not in review, or review requires a second person. }
  /v1/taxonomy/releases/{releaseId}/publish:
    post:
      summary: Publish an approved release (FR-59, TR-20, BR-21)
      description: >-
        One transaction: snapshot the pre-publish state, apply the
        operations (re-validated against live state), assign the monotonic
        version, record the diff summary, record the licence provenance
        (BR-21: Wikidata-derived structure, CC0, attribution retained; no
        proprietary venue data), rebuild the closure (TR-18) and re-sync the
        embedding search space (TR-22). Audited (FR-60).
      parameters:
        - name: releaseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Published; carries the monotonic version. }
        "403": { description: Taxonomist role required. }
        "404": { description: Release not found. }
        "409": { description: Release must be approved before publish. }
        "422": { description: An operation no longer validates against live state. }
  /v1/taxonomy/releases/{releaseId}/rollback:
    post:
      summary: One-action rollback of the latest published release (FR-59)
      description: >-
        Restores the snapshot as a delta — rows referenced by user data are
        never touched. Refused while live data references nodes the release
        added; deprecate them in a new release instead. Audited (FR-60).
      parameters:
        - name: releaseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Rolled back to the pre-publish state. }
        "403": { description: Taxonomist role required. }
        "404": { description: Release not found. }
        "409": { description: Not the latest published release, or rollback blocked by live references. }
  /v1/telemetry/metrics:
    get:
      summary: The four §2.5 product metrics (NFR-32)
      description: >-
        Workforce analysts only. Computed synchronously from telemetry
        events written in the causing request — always computable within
        the five-minute budget; the response reports the age of the newest
        underlying event as evidence. Aggregate funnel figures only.
      parameters:
        - name: windowMinutes
          in: query
          schema: { type: integer, minimum: 1, maximum: 1440 }
      responses:
        "200": { description: Metric values with numerators, denominators and freshness. }
        "403": { description: Analyst role required. }
        "422": { description: windowMinutes out of range. }
  /v1/telemetry/export.csv:
    get:
      summary: Versioned CSV telemetry export (TR-34)
      description: >-
        The four §2.5 product metrics in the presence-telemetry/v1 CSV
        contract: a version marker line, then a stable column order —
        metric_key, window_start, window_end, value, numerator, denominator.
      parameters:
        - name: windowMinutes
          in: query
          schema: { type: integer, minimum: 1, maximum: 1440 }
      responses:
        "200": { description: text/csv document in the versioned contract. }
        "403": { description: Analyst role required. }
        "422": { description: windowMinutes out of range. }
  /v1/venues/{venueId}/checkin-tokens:
    post:
      summary: Mint a per-floor check-in token (FR-99, FR-100)
      description: >-
        Venue partner tokens only, and only for venues named in the token's
        venue_ids claim (BR-12). The floor must be declared on the venue
        (FR-99). The minted token is what the venue prints as that floor's
        QR/NFC code; the signing secret never leaves the server.
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [floorId]
              additionalProperties: false
              properties:
                floorId: { type: string, pattern: "^[A-Za-z0-9_-]{1,32}$" }
                ttlSeconds: { type: integer, minimum: 1, maximum: 300 }
      responses:
        "200":
          description: Token minted.
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt]
                properties:
                  token: { type: string, description: pc1.<claims>.<signature> }
                  expiresAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Venue partner token required (BR-12). }
        "404": { description: Floor not declared for this venue (FR-99). }
  /v1/scan:
    post:
      summary: Rate-limited discovery scan (FR-20…FR-27, SEC-20)
      description: >-
        Six scans per minute per user (FR-24), 200 per hour on top (SEC-20).
        Results carry score, band, ordered reasons and an icebreaker — never
        coordinates or identity (FR-25/FR-30). Each result is keyed by the
        pair id and the candidate's FR-16 presence session id; account ids
        never leave the edge before OPEN. Age-blocked or deleted accounts
        receive the neutral 403.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Scan results (possibly the explanatory empty state, FR-26).
          content:
            application/json:
              schema:
                type: object
                required: [state, results]
                properties:
                  state:
                    type: string
                    enum: [ok, quiet, paused]
                    description: >-
                      NFR-14: paused is the graceful-degradation state — the
                      matcher was unavailable, discovery is paused and the
                      client shows 'discovery paused' rather than an error;
                      results is empty and presence itself is unaffected.
                  results:
                    type: array
                    maxItems: 3
                    items:
                      type: object
                      required: [pairId, sessionId, score, band, reasons, icebreaker, diagramSpec]
                      properties:
                        pairId: { type: string, format: uuid, description: the DETECTED pair (FR-29) }
                        sessionId: { type: string, description: candidate's FR-16 presence session id }
                        score: { type: number, minimum: 0, maximum: 1 }
                        band: { type: string, description: H3 grid-distance band, never metres }
                        reasons:
                          type: array
                          description: ordered by contribution (TR-08)
                          items: { type: object }
                        icebreaker: { type: string }
                        diagramSpec:
                          type: integer
                          minimum: 1
                          description: >-
                            TR-35 — the versioned diagram spec this result's
                            node/edge semantics follow; the match surface must
                            render from this payload alone, and a client that
                            does not know the stamped version must prompt for
                            an update (TR-27) rather than guess.
                        prompts:
                          type: array
                          description: FR-64 structured prompts, screened at write time
                          items:
                            type: object
                            required: [slot, body]
                            properties:
                              slot: { type: integer, minimum: 1, maximum: 3 }
                              body: { type: string, maxLength: 120 }
                        sharedIntent:
                          type: string
                          nullable: true
                          description: FR-17 — the shared active intent, when both sides declared it.
                        recurrenceDays:
                          type: integer
                          description: FR-71 — distinct days this pair has been surfaced; never a timestamp.
                  mode:
                    type: string
                    enum: [rooms]
                    description: FR-44 crowd-mode transition — present only in the crowd band.
                  roomsUrl:
                    type: string
                    description: FR-44 — the venue's interest-room surface when mode is rooms.
        "403": { description: Discovery unavailable on this account (neutral — FR-02/FR-04). }
        "409": { description: No live presence; enter a venue first. }
        "429": { description: Scan rate limit exceeded (FR-24 per-minute, SEC-20 hourly, or FR-28 density budget). }
  /v1/consent:
    get:
      summary: My pairs and their states (FR-29…FR-37)
      description: >-
        Blocked pairs are invisible (FR-34); declined reads as expired (FR-32);
        pairs closed for more than 24 h are omitted (NFR-19).
      responses:
        "200":
          description: Pair list.
          content:
            application/json:
              schema:
                type: object
                required: [pairs]
                properties:
                  pairs:
                    type: array
                    items:
                      type: object
                      required: [pairId, state, counterpart, opened, closed, offerExpiresAt, conversationClosesAt]
                      properties:
                        pairId: { type: string, format: uuid }
                        state: { type: string, enum: [DETECTED, NUDGED, EXPRESSED, MUTUAL, OPEN] }
                        counterpart: { type: [string, "null"], description: revealed only while OPEN (FR-30) }
                        opened: { type: [string, "null"], format: date-time }
                        closed: { type: [string, "null"], description: masked close reason }
                        offerExpiresAt: { type: [string, "null"], format: date-time }
                        conversationClosesAt: { type: [string, "null"], format: date-time }
  /v1/consent/{pairId}/express:
    post:
      summary: Express interest (FR-29, FR-31, FR-33)
      parameters:
        - { $ref: "#/components/parameters/pairId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: New state (EXPRESSED or MUTUAL).
          content:
            application/json:
              schema:
                type: object
                required: [pairId, state]
                properties:
                  pairId: { type: string, format: uuid }
                  state: { type: string, enum: [EXPRESSED, MUTUAL] }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "404": { description: Pair not found. }
        "409": { description: Illegal transition (FR-29) or expired offer (FR-33). }
  /v1/consent/{pairId}/nudge:
    post:
      summary: Nudge a DETECTED pair (FR-57)
      description: >-
        Moves the pair DETECTED → NUDGED and renews the offer window. Nudges
        are scarce — a small daily ceiling per sender (429 when reached) —
        and quiet: the recipient's realtime event is suppressed inside their
        quiet window or when their nudges category is off. The event carries
        no actor identity (FR-30).
      parameters:
        - { $ref: "#/components/parameters/pairId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Nudge recorded.
          content:
            application/json:
              schema:
                type: object
                required: [pairId, state]
                properties:
                  pairId: { type: string, format: uuid }
                  state: { type: string, enum: [NUDGED] }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "404": { description: Pair not found. }
        "409": { description: Illegal transition (FR-29) or expired offer (FR-33). }
        "429": { description: Daily nudge limit reached (FR-57). }
  /v1/consent/{pairId}/open:
    post:
      summary: Open the channel from MUTUAL (FR-30, FR-37)
      parameters:
        - { $ref: "#/components/parameters/pairId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Channel open; the 24-h conversation clock starts.
          content:
            application/json:
              schema:
                type: object
                required: [pairId, state]
                properties:
                  pairId: { type: string, format: uuid }
                  state: { type: string, enum: [OPEN] }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "404": { description: Pair not found. }
        "409": { description: Illegal transition (FR-29) or expired offer (FR-33). }
  /v1/consent/{pairId}/decline:
    post:
      summary: Silent decline (FR-32)
      description: Always 204; the counterpart's realtime channel hears 'expired'.
      parameters:
        - { $ref: "#/components/parameters/pairId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Closed (or already closed — indistinguishable). }
        "400": { $ref: "#/components/responses/SchemaViolation" }
  /v1/consent/{pairId}/keep:
    post:
      summary: Keep vote on an OPEN conversation (FR-37)
      parameters:
        - { $ref: "#/components/parameters/pairId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Keep state after this vote.
          content:
            application/json:
              schema:
                type: object
                required: [pairId, kept, closesAt]
                properties:
                  pairId: { type: string, format: uuid }
                  kept: { type: boolean, description: true once both sides kept }
                  closesAt: { type: [string, "null"], format: date-time }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "404": { description: No open conversation for this pair. }
  /v1/blocks:
    post:
      summary: Block a user (FR-34)
      description: >-
        Immediate, silent, permanent mutual discovery removal; any existing
        pair closes invisibly. No realtime event is published.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              additionalProperties: false
              properties:
                userId: { type: string, format: uuid }
      responses:
        "201":
          description: Blocked.
          content:
            application/json:
              schema:
                type: object
                required: [blocked]
                properties:
                  blocked: { type: boolean }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "422": { description: Missing/self target. }
    get:
      summary: My own block list (blocker side only)
      responses:
        "200":
          description: Blocks filed by the caller.
          content:
            application/json:
              schema:
                type: object
                required: [blocks]
                properties:
                  blocks:
                    type: array
                    items:
                      type: object
                      required: [userId, at]
                      properties:
                        userId: { type: string, format: uuid }
                        at: { type: string, format: date-time }
  /v1/pairs/{pairId}/messages:
    post:
      summary: Relay an opaque MLS envelope (FR-36)
      description: >-
        OPEN pairs only, enforced by row-level security (FR-30/FR-36). The
        sender's first message to a pair is screened before storage; a
        violation answers 422 with category-level explanation and nothing is
        stored (FR-38/SEC-21).
      parameters:
        - { $ref: "#/components/parameters/pairId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [envelope]
              additionalProperties: false
              properties:
                envelope: { type: string, description: base64 MLS ciphertext }
      responses:
        "201":
          description: Stored and relayed.
          content:
            application/json:
              schema:
                type: object
                required: [messageId, sentAt]
                properties:
                  messageId: { type: string, format: uuid }
                  sentAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Pair is not OPEN (FR-30/FR-36). }
        "422":
          description: Invalid base64, or first message failed screening.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  categories:
                    type: array
                    items: { type: string, enum: [link, phone, email, bypass, scam] }
    get:
      summary: Read envelopes for an OPEN pair (RLS-gated)
      parameters:
        - { $ref: "#/components/parameters/pairId" }
        - name: after
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Envelopes ascending by send time (max 200).
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      required: [message_id, sender, envelope, sent_at, revoked]
                      properties:
                        message_id: { type: string, format: uuid }
                        sender: { type: string, format: uuid }
                        envelope: { type: [string, "null"], description: base64 MLS ciphertext; null once revoked (FR-41) }
                        sent_at: { type: string, format: date-time }
                        revoked: { type: boolean, description: FR-41 tombstone }
        "400": { $ref: "#/components/responses/SchemaViolation" }

  /v1/pairs/{pairId}/messages/{messageId}:
    delete:
      summary: Revoke an own message within 24 hours (FR-41)
      description: >-
        Sender-only (RESTRICTIVE RLS policy + column-limited grant). Within
        24 hours of sending, the envelope is blanked and the row tombstoned;
        after the window the message is permanent and the call answers 410.
        Repeating a revocation is idempotent.
      parameters:
        - { $ref: "#/components/parameters/pairId" }
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Message revoked (or already revoked). }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "404": { description: Message not found, or not the requester's. }
        "410": { description: The 24-hour revocation window has closed (FR-41). }

  /v1/announcements:
    get:
      summary: Live announcements (venue + global)
      description: Removed announcements never surface (FR-98).
      parameters:
        - name: venueId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Announcements inside their publish window.
          content:
            application/json:
              schema:
                type: object
                required: [announcements]
                properties:
                  announcements:
                    type: array
                    items:
                      type: object
                      properties:
                        announcement_id: { type: string, format: uuid }
                        venue_id: { type: [string, "null"] }
                        category: { type: string, enum: [social, work, lost_found, notice] }
                        body: { type: string }
                        publish_at: { type: string, format: date-time }
                        expire_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/SchemaViolation" }
    post:
      summary: Publish an announcement (FR-93, FR-95, FR-96, FR-97)
      description: >-
        Declared, unblocked accounts at least 24 h old only (FR-93 trust
        floor). One live announcement per account and one publish per 24 h
        (FR-95). The TTL is capped at four hours. Bodies are screened before
        storage (FR-96/SEC-37). The work category requires a
        verified-organisation token (FR-97, BR-33).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body, category]
              additionalProperties: false
              properties:
                venueId: { type: string }
                body: { type: string, minLength: 1, maxLength: 500 }
                category: { type: string, enum: [social, work, lost_found, notice] }
                ttlMinutes: { type: integer, minimum: 1, maximum: 240 }
      responses:
        "201":
          description: Announcement published.
          content:
            application/json:
              schema:
                type: object
                required: [announcementId, category, ttlMinutes, publishAt, expireAt]
                properties:
                  announcementId: { type: string, format: uuid }
                  category: { type: string }
                  ttlMinutes: { type: integer }
                  publishAt: { type: string, format: date-time }
                  expireAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Trust floor not met (FR-93) or work category without a verified organisation (FR-97). }
        "409": { description: One live announcement per account (FR-95). }
        "422": { description: Screened content rejected (SEC-37). }
        "429": { description: One publish per 24 h (FR-95). }
  /v1/announcements/{announcementId}/respond:
    post:
      summary: Respond to a live announcement (FR-94, FR-95)
      description: >-
        One screened response per account per announcement. The responder is
        anonymous to the publisher until accepted (inverted consent, FR-94).
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties:
                body: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: Response recorded.
          content:
            application/json:
              schema:
                type: object
                required: [ok, responseId]
                properties:
                  ok: { type: boolean }
                  responseId: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "404": { description: Announcement not found. }
        "409": { description: Announcement not live, own announcement, or already responded (FR-95). }
        "422": { description: Screened content rejected (SEC-37). }
  /v1/announcements/{announcementId}/responses:
    get:
      summary: Read responses — publisher only (FR-94, SEC-38)
      description: >-
        At most five responses are ever shown (FR-95). Responder identity is
        masked until the publisher accepts (SEC-38).
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Masked responses.
          content:
            application/json:
              schema:
                type: object
                required: [announcementId, responses]
                properties:
                  announcementId: { type: string, format: uuid }
                  responses:
                    type: array
                    maxItems: 5
                    items:
                      type: object
                      required: [responseId, body, createdAt, accepted, responder]
                      properties:
                        responseId: { type: string, format: uuid }
                        body: { type: string }
                        createdAt: { type: string, format: date-time }
                        accepted: { type: boolean }
                        responder: { type: [string, "null"], description: revealed only after acceptance (FR-94) }
        "403": { description: Only the publisher can read responses (SEC-38). }
        "404": { description: Announcement not found. }
  /v1/announcements/{announcementId}/responses/{responseId}/accept:
    post:
      summary: Accept a response (FR-94)
      description: Accepting reveals the responder's identity to the publisher.
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: responseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Response accepted.
          content:
            application/json:
              schema:
                type: object
                required: [ok, responseId, accepted]
                properties:
                  ok: { type: boolean }
                  responseId: { type: string, format: uuid }
                  accepted: { type: boolean }
        "403": { description: Only the publisher can accept responses (FR-94). }
        "404": { description: Announcement or response not found, or already accepted. }
  /v1/offers:
    get:
      summary: Venue offers inside their validity window
      parameters:
        - name: venueId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Active offers, soonest expiry first.
          content:
            application/json:
              schema:
                type: object
                required: [offers]
                properties:
                  offers:
                    type: array
                    items:
                      type: object
                      properties:
                        offer_id: { type: string, format: uuid }
                        title: { type: string }
                        terms: { type: string }
                        starts_at: { type: string, format: date-time }
                        ends_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/SchemaViolation" }
  /v1/venues/{venueId}/dashboard:
    get:
      summary: Aggregate-only venue dashboard (BR-12, BR-13)
      description: >-
        Venue partner tokens only, and only for venues named in the token's
        venue_ids claim. Every figure is k-anonymity suppressed (k = 11):
        below k the value is null, never the small number. No user-level
        data is served.
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Suppressed aggregates.
          content:
            application/json:
              schema:
                type: object
                required: [venueId, k, livePresence, scansLastHour, activeOffers, liveAnnouncements, liveEvent, liveEventPresence]
                properties:
                  venueId: { type: string, format: uuid }
                  k: { type: integer, example: 11 }
                  livePresence: { type: [integer, "null"] }
                  scansLastHour: { type: [integer, "null"] }
                  activeOffers: { type: [integer, "null"] }
                  liveAnnouncements: { type: [integer, "null"] }
                  liveEvent:
                    type: [object, "null"]
                    description: >-
                      FR-43: the event currently live at the venue
                      (starts_at ≤ now < ends_at), null when none is.
                    properties:
                      eventId: { type: string, format: uuid }
                      name: { type: string }
                      startsAt: { type: string, format: date-time }
                      endsAt: { type: string, format: date-time }
                  liveEventPresence:
                    type: [integer, "null"]
                    description: FR-43 live presence attributed to the live event, k-suppressed like every other figure.
        "403": { description: Venue partner token required (BR-12). }
  /v1/venues/{venueId}/registry:
    get:
      summary: Venue registry entry (FR-42)
      description: >-
        The venue's registry record: its geospatial cells (the attribution
        projection), partner status (prospect/active/suspended/offboarded)
        and operating schedule. Venue partner tokens only (BR-12).
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The registry entry.
          content:
            application/json:
              schema:
                type: object
                required: [venueId, name, partnerStatus, operatingSchedule, suspendedAt, h3Res, cells, liveEvent]
                properties:
                  venueId: { type: string, format: uuid }
                  name: { type: string }
                  partnerStatus: { type: string, enum: [prospect, active, suspended, offboarded] }
                  operatingSchedule:
                    type: [object, "null"]
                    description: "{ timezone?, weekly: [{day, open, close}] } — days mon..sun, times HH:MM."
                  suspendedAt: { type: [string, "null"], format: date-time }
                  h3Res: { type: integer }
                  cells: { type: array, items: { type: string } }
                  liveEvent:
                    type: [object, "null"]
                    description: FR-43 — the event currently live at the venue, null when none is.
                    properties:
                      eventId: { type: string, format: uuid }
                      name: { type: string }
                      startsAt: { type: string, format: date-time }
                      endsAt: { type: string, format: date-time }
        "403": { description: Venue partner token required (BR-12). }
        "404": { description: Venue not found. }
  /v1/venues/{venueId}/schedule:
    put:
      summary: Replace the venue's operating schedule (FR-42)
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - name: venueId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schedule]
              additionalProperties: false
              properties:
                schedule:
                  type: [object, "null"]
                  additionalProperties: false
                  properties:
                    timezone: { type: string, minLength: 1, maxLength: 64 }
                    weekly:
                      type: array
                      maxItems: 21
                      items:
                        type: object
                        required: [day, open, close]
                        additionalProperties: false
                        properties:
                          day: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
                          open: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
                          close: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
      responses:
        "200": { description: Schedule recorded (audited, FR-60). }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Venue partner token required (BR-12). }
        "404": { description: Venue not found. }
        "422": { description: Invalid operating schedule shape (FR-42). }
  /v1/venues/{venueId}/suspend:
    post:
      summary: Self-serve venue suspension (BR-14)
      description: >-
        The venue suspends the service on its own premises. The status flips
        immediately, the venue's live presence set is purged, its offers and
        announcements stop being served, and new presence attribution to the
        venue is refused — effective well within one presence TTL
        (15 minutes). Audited (FR-60).
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - name: venueId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Venue suspended. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Venue partner token required (BR-12). }
        "404": { description: Venue not found. }
        "409": { description: Venue is offboarded. }
  /v1/venues/{venueId}/resume:
    post:
      summary: End a self-serve venue suspension (BR-14)
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - name: venueId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Venue active again. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Venue partner token required (BR-12). }
        "404": { description: Venue not found. }
        "409": { description: Venue is not suspended. }
  /v1/venues/{venueId}/offboard:
    post:
      summary: Offboard a venue (FR-42; venue-ops console only)
      description: >-
        Terminal offboarding. Workforce realm with the venue-ops role only —
        never self-serve. The venue's live presence is purged.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - name: venueId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Venue offboarded. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Venue-ops role required. }
        "404": { description: Venue not found. }
        "409": { description: Venue is already offboarded. }
  /v1/tables:
    post:
      summary: Create a group table (FR-66, FR-69)
      description: >-
        Creates an open table at a venue and seats the creator as its
        designated host. Live presence at the venue is required, the name is
        content-screened, and the creator's declared non-sensitive interests
        are snapshotted into the table as card material (FR-67). Tables seat
        at most six (SEC-33, enforced in the data layer).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venueId, name]
              additionalProperties: false
              properties:
                venueId: { type: string, format: uuid }
                eventId: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "201":
          description: Table created; the creator is its host.
          content:
            application/json:
              schema:
                type: object
                required: [tableId, name, venueId, eventId, state, role, createdAt]
                properties:
                  tableId: { type: string, format: uuid }
                  name: { type: string }
                  venueId: { type: string, format: uuid }
                  eventId: { type: [string, "null"], format: uuid }
                  state: { type: string, enum: [open] }
                  role: { type: string, enum: [host] }
                  createdAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Live presence at the venue is required. }
        "404": { description: Unknown venue. }
        "422": { description: Name unusable, screened content, or event/venue mismatch. }
    get:
      summary: List my group tables (FR-75)
      description: >-
        Returns only tables the caller belongs to, optionally narrowed to a
        venue. There is deliberately no venue-wide listing — group surfaces
        are never enumerable (FR-75).
      parameters:
        - name: venueId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The caller's memberships.
          content:
            application/json:
              schema:
                type: object
                required: [tables]
                properties:
                  tables:
                    type: array
                    items:
                      type: object
                      required: [tableId, name, venueId, eventId, state, role, createdAt]
                      properties:
                        tableId: { type: string, format: uuid }
                        name: { type: string }
                        venueId: { type: string, format: uuid }
                        eventId: { type: [string, "null"], format: uuid }
                        state: { type: string, enum: [open] }
                        role: { type: string, enum: [host, member] }
                        createdAt: { type: string, format: date-time }
  /v1/tables/{tableId}:
    get:
      summary: Table detail with the member directory (FR-66, FR-69)
      description: >-
        Member-only. Members carry display name and role from the scoped
        directory (group_member_directory) — name+role is the FR-30
        carve-out for the group surface and never leaves the table. Non-
        members receive 404; existence is never leaked (FR-75).
      parameters:
        - name: tableId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Table detail and member directory.
          content:
            application/json:
              schema:
                type: object
                required: [tableId, name, venueId, eventId, state, createdAt, members]
                properties:
                  tableId: { type: string, format: uuid }
                  name: { type: string }
                  venueId: { type: string, format: uuid }
                  eventId: { type: [string, "null"], format: uuid }
                  state: { type: string, enum: [open, closed] }
                  createdAt: { type: string, format: date-time }
                  members:
                    type: array
                    items:
                      type: object
                      required: [userId, handle, role, joinedAt]
                      properties:
                        userId: { type: string, format: uuid }
                        handle: { type: [string, "null"] }
                        role: { type: string, enum: [host, member] }
                        joinedAt: { type: string, format: date-time }
        "404": { description: Not found, or the caller is not a member (FR-75). }
    delete:
      summary: Close the table (FR-74)
      description: >-
        Host-only. Open slots are cancelled with the table and the closure
        is written to the admin audit log (FR-60). Closing is idempotent.
      parameters:
        - name: tableId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Table closed (idempotent).
          content:
            application/json:
              schema:
                type: object
                required: [tableId, state]
                properties:
                  tableId: { type: string, format: uuid }
                  state: { type: string, enum: [closed] }
        "403": { description: Only the host can close the table. }
        "404": { description: Not found, or the caller is not a member (FR-75). }
  /v1/tables/{tableId}/join:
    post:
      summary: Join an open table (FR-66, SEC-33)
      description: >-
        Self-serve join while live at the table's venue. Joining is the act
        that shares: the member's declared non-sensitive interests are
        snapshotted into the table for conversation cards (FR-67). The
        seventh join is refused — the cap is enforced by a data-layer
        trigger (SEC-33). Re-joining is idempotent and refreshes the
        snapshot.
      parameters:
        - name: tableId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201":
          description: Joined.
          content:
            application/json:
              schema:
                type: object
                required: [tableId, role, alreadyMember]
                properties:
                  tableId: { type: string, format: uuid }
                  role: { type: string, enum: [member] }
                  alreadyMember: { type: boolean }
        "200":
          description: Already a member; the snapshot was refreshed.
          content:
            application/json:
              schema:
                type: object
                required: [tableId, role, alreadyMember]
                properties:
                  tableId: { type: string, format: uuid }
                  role: { type: string, enum: [member] }
                  alreadyMember: { type: boolean }
        "403": { description: Live presence at the venue is required. }
        "404": { description: Not found or closed — indistinguishable (FR-75). }
        "409": { description: Table is full (six seats, SEC-33). }
  /v1/tables/{tableId}/members/{userId}:
    delete:
      summary: Leave, or the host removes a member (FR-66, FR-74)
      description: >-
        A member removes themselves; the host removes anyone. The departing
        member's open slots are cancelled and their interest snapshot is
        erased. Host removals are audit-logged (FR-74). A host with members
        remaining cannot leave — close the table instead. The last member
        out closes the table.
      parameters:
        - name: tableId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Membership removed. }
        "403": { description: Only the host can remove other members. }
        "404": { description: Not found, or the caller is not a member (FR-75). }
        "409": { description: The host cannot leave while members remain. }
  /v1/tables/{tableId}/cards:
    get:
      summary: Conversation cards from shared interests (FR-67)
      description: >-
        Member-only. Cards are derived from the join-time interest snapshot:
        any node shared by at least two members becomes a card, ranked by
        reach and capped at five. Every card is labelled generated — they
        are machine-derived icebreakers, never member-authored content.
      parameters:
        - name: tableId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Generated conversation cards.
          content:
            application/json:
              schema:
                type: object
                required: [cards]
                properties:
                  cards:
                    type: array
                    items:
                      type: object
                      required: [nodeId, label, memberCount, members, generated]
                      properties:
                        nodeId: { type: string }
                        label: { type: string }
                        memberCount: { type: integer, minimum: 2 }
                        members:
                          type: array
                          items: { type: string, format: uuid }
                        generated:
                          type: boolean
                          description: Always true — FR-67 labelling.
        "404": { description: Not found, or the caller is not a member (FR-75). }
  /v1/tables/{tableId}/slots:
    post:
      summary: Offer a 1:1 slot (FR-68)
      description: >-
        Any member offers a bookable 1:1 slot at the table. The start must
        be in the future; the duration is 5-60 minutes (default 15).
      parameters:
        - name: tableId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startsAt]
              additionalProperties: false
              properties:
                startsAt: { type: string, format: date-time }
                durationMinutes: { type: integer, minimum: 5, maximum: 60 }
      responses:
        "201":
          description: Slot offered.
          content:
            application/json:
              schema:
                type: object
                required: [slotId, tableId, offerer, startsAt, durationMinutes, state, createdAt]
                properties:
                  slotId: { type: string, format: uuid }
                  tableId: { type: string, format: uuid }
                  offerer: { type: string, format: uuid }
                  startsAt: { type: string, format: date-time }
                  durationMinutes: { type: integer }
                  state: { type: string, enum: [open] }
                  createdAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "404": { description: Not found, or the caller is not a member (FR-75). }
        "409": { description: Table is closed. }
        "422": { description: Start not in the future or duration out of range. }
    get:
      summary: Member-only slot list (FR-68, FR-75)
      description: >-
        Non-cancelled slots from the last day onward, with their booking
        state. Bookings are visible inside the table only.
      parameters:
        - name: tableId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Slots and bookings.
          content:
            application/json:
              schema:
                type: object
                required: [slots]
                properties:
                  slots:
                    type: array
                    items:
                      type: object
                      required: [slotId, offerer, startsAt, durationMinutes, state, booking]
                      properties:
                        slotId: { type: string, format: uuid }
                        offerer: { type: string, format: uuid }
                        startsAt: { type: string, format: date-time }
                        durationMinutes: { type: integer }
                        state: { type: string, enum: [open, booked] }
                        booking:
                          type: [object, "null"]
                          required: [booker, bookedAt, cancelledAt]
                          properties:
                            booker: { type: string, format: uuid }
                            bookedAt: { type: string, format: date-time }
                            cancelledAt: { type: [string, "null"], format: date-time }
        "404": { description: Not found, or the caller is not a member (FR-75). }
  /v1/slots/{slotId}/book:
    post:
      summary: Book a slot — the booking is the consent act (FR-68)
      description: >-
        Booking a slot is itself the consent act for the 1:1; there is no
        separate express step. A conditional state flip plus the booking
        primary key make double-booking impossible (SEC-33). Members cannot
        book their own offers.
      parameters:
        - name: slotId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201":
          description: Booked; the booking row records the consent act.
          content:
            application/json:
              schema:
                type: object
                required: [slotId, booker, bookedAt]
                properties:
                  slotId: { type: string, format: uuid }
                  booker: { type: string, format: uuid }
                  bookedAt: { type: string, format: date-time }
        "404": { description: Not found, or the caller is not a member (FR-75). }
        "409": { description: Slot is no longer bookable. }
        "410": { description: Slot has passed. }
        "422": { description: You cannot book your own slot. }
    delete:
      summary: Cancel a booking (FR-68)
      description: >-
        The booker or the offerer cancels. A future slot re-opens for
        someone else; a past one lapses. Cancellation is idempotent.
      parameters:
        - name: slotId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Cancelled (idempotent).
          content:
            application/json:
              schema:
                type: object
                required: [slotId, state, cancelledAt]
                properties:
                  slotId: { type: string, format: uuid }
                  state: { type: string, enum: [cancelled] }
                  cancelledAt: { type: string, format: date-time }
        "403": { description: Only the booker or the offerer can cancel. }
        "404": { description: No booking found. }
  /v1/pairs/{pairId}/link:
    put:
      summary: Share one allowlisted external link (FR-65, SEC-34)
      description: >-
        Post-OPEN only — the RLS policy on pair_links makes the consent gate
        non-negotiable. Each member stores at most one link; replacing it
        keeps the original shared_at. The URL must be https, carry no
        credentials, stay under 300 characters, and sit on the governed
        domain allowlist (SEC-34). The server stores and returns the string;
        it never fetches it.
      parameters:
        - name: pairId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              additionalProperties: false
              properties:
                url: { type: string, minLength: 1, maxLength: 300 }
      responses:
        "200":
          description: Link stored (created or replaced).
          content:
            application/json:
              schema:
                type: object
                required: [url, domain, interstitial, sharedAt, updatedAt]
                properties:
                  url: { type: string }
                  domain: { type: string }
                  interstitial:
                    type: boolean
                    description: Always true — the client renders the warning sheet (SEC-34).
                  sharedAt: { type: string, format: date-time }
                  updatedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "404": { description: Pair not found. }
        "409": { description: Link sharing opens once the pair is OPEN. }
        "422": { description: Not https, carries credentials, too long, or domain not allowlisted. }
    get:
      summary: Read the counterpart's link (FR-65, SEC-34)
      description: >-
        Returns the counterpart's link, never the caller's own. The payload
        is plain text plus the interstitial flag; the client renders the
        leaving-the-app warning sheet before opening (SEC-34). The URL is
        never fetched server-side.
      parameters:
        - name: pairId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The counterpart's link.
          content:
            application/json:
              schema:
                type: object
                required: [url, domain, interstitial, sharedAt, updatedAt]
                properties:
                  url: { type: string }
                  domain: { type: [string, "null"] }
                  interstitial:
                    type: boolean
                    description: Always true — the client renders the warning sheet (SEC-34).
                  sharedAt: { type: string, format: date-time }
                  updatedAt: { type: string, format: date-time }
        "204": { description: The counterpart has not shared a link yet. }
        "404": { description: Pair not found. }
        "409": { description: Link sharing opens once the pair is OPEN. }
  /v1/venues/{venueId}/rooms:
    get:
      summary: Crowd-mode interest rooms (FR-44, FR-45)
      description: >-
        The discovery surface once the venue crosses the crowd density band
        (FR-44): rooms formed from the live population's declared,
        non-sensitive interests, each with a k-suppressed member count
        (FR-45). Below the crowd band the list is empty and the mode field
        says why. Requires live presence at the venue. Rooms are ephemeral —
        they dissolve with the crowd.
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current mode and the venue's rooms (empty outside crowd mode).
          content:
            application/json:
              schema:
                type: object
                required: [mode, rooms]
                properties:
                  mode: { type: string, enum: [sparse, busy, crowd] }
                  rooms:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, description: opaque room key (venue and topic are not recoverable from it) }
                        topic: { type: string, description: taxonomy node }
                        members: { type: integer, nullable: true, description: k-suppressed }
                        suppressed: { type: boolean }
                        k: { type: integer }
                        joined: { type: boolean }
        "403": { description: Live presence at the venue is required. }
  /v1/rooms/{roomKey}/join:
    post:
      summary: Opt into a room (FR-44)
      description: >-
        Requires live presence at the room's venue, a still-crowded venue,
        and a declared interest in the room topic — a room is formed from
        declared interests, so joining one is declaring you share it.
        Idempotent.
      parameters:
        - name: roomKey
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Joined (or already a member). }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Live presence at the venue is required. }
        "404": { description: Room not found (or dissolved). }
        "409": { description: The room has dissolved with the crowd. }
        "422": { description: Joining needs a declared interest in the room topic. }
  /v1/rooms/{roomKey}:
    get:
      summary: Room content (FR-45)
      description: >-
        Topic, k-suppressed member count and the recent notes ring buffer.
        Members only — non-members get the same 404 as a missing room.
        Notes carry no author field: opting in is what publishes a note.
      parameters:
        - name: roomKey
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Room state and notes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
                  topic: { type: string }
                  members: { type: integer, nullable: true }
                  suppressed: { type: boolean }
                  k: { type: integer }
                  notes:
                    type: array
                    items:
                      type: object
                      required: [noteId, body, at]
                      properties:
                        noteId: { type: string, format: uuid }
                        body: { type: string }
                        at: { type: string, format: date-time }
        "404": { description: Room not found or not a member (indistinguishable). }
  /v1/rooms/{roomKey}/notes:
    post:
      summary: Post a room note (FR-46)
      description: >-
        One note per member per room per five minutes (429 inside the
        window). The member's first note in the room passes the SEC-21
        content filters; later notes are not re-screened. Notes are
        ephemeral and unattributed.
      parameters:
        - name: roomKey
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties:
                # Bounds (1–280 chars) are enforced by the edge parser so
                # they can return a 422 with an explanation.
                body: { type: string }
      responses:
        "201":
          description: Note posted.
          content:
            application/json:
              schema:
                type: object
                required: [noteId, body, at]
                properties:
                  noteId: { type: string, format: uuid }
                  body: { type: string }
                  at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "404": { description: Room not found or not a member (indistinguishable). }
        "422": { description: Body bounds or first-note screening rejection (SEC-21). }
        "429": { description: One note per five minutes per room (FR-46). }
  /v1/rooms/{roomKey}/leave:
    delete:
      summary: Leave a room (FR-45)
      description: Idempotent opt-out; leaving a dissolved room is a no-op.
      parameters:
        - name: roomKey
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Left (or never a member). }
        "400": { $ref: "#/components/responses/SchemaViolation" }
  /v1/reports:
    post:
      summary: File a report (BR-07, FR-40, FR-49, FR-98)
      description: >-
        Reports target a user (reported), an announcement (announcementId) or
        a conversation (pairId — the offer identifier — optionally with one
        messageId inside it, FR-40); for an announcement the edge resolves
        the publisher server-side, and a pair anchor defaults the report to
        the counterpart. Anchors are validated under RLS: a pair or message
        the reporter is not part of is simply not found. The category is one
        of six fixed values (FR-49); reason/details carry the free-text
        narrative. Two reports against one announcement inside ten minutes
        remove it; the evidence is retained (FR-98).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, category]
              additionalProperties: false
              properties:
                reported: { type: string, format: uuid }
                venueId: { type: string }
                announcementId: { type: string, format: uuid }
                pairId: { type: string, format: uuid }
                messageId: { type: string, format: uuid }
                reason: { type: string, minLength: 1 }
                category:
                  type: string
                  enum: [harassment, impersonation, under_age, commercial_solicitation, hate, other]
                details: { type: string }
      responses:
        "201":
          description: Report filed.
          content:
            application/json:
              schema:
                type: object
                required: [reportId, status, announcementRemoved]
                properties:
                  reportId: { type: string, format: uuid }
                  status: { type: string, enum: [open] }
                  announcementRemoved: { type: boolean, description: FR-98 auto-removal fired }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "404": { description: Announcement not found. }
        "422": { description: Missing fields, self-report, or anchor not found / not a member. }
  /v1/moderation/queue:
    get:
      summary: Moderation queue (FR-52, FR-54)
      description: >-
        Workforce-realm tokens with the moderator role only (403 otherwise).
        Open reports ordered by the reported account's trust score ascending,
        then report age — the accounts most likely to need action surface
        first.
      responses:
        "200":
          description: Open reports, lowest trust first.
          content:
            application/json:
              schema:
                type: object
                required: [queue]
                properties:
                  queue:
                    type: array
                    items:
                      type: object
                      properties:
                        reportId: { type: string, format: uuid }
                        reported: { type: string, format: uuid }
                        reason: { type: string }
                        status: { type: string }
                        trust: { type: number, nullable: true }
                        createdAt: { type: string, format: date-time }
        "403": { description: Moderator role required. }
  /v1/moderation/security-events:
    get:
      summary: Security-event abuse review (SEC-30, SEC-36)
      description: >-
        The append-only security-event store, newest first, optionally
        filtered by kind (impossible_travel, missing_attestation,
        attestation_key_duplicate, mock_location_refusal,
        console_authorization_denied, retention.purge). This is the only
        read path — security signals are never disclosed to other users.
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [impossible_travel, missing_attestation, attestation_key_duplicate,
                   mock_location_refusal, console_authorization_denied, retention.purge]
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Security events, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        eventId: { type: string, format: uuid }
                        kind: { type: string }
                        actor: { type: string, format: uuid, nullable: true }
                        detail: { type: object }
                        occurredAt: { type: string, format: date-time }
        "403": { description: Moderator role required. }
  /v1/moderation/accounts/{userId}:
    get:
      summary: Account card for the console (FR-52, FR-54)
      description: >-
        Trust score and its inputs, suspensions, report statistics, consent
        ledger aggregate counts, live-presence flag and the recent audit
        trail. Message content is never part of this view.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: >-
            Account card. Includes the age-assurance state (ageBlocked,
            ageReverifyRequired, ageReverifiedAt — SEC-17/BR-03); a birth
            date or identity document is never part of this view because
            none is stored.
        "403": { description: Moderator role required. }
        "404": { description: Account not found. }
  /v1/moderation/kyc/{userId}:
    post:
      summary: Record a KYC review decision (SRS Addendum 001, AMD-KYC-03/05)
      description: >-
        Workforce review decision on an account's identity verification.
        The record_kyc_decision definer enforces the legal transitions
        (pending → verified | rejected, verified → suspended,
        suspended → verified, rejected → pending) in the database and
        writes the audit row; endpoint logic cannot excuse an illegal
        transition. Data minimisation (AMD-KYC-02): no document, legal
        name or birth date ever crosses this wire — the decision alone.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision:
                  type: string
                  enum: [verified, rejected, suspended, pending]
      responses:
        "200": { description: Decision recorded and audited. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Moderator role required. }
        "404": { description: Unknown account. }
        "409": { description: Illegal KYC transition (AMD-KYC-03). }
        "422": { description: Decision is not a KYC state. }
  /v1/transfers:
    post:
      summary: Propose a P2P transfer (SRS Addendum 001, AMD-PAY-01/05/06)
      description: >-
        Proposes a structured transfer to the other side of an OPEN
        conversation. The propose_transfer definer decides everything in
        the database: both parties KYC-verified (AMD-PAY-01/06), no active
        payment_instrument suspension (AMD-KYC-05 composability), the
        per-transfer cap of NGN 50,000.00 and the rolling 24 h sender cap
        of NGN 150,000.00 (AMD-PAY-05), and the 100 bps fee computed and
        stored on the row. AMD-PAY-03: the transfer object is amount,
        currency, fee and state — there is no memo or note field, so
        payment solicitation stays unrepresentable (FR-96/SEC-37
        unchanged). The proposal expires one hour after creation
        (AMD-PAY-06).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient, amountMinor]
              additionalProperties: false
              properties:
                recipient: { type: string, format: uuid }
                amountMinor: { type: integer }
      responses:
        "201": { description: Transfer proposed; the fee and expiry are pinned on the row. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Not KYC-verified, suspended, or no OPEN conversation (AMD-PAY-06). }
        "422": { description: Invalid amount or over a platform cap (AMD-PAY-05). }
    get:
      summary: List the requester's transfers (SRS Addendum 001, AMD-PAY-03/06)
      description: >-
        The requester's transfers as sender or recipient, party-scoped by
        RLS. Stale proposals are lazily expired first — no proposal
        outlives its one-hour window (AMD-PAY-06). AMD-PAY-03: rows carry
        amount, currency, fee and state only; there is no free text to
        return.
      responses:
        "200": { description: The requester's transfers, newest first. }
  /v1/transfers/{transferId}/accept:
    post:
      summary: Accept a proposed transfer (SRS Addendum 001, AMD-PAY-04/06)
      description: >-
        The recipient's half of the dual consent. The
        record_transfer_event definer enforces the legal transition in the
        database and re-proves eligibility at this second moment: both
        parties still KYC-verified and the pair still OPEN (AMD-PAY-06).
      parameters:
        - name: transferId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Transfer accepted; ledgered. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Wrong actor, eligibility lost, or pair no longer open. }
        "404": { description: Unknown transfer. }
        "409": { description: Illegal transfer transition (AMD-PAY-04). }
  /v1/transfers/{transferId}/decline:
    post:
      summary: Decline a proposed transfer (SRS Addendum 001, AMD-PAY-04)
      description: >-
        The recipient refuses. Always available while proposed — declining
        needs no second look at eligibility.
      parameters:
        - name: transferId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Transfer declined; ledgered. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Only the recipient may decline. }
        "404": { description: Unknown transfer. }
        "409": { description: Illegal transfer transition (AMD-PAY-04). }
  /v1/transfers/{transferId}/cancel:
    post:
      summary: Cancel a proposed transfer (SRS Addendum 001, AMD-PAY-04)
      description: The sender retracts while the proposal is still open.
      parameters:
        - name: transferId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Transfer cancelled; ledgered. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Only the sender may cancel. }
        "404": { description: Unknown transfer. }
        "409": { description: Illegal transfer transition (AMD-PAY-04). }
  /v1/transfers/{transferId}/dispute:
    post:
      summary: Dispute an accepted or settled transfer (SRS Addendum 001, AMD-PAY-03/04)
      description: >-
        Either party disputes. The reason is a closed category — a dispute
        is structured data, never free text (AMD-PAY-03) — and the
        transition lands in the append-only ledger (AMD-PAY-07).
      parameters:
        - name: transferId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason:
                  type: string
                  enum: [not-received, wrong-amount, unauthorised]
      responses:
        "200": { description: Dispute recorded; ledgered. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Only a party to the transfer may dispute it. }
        "404": { description: Unknown transfer. }
        "409": { description: Illegal transfer transition (AMD-PAY-04). }
        "422": { description: Reason is outside the closed dispute vocabulary. }
  /v1/moderation/transfers/{transferId}/resolve:
    post:
      summary: Resolve a transfer dispute (SRS Addendum 001, AMD-PAY-04/07)
      description: >-
        Workforce resolution of a disputed transfer. The definer enforces
        the outcome vocabulary (upheld or rejected), writes the ledger row
        and the admin audit entry (FR-60). Settlement itself is never
        performed here — the settled state belongs to the payment rail
        alone (AMD-PAY-08; the TECH-23 deployment gate stands).
      parameters:
        - name: transferId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              additionalProperties: false
              properties:
                outcome:
                  type: string
                  enum: [upheld, rejected]
      responses:
        "200": { description: Dispute resolved; ledgered and audited. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Moderator role required. }
        "404": { description: Unknown transfer. }
        "409": { description: Illegal transfer transition (AMD-PAY-04). }
        "422": { description: Outcome is outside the closed vocabulary. }
  /v1/wallets:
    post:
      summary: Open the caller's wallet (SRS Addendum 001, AMD-PAY-10)
      description: >-
        Creates the caller's NGN wallet — one wallet per user per
        currency, self-serve, idempotent. The create_wallet definer
        decides: the owner claim must be the caller (the definer bypasses
        RLS) and the caller must be KYC-verified (AMD-PAY-01 discipline).
        An unfunded wallet is inert — value enters only through the
        authenticated rail (AMD-PAY-16) and moves only through the
        rail-gated definers (AMD-PAY-13/15), behind the WALLET_RAIL
        operational kill switch.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        "200": { description: Wallet already exists; the existing id is returned. }
        "201": { description: Wallet created. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Not KYC-verified (AMD-PAY-01/10). }
        "422": { description: Wallet creation takes no fields (AMD-PAY-10). }
    get:
      summary: List the caller's wallets with derived balances (AMD-PAY-11)
      description: >-
        The caller's wallets with balance, held and available amounts
        derived from the append-only ledger and pending holds
        (wallet_balances). Owner-scoped by RLS; the platform fee wallet
        is never visible. AMD-PAY-10: rows carry an identifier, a
        currency, a status and amounts — there is no free text to return.
      responses:
        "200": { description: The caller's wallets with derived balances. }
  /v1/wallets/{walletId}/entries:
    get:
      summary: Read a wallet's ledger and holds (SRS Addendum 001, AMD-PAY-11/12)
      description: >-
        The append-only entry ledger (newest first) and the hold history
        for one of the caller's wallets. An id the caller does not own
        answers 404 — wallet existence is not leaked (FR-30 discipline).
      parameters:
        - name: walletId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: The wallet's entries and holds. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "404": { description: Unknown or not-owned wallet. }
  /v1/moderation/wallets/{walletId}/freeze:
    post:
      summary: Freeze a user wallet (SRS Addendum 001, AMD-PAY-13)
      description: >-
        Workforce wallet suspension (AMD-KYC-05 composability). The
        set_wallet_status definer runs inside the app.moderator GUC,
        refuses to touch the platform wallet, and writes the admin audit
        entry (FR-60). Value movement is never performed here — the
        movers belong to the payment rail alone (AMD-PAY-08/13; the
        TECH-23 deployment gate stands).
      parameters:
        - name: walletId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Wallet frozen; audited. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Moderator role required, or not a user wallet. }
        "404": { description: Unknown wallet. }
  /v1/moderation/wallets/{walletId}/unfreeze:
    post:
      summary: Unfreeze a user wallet (SRS Addendum 001, AMD-PAY-13)
      description: >-
        Lifts a wallet freeze. Same gates and audit discipline as the
        freeze path.
      parameters:
        - name: walletId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Wallet active again; audited. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Moderator role required, or not a user wallet. }
        "404": { description: Unknown wallet. }
  /v1/wallets/{walletId}/withdrawals:
    post:
      summary: Request a withdrawal (SRS Addendum 001, AMD-PAY-17)
      description: >-
        The owner requests a payout to an opaque provider-side destination
        reference — never raw bank details (AMD-KYC-03 minimisation).
        request_withdrawal decides under the wallet row lock: ownership is
        the caller (app_user()), the wallet must be active, the amount is
        reserved as a pending hold in the same transaction, and the caps
        mirror AMD-PAY-05 — 5,000,000 minor per withdrawal and 15,000,000
        minor rolling 24-hour over requested, processing and paid. Runs
        under the settlement GUC behind the WALLET_RAIL kill switch
        (AMD-PAY-15).
      parameters:
        - name: walletId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor, destinationRef]
              additionalProperties: false
              properties:
                amountMinor: { type: integer, minimum: 1 }
                destinationRef: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "201": { description: Withdrawal requested; hold placed. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "404": { description: Unknown or not-owned wallet. }
        "409": { description: Cap exceeded, insufficient funds, or wallet not active (AMD-PAY-17). }
        "422": { description: Body outside the strict shape (TR-23). }
        "503": { description: The wallet rail is switched off (WALLET_RAIL). }
    get:
      summary: List a wallet's withdrawal requests (AMD-PAY-17)
      description: >-
        The caller's withdrawal requests for one wallet, newest first. An
        id the caller does not own answers 404 — wallet existence is not
        leaked (FR-30 discipline).
      parameters:
        - name: walletId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: The wallet's withdrawal requests. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "404": { description: Unknown or not-owned wallet. }
  /v1/wallets/{walletId}/withdrawals/{requestId}/cancel:
    post:
      summary: Cancel a requested withdrawal (SRS Addendum 001, AMD-PAY-17)
      description: >-
        The owner cancels while the request is still `requested`; the hold
        is voided in the same transaction. Any other state answers 409 —
        the lifecycle is enforced by the database (FR-29 trigger
        discipline).
      parameters:
        - name: walletId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Withdrawal cancelled; hold voided. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "404": { description: Unknown or not-owned wallet or request. }
        "409": { description: The request has left the requested state (AMD-PAY-17). }
        "503": { description: The wallet rail is switched off (WALLET_RAIL). }
  /v1/moderation/wallets/{walletId}/credit:
    post:
      summary: Credit a user wallet (SRS Addendum 001, AMD-PAY-16/23)
      description: >-
        The audited moderation funding route: fund_wallet under the
        settlement GUC plus app.moderator, capped per event, idempotent by
        the supplied reference — a repeat answers the recorded outcome and
        moves nothing twice. Every credit lands in wallet_rail_events.
        A credit above the four-eyes threshold answers 202 and opens a
        pending approval a second moderator must execute (AMD-PAY-23).
      parameters:
        - name: walletId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor, reference]
              additionalProperties: false
              properties:
                amountMinor: { type: integer, minimum: 1 }
                reference: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200": { description: Credit applied, or the reference was already recorded (duplicate). }
        "202": { description: Above the four-eyes threshold — a pending credit approval was opened; value has NOT moved (AMD-PAY-23). }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Moderator role required. }
        "404": { description: Unknown wallet. }
        "409": { description: Over the per-event cap or wallet not active (AMD-PAY-16). }
        "422": { description: Body outside the strict shape (TR-23). }
        "503": { description: The wallet rail is switched off (WALLET_RAIL). }
  /v1/moderation/rail-risk-signals:
    get:
      summary: List rail risk signals (SRS Addendum 001, AMD-PAY-21)
      description: >-
        The moderator-only review queue: velocity signals raised inside the
        funding and withdrawal definers (fund_velocity_1h,
        fund_daily_volume, withdrawal_velocity_1h). Signals flag — they
        never block.
      responses:
        "200": { description: The signals, newest first. }
        "403": { description: Moderator role required. }
  /v1/moderation/rail-risk-signals/{signalId}/ack:
    post:
      summary: Acknowledge or dismiss a rail risk signal (AMD-PAY-21)
      description: >-
        Closes an open signal. The decision is audited in the admin audit
        log; the signal's terms are immutable and a decided signal cannot
        be re-decided.
      parameters:
        - name: signalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [acknowledge, dismiss] }
      responses:
        "200": { description: Decision recorded; audited. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Moderator role required. }
        "404": { description: Unknown signal. }
        "409": { description: The signal is already decided (AMD-PAY-21). }
        "422": { description: Decision outside the closed vocabulary. }
  /v1/moderation/credit-approvals:
    get:
      summary: List four-eyes credit approvals (SRS Addendum 001, AMD-PAY-23)
      description: >-
        The moderator-only queue of manual credits above the four-eyes
        threshold. A proposal fixes the wallet, amount and reference; the
        executor can only say yes or no to exactly that credit.
      responses:
        "200": { description: The approvals, newest first. }
        "403": { description: Moderator role required. }
  /v1/moderation/credit-approvals/{approvalId}/approve:
    post:
      summary: Execute a pending credit approval (AMD-PAY-23)
      description: >-
        Value moves here: the second moderator executes the fixed proposal
        through exactly the provider funding path — same entry kind, same
        rail-event idempotency on the fixed reference. The definer refuses
        self-approval: the proposer can never execute their own credit.
        The body is strictly empty — the approval row carries the terms.
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Credit applied. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Moderator role required. }
        "404": { description: Unknown approval. }
        "409": { description: Already decided, self-approval, wallet not active, or the reference already settled (AMD-PAY-23). }
        "422": { description: Non-empty body (TR-23). }
        "503": { description: The wallet rail is switched off (WALLET_RAIL). }
  /v1/moderation/credit-approvals/{approvalId}/reject:
    post:
      summary: Reject a pending credit approval (AMD-PAY-23)
      description: >-
        Closes the proposal without moving value. Any moderator may reject
        — including the proposer withdrawing their own proposal; only
        execution is four-eyes. The decision is audited. The body is
        strictly empty.
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Approval rejected; audited. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Moderator role required. }
        "404": { description: Unknown approval. }
        "409": { description: Already decided (AMD-PAY-23). }
        "422": { description: Non-empty body (TR-23). }
  /v1/moderation/withdrawals/{requestId}/decide:
    post:
      summary: Approve or reject a withdrawal (SRS Addendum 001, AMD-PAY-17)
      description: >-
        Moderation decides a `requested` withdrawal: approve moves it to
        `processing` for the payout rail; reject moves it to `failed` and
        voids the hold in the same transaction. The decision is audited in
        the admin audit log (FR-60).
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [approve, reject] }
      responses:
        "200": { description: Decision recorded; audited. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Moderator role required. }
        "404": { description: Unknown withdrawal request. }
        "409": { description: The request has left the requested state (AMD-PAY-17). }
        "422": { description: Decision outside the closed vocabulary. }
        "503": { description: The wallet rail is switched off (WALLET_RAIL). }
  /v1/moderation/wallets/reconciliation:
    get:
      summary: Reconcile the wallet ledger (SRS Addendum 001, AMD-PAY-19)
      description: >-
        The moderator-only audit read: every wallet's balance re-derived
        from its ledger and compared against the stored running balance,
        the platform fee delta, holds pending longer than 24 hours, and
        open withdrawals. It moves nothing — it reads and reports.
      responses:
        "200": { description: The reconciliation report. }
        "403": { description: Moderator role required. }
  /v1/webhooks/wallet-funding:
    post:
      summary: Funding provider callback (SRS Addendum 001, AMD-PAY-16)
      description: >-
        The rail's fund-in wire, outside the authed scope on purpose: the
        provider authenticates with an HMAC-SHA256 signature over the
        canonical `timestamp:walletId:amountMinor:reference` string in the
        x-wallet-signature header, where the timestamp is the unix epoch
        sent in x-wallet-timestamp — freshness (300 s skew) is checked
        BEFORE the signature (AMD-PAY-22). fund_wallet runs under the
        settlement GUC plus app.funding_callback, idempotent by reference.
        Unset WALLET_FUNDING_SECRET answers 503.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - name: x-wallet-timestamp
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9]{1,12}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [walletId, amountMinor, reference]
              additionalProperties: false
              properties:
                walletId: { type: string, format: uuid }
                amountMinor: { type: integer, minimum: 1 }
                reference: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200": { description: Funding applied, or the reference was already recorded (duplicate). }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "401": { description: Signature verification failed (AMD-PAY-16). }
        "422": { description: Body outside the strict shape (TR-23). }
        "503": { description: Funding secret unset, or the wallet rail is switched off. }
  /v1/webhooks/wallet-payout:
    post:
      summary: Payout provider callback (SRS Addendum 001, AMD-PAY-17)
      description: >-
        The rail's payout wire, outside the authed scope on purpose: the
        provider authenticates with an HMAC-SHA256 signature over the
        canonical `timestamp:requestId:outcome:reference` string, where
        the timestamp is the unix epoch sent in x-wallet-timestamp —
        freshness (300 s skew) is checked BEFORE the signature
        (AMD-PAY-22). `completed`
        completes the withdrawal (ledger entry first, hold posted after —
        value and state can never diverge); `failed` fails it and voids
        the hold. Idempotent by reference. Unset WALLET_PAYOUT_SECRET
        answers 503.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - name: x-wallet-timestamp
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9]{1,12}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, outcome, reference]
              additionalProperties: false
              properties:
                requestId: { type: string, format: uuid }
                outcome: { type: string, enum: [completed, failed] }
                reference: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200": { description: Payout recorded, or the reference was already recorded (duplicate). }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "401": { description: Signature verification failed (AMD-PAY-17). }
        "409": { description: The request is not in a payable state (AMD-PAY-17). }
        "422": { description: Body outside the strict shape (TR-23). }
        "503": { description: Payout secret unset, or the wallet rail is switched off. }
  /v1/moderation/reports/{reportId}/resolve:
    post:
      summary: Resolve a report (FR-52, FR-54, FR-55)
      description: >-
        Closes the report with an outcome (feeds the trust score) and
        optionally creates a suspension and/or flags an investigation removal
        in the same transaction. The reason code is from the governed
        vocabulary; the action is audit-logged (FR-60). An investigation
        removal is silent — presence is purged without a realtime event.
        Resolving underage/actioned additionally flags the account for age
        re-verification in the same transaction (SEC-17/BR-03): discovery is
        closed until the account re-declares a consistent adult birth year.
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, reasonCode]
              additionalProperties: false
              properties:
                outcome: { type: string, enum: [actioned, dismissed] }
                reasonCode:
                  type: string
                  enum: [spam, harassment, scam, underage, impersonation, sexual_content, hate, other_policy]
                suspension:
                  type: object
                  required: [dimension]
                  additionalProperties: false
                  properties:
                    dimension: { type: string, enum: [attestation_key, handle, payment_instrument] }
                investigationRemove: { type: boolean }
      responses:
        "200": { description: Report closed; outcome recorded. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Moderator role required. }
        "404": { description: Report not found. }
        "409": { description: Already resolved, or an active suspension exists on that dimension (FR-55). }
        "422": { description: Outcome or reason code outside the governed vocabulary. }
  /v1/moderation/accounts/{userId}/investigation-remove:
    post:
      summary: Silent investigation removal (FR-53)
      description: >-
        Closes the account's discovery surfaces with the same neutral error
        as an age block and purges live presence without a realtime event.
        The account is never notified; the appeal path stays open.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              additionalProperties: false
              properties:
                reasonCode:
                  type: string
                  enum: [spam, harassment, scam, underage, impersonation, sexual_content, hate, other_policy]
      responses:
        "200": { description: Account removed from discovery, silently. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Moderator role required. }
        "409": { description: Already investigation-removed or unknown account. }
        "422": { description: Reason code outside the governed vocabulary. }
  /v1/moderation/accounts/{userId}/investigation-restore:
    post:
      summary: Restore an investigation-removed account (FR-53)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              additionalProperties: false
              properties:
                reasonCode:
                  type: string
                  enum: [spam, harassment, scam, underage, impersonation, sexual_content, hate, other_policy]
      responses:
        "200": { description: Removal cleared. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Moderator role required. }
        "409": { description: Account is not investigation-removed. }
        "422": { description: Reason code outside the governed vocabulary. }
  /v1/moderation/suspensions/{suspensionId}/lift:
    post:
      summary: Lift one suspension dimension (FR-55)
      description: >-
        Lifts a single active suspension; other dimensions are unaffected —
        independence is the point of the model.
      parameters:
        - name: suspensionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              additionalProperties: false
              properties:
                reasonCode:
                  type: string
                  enum: [spam, harassment, scam, underage, impersonation, sexual_content, hate, other_policy]
      responses:
        "200": { description: Suspension lifted. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Moderator role required. }
        "409": { description: Suspension is not active or unknown. }
        "422": { description: Reason code outside the governed vocabulary. }
  /v1/moderation/appeals:
    get:
      summary: Open appeals queue (FR-53)
      responses:
        "200":
          description: Open appeals, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [appeals]
                properties:
                  appeals:
                    type: array
                    items:
                      type: object
                      properties:
                        appealId: { type: string, format: uuid }
                        userId: { type: string, format: uuid }
                        suspensionId: { type: string, format: uuid, nullable: true }
                        body: { type: string }
                        createdAt: { type: string, format: date-time }
        "403": { description: Moderator role required. }
  /v1/moderation/appeals/{appealId}/resolve:
    post:
      summary: Resolve an appeal (FR-53, FR-55)
      description: >-
        Upholding closes the appeal; overturning additionally lifts the
        referenced suspension (when still active) and clears any
        investigation removal — the user is made whole in one transaction.
      parameters:
        - name: appealId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reasonCode]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [upheld, overturned] }
                reasonCode:
                  type: string
                  enum: [spam, harassment, scam, underage, impersonation, sexual_content, hate, other_policy]
                note: { type: string, maxLength: 2000 }
      responses:
        "200": { description: Appeal resolved. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Moderator role required. }
        "404": { description: Appeal not found. }
        "409": { description: Appeal already resolved. }
        "422": { description: Decision or reason code outside the governed vocabulary. }
  /v1/account/appeals:
    post:
      summary: File an appeal (FR-53)
      description: >-
        Always available, even to a suspended or investigation-removed
        account. The body is screened like any other free text (SEC-26). One
        open appeal per account — a second attempt answers 409.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties:
                # Bounds (10–2000 chars) are enforced by the edge parser so
                # they can return a 422 with an explanation.
                body: { type: string }
                suspensionId: { type: string, format: uuid }
      responses:
        "201":
          description: Appeal filed.
          content:
            application/json:
              schema:
                type: object
                required: [appealId, state]
                properties:
                  appealId: { type: string, format: uuid }
                  state: { type: string, enum: [open] }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "404": { description: Suspension not found (not one of yours). }
        "409": { description: An appeal is already open (FR-53). }
        "422": { description: Body bounds or screening rejection (SEC-26). }
    get:
      summary: My appeals (FR-53)
      responses:
        "200":
          description: The caller's appeals, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [appeals]
                properties:
                  appeals:
                    type: array
                    items:
                      type: object
                      properties:
                        appealId: { type: string, format: uuid }
                        suspensionId: { type: string, format: uuid, nullable: true }
                        body: { type: string }
                        state: { type: string, enum: [open, upheld, overturned] }
                        createdAt: { type: string, format: date-time }
                        resolvedAt: { type: string, format: date-time, nullable: true }
                        resolutionNote: { type: string, nullable: true }
  /v1/account/age-declaration:
    post:
      summary: Declare birth year (FR-02, SEC-17, BR-03)
      description: >-
        Year-only precision. The response shape is identical whether or not
        the account is discovery-blocked — the reason is never disclosed.
        An account flagged for re-verification (an underage report actioned
        by moderation) can only clear the flag with an adult year consistent
        with the declaration already on file (±1 year); anything else is a
        neutral 422. No identity document is collected or stored.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [birthYear]
              additionalProperties: false
              properties:
                birthYear: { type: integer, minimum: 1900 }
      responses:
        "200":
          description: Declaration recorded.
          content:
            application/json:
              schema:
                type: object
                required: [ok, discovery]
                properties:
                  ok: { type: boolean }
                  discovery: { type: boolean }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "422": { description: Invalid year, or a re-verification declaration that is not an adult year consistent with the one on file. }
  /v1/account/recovery-phone:
    put:
      summary: Register or replace the recovery phone (SEC-09)
      description: >-
        The number is normalised to E.164 and stored as a keyed hash
        (HMAC-SHA256) only — the plaintext digits never touch the database
        and are never returned. A number already bound to another account
        is rejected with the same neutral 422 as a malformed number.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              additionalProperties: false
              properties:
                phone: { type: string, maxLength: 32, description: E.164 (display punctuation tolerated) }
      responses:
        "200":
          description: Recovery number recorded (as a keyed hash).
          content:
            application/json:
              schema:
                type: object
                required: [ok, set]
                properties:
                  ok: { type: boolean }
                  set: { type: boolean }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "422": { description: Phone number is not accepted (malformed or unavailable). }
    get:
      summary: Recovery phone state (SEC-09)
      description: Existence only — the number itself and its hash are never returned.
      responses:
        "200":
          description: Whether a recovery number is set.
          content:
            application/json:
              schema:
                type: object
                required: [set]
                properties:
                  set: { type: boolean }
    delete:
      summary: Remove the recovery phone (SEC-09)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Recovery number removed (idempotent).
          content:
            application/json:
              schema:
                type: object
                required: [ok, set]
                properties:
                  ok: { type: boolean }
                  set: { type: boolean }
  /v1/account/export:
    get:
      summary: DSAR export (FR-62, SEC-14)
      description: >-
        Everything held on the requester as one JSON document, with FR-32/34
        masking applied (declined reads as expired; blocked pairs excluded
        from the pair list). Includes the subject's transfer history with
        event ledgers inline (AMD-PAY-09) — transfer rows remain even on
        masked pairs, as financial records — and the subject's wallet
        history with the entry ledger and hold history inline (AMD-PAY-14),
        surviving account deletion tied to the anonymous tombstone.
      responses:
        "200":
          description: The subject record.
          content:
            application/json:
              schema: { type: object }
  /v1/account/visibility:
    put:
      summary: Set the invisible switch (FR-18)
      description: >-
        Persistent across sessions and devices. Flipping invisible on purges
        live presence immediately; while set, presence publishes are refused
        with a 403.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invisible]
              additionalProperties: false
              properties:
                invisible: { type: boolean }
      responses:
        "200":
          description: Switch state stored.
          content:
            application/json:
              schema:
                type: object
                required: [ok, invisible]
                properties:
                  ok: { type: boolean }
                  invisible: { type: boolean }
        "400": { $ref: "#/components/responses/SchemaViolation" }
    get:
      summary: Read the invisible switch (FR-18)
      responses:
        "200":
          description: Current switch state.
          content:
            application/json:
              schema:
                type: object
                required: [invisible]
                properties:
                  invisible: { type: boolean }
  /v1/account/verticals:
    get:
      summary: List the vertical catalogue with my flag state (AMD-VERT-04)
      description: >-
        The onboarding/settings read model: every vertical the platform
        supports, in display order, with the caller's effective state,
        eligibility against the catalogue gates (KYC/adult), and whether the
        caller holds an explicit flag row. The locked core (discovery) is
        always present and always on.
      responses:
        "200":
          description: The catalogue with the caller's effective state.
          content:
            application/json:
              schema:
                type: object
                required: [verticals]
                properties:
                  verticals:
                    type: array
                    items:
                      type: object
                      required: [vertical, label, summary, locked, eligible, enabled, explicitChoice]
                      properties:
                        vertical:
                          type: string
                          enum: [discovery, venues, groups, dating, marketplace, services, payments, trust, introductions, serendipity]
                        label: { type: string }
                        summary: { type: string }
                        locked: { type: boolean }
                        eligible: { type: boolean }
                        reason: { type: string, enum: [kyc_required, underage] }
                        enabled: { type: boolean }
                        explicitChoice: { type: boolean }
                        source: { type: string, enum: [onboarding, settings, ops] }
    put:
      summary: Set vertical feature flags (AMD-VERT-05)
      description: >-
        The batch toggle write behind the onboarding screen and the settings
        screen. The patch is validated all-or-nothing: unknown keys,
        non-boolean values or an empty patch refuse with 400; narrowing the
        locked core refuses with 409; enabling a gated vertical the caller
        is not eligible for refuses with 403. Disabling never requires
        eligibility — narrowing is always safe. Default-on means an absent
        key leaves the vertical untouched.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patch, source]
              additionalProperties: false
              properties:
                patch:
                  type: object
                  additionalProperties: false
                  properties:
                    venues: { type: boolean }
                    groups: { type: boolean }
                    dating: { type: boolean }
                    marketplace: { type: boolean }
                    services: { type: boolean }
                    payments: { type: boolean }
                    trust: { type: boolean }
                    introductions: { type: boolean }
                    serendipity: { type: boolean }
                    discovery: { type: boolean }
                source: { type: string, enum: [onboarding, settings] }
      responses:
        "200":
          description: Flag state stored.
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: { type: string, enum: [updated] }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403":
          description: >-
            The caller is not eligible for a vertical they tried to enable
            (kyc_required | underage), or the account context is forbidden.
        "409":
          description: The patch tried to narrow the locked core (locked).
  /v1/profile/interests:
    put:
      summary: Replace the declared interest set (FR-08)
      description: >-
        3-20 unique taxonomy nodes with weights in (0, 1]. Unknown nodes are
        rejected with 422; sensitive nodes are rejected at write time
        (TR-22/FR-10) and never stored. The searchable picker is client work.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interests]
              additionalProperties: false
              properties:
                interests:
                  type: array
                  items:
                    type: object
                    required: [nodeId]
                    additionalProperties: false
                    properties:
                      nodeId: { type: string, minLength: 1, maxLength: 200 }
                      weight: { type: number, exclusiveMinimum: 0, maximum: 1 }
      responses:
        "200": { description: Interest set replaced. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "422": { description: Set size outside 3-20, duplicates, or unknown/sensitive node (FR-08/TR-22). }
    get:
      summary: Read the declared interest set (FR-08, FR-11)
      description: >-
        Also carries the FR-11 discoverability state: fewer than two
        non-sensitive interests makes the profile undiscoverable, and the
        response explains why so the editor can show the reason before the
        user leaves the screen.
      responses:
        "200":
          description: The requester's declared interests.
          content:
            application/json:
              schema:
                type: object
                required: [interests, discoverable]
                properties:
                  interests:
                    type: array
                    items:
                      type: object
                      required: [nodeId, weight]
                      properties:
                        nodeId: { type: string }
                        weight: { type: number }
                  discoverable:
                    type: boolean
                    description: FR-11 — at least two non-sensitive interests.
                  discoverabilityNote:
                    type: string
                    description: Present when discoverable is false; the FR-11 explanation for the editor.

  /v1/identity/status:
    get:
      summary: Own identity-assurance state (SRS Addendum 001, AMD-KYC-04)
      description: >-
        The requester's own KYC state, verification timestamp and avatar —
        and nothing else. KYC is platform-side assurance: this route is the
        only consumer read and it answers the owner alone. Discovery
        eligibility is attested device (FR-51) AND kyc_state = verified
        (AMD-KYC-01), enforced by the discovery_eligible view; no KYC
        attribute is ever disclosed to another user before OPEN.
      responses:
        "200":
          description: The requester's assurance state.
          content:
            application/json:
              schema:
                type: object
                required: [kycState]
                properties:
                  kycState:
                    type: string
                    enum: [pending, verified, rejected, suspended]
                  kycVerifiedAt: { type: string, format: date-time, nullable: true }
                  avatarKey: { type: string, nullable: true }
                  avatarSetAt: { type: string, format: date-time, nullable: true }
        "404": { description: Account not found. }
  /v1/profile/avatar:
    put:
      summary: Choose the avatar symbol (SRS Addendum 001, AMD-AVT-01/03)
      description: >-
        Sets the avatar to a key from the curated registry — a
        non-photographic symbol, never user-uploaded, never photo-derived,
        never free text. The symbol is the pre-OPEN recognition anchor on
        the match surface and offer (AMD-AVT-02). It MUST NOT change while
        a conversation is OPEN, and changes at most once per 24 hours
        (AMD-AVT-03) — a recognition anchor that shifts mid-negotiation is
        a confusion and evasion vector.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [avatarKey]
              additionalProperties: false
              properties:
                avatarKey:
                  type: string
                  minLength: 3
                  maxLength: 40
                  pattern: "^[a-z][a-z0-9-]{2,39}$"
      responses:
        "200": { description: Avatar recorded; changed flags whether the key moved. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "404": { description: Identity not set up yet (FR-06). }
        "409": { description: A conversation is open — the symbol is locked (AMD-AVT-03). }
        "422": { description: Not a curated registry key (AMD-AVT-01). }
        "429": { description: The 24-hour change cooldown is still running (AMD-AVT-03). }
  /v1/profile/identity:
    put:
      summary: Write the profile identity (FR-06)
      description: >-
        Handle (set-once — a different handle after first write answers
        409), optional display name (<=80 characters; when unset the display
        name defaults to the handle) and a one-line bio of at most 140
        characters. Free text is content-screened (SEC-37). The photo is
        uploaded out of band and stays hidden until an introduction reaches
        OPEN. First write requires the handle.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                handle: { type: string, pattern: "^[a-z0-9_]{3,24}$" }
                displayName: { type: [string, "null"], minLength: 1, maxLength: 80 }
                bio: { type: [string, "null"], maxLength: 140 }
      responses:
        "200":
          description: The identity after the write.
          content:
            application/json:
              schema:
                type: object
                required: [handle, displayName, bio, photoUrl, updatedAt]
                properties:
                  handle: { type: string }
                  displayName: { type: string, description: "Defaults to the handle (FR-06)." }
                  bio: { type: [string, "null"], maxLength: 140 }
                  photoUrl: { type: [string, "null"] }
                  updatedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "409": { description: Handle is set-once (FR-06). }
        "422": { description: Nothing to update, handle missing on first write, or screened text (SEC-37). }
    get:
      summary: Read the requester's profile identity (FR-06)
      responses:
        "200":
          description: The identity block; displayName defaults to the handle.
          content:
            application/json:
              schema:
                type: object
                required: [handle, displayName, bio, photoUrl, updatedAt]
                properties:
                  handle: { type: string }
                  displayName: { type: string }
                  bio: { type: [string, "null"], maxLength: 140 }
                  photoUrl: { type: [string, "null"] }
                  updatedAt: { type: string, format: date-time }
        "404": { description: Identity not set up yet. }

  /v1/profile/prompts:
    put:
      summary: Set structured prompts (FR-64)
      description: >-
        At most three prompts of 120 characters, in unique slots 1-3. Prompts
        are screened like announcement bodies and surface as reason material
        on scan results; they are never searchable and never indexed.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompts]
              additionalProperties: false
              properties:
                prompts:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    required: [slot, body]
                    additionalProperties: false
                    properties:
                      slot: { type: integer, minimum: 1, maximum: 3 }
                      body: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200": { description: Prompts stored. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "422": { description: Duplicate slots or failed screening (FR-64/SEC-37). }
    get:
      summary: Read own structured prompts (FR-64)
      responses:
        "200":
          description: The requester's prompts.
          content:
            application/json:
              schema:
                type: object
                required: [prompts]
                properties:
                  prompts:
                    type: array
                    items:
                      type: object
                      required: [slot, body]
                      properties:
                        slot: { type: integer }
                        body: { type: string }

  /v1/interests/{nodeId}/popularity:
    get:
      summary: k-suppressed local popularity of an interest (FR-13)
      description: >-
        How many people in the requester's live cell carry this interest
        (declarations of the node or its taxonomy descendants). Below k = 11
        the figure is withheld (BR-13). Sensitive nodes are indistinguishable
        from unknown ones (TR-22).
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Popularity figure, or null when suppressed.
          content:
            application/json:
              schema:
                type: object
                required: [nodeId, count, suppressed, k]
                properties:
                  nodeId: { type: string }
                  count: { type: [integer, "null"] }
                  suppressed: { type: boolean }
                  k: { type: integer }
        "404": { description: Unknown or sensitive interest (TR-22). }
        "409": { description: No live presence; enter a venue first. }

  /v1/account/notifications:
    get:
      summary: Read notification switches (FR-58) and quiet window (FR-57)
      responses:
        "200":
          description: Per-category switches; safety is always on.
          content:
            application/json:
              schema:
                type: object
                required: [prefs, quiet]
                properties:
                  prefs:
                    type: object
                    properties:
                      matches: { type: boolean }
                      messages: { type: boolean }
                      announcements: { type: boolean }
                      offers: { type: boolean }
                      nudges: { type: boolean }
                      safety: { type: boolean }
                  quiet:
                    type: object
                    nullable: true
                    description: FR-57 quiet window, "HH:MM" UTC; may wrap midnight.
                    properties:
                      start: { type: string }
                      end: { type: string }
    put:
      summary: Set notification switches (FR-58) and quiet window (FR-57)
      description: >-
        Partial patch per category. The safety category is exempt: setting it
        false is rejected with 422, and it is always stored as on. The quiet
        key sets {start,end} "HH:MM" UTC — equal values disable the window —
        or null to clear it.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prefs]
              additionalProperties: false
              properties:
                prefs:
                  type: object
                  additionalProperties: false
                  properties:
                    matches: { type: boolean }
                    messages: { type: boolean }
                    announcements: { type: boolean }
                    offers: { type: boolean }
                    nudges: { type: boolean }
                    safety: { type: boolean }
                    quiet:
                      nullable: true
                      type: object
                      required: [start, end]
                      additionalProperties: false
                      properties:
                        start: { type: string }
                        end: { type: string }
      responses:
        "200": { description: Switches stored. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "422": { description: Attempt to switch off safety notices (FR-58) or a malformed quiet window. }

  /v1/account/consents:
    get:
      summary: My data-processing consent artefacts (SEC-13)
      description: >-
        Every consent on file with its purpose, scope, policy version and
        grant/withdrawal timestamps — the retrievable artefact SEC-13
        requires. The same artefacts are part of the DSAR export (FR-62).
      responses:
        "200":
          description: Consent artefacts, ordered by purpose.
          content:
            application/json:
              schema:
                type: object
                required: [consents]
                properties:
                  consents:
                    type: array
                    items:
                      type: object
                      required: [purpose, scope, policyVersion, grantedAt, withdrawnAt]
                      properties:
                        purpose: { type: string }
                        scope: { type: string }
                        policyVersion: { type: string }
                        grantedAt: { type: string, format: date-time }
                        withdrawnAt: { type: string, format: date-time, nullable: true }
  /v1/account/consents/{purpose}:
    put:
      summary: Grant (or re-grant) a data-processing consent (SEC-13)
      description: >-
        Records the consent with purpose, scope, timestamp and policy
        version. Re-granting a withdrawn purpose supersedes the earlier
        artefact and clears the withdrawal mark.
      parameters:
        - name: purpose
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9_]{1,64}$" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, policyVersion]
              additionalProperties: false
              properties:
                scope: { type: string, minLength: 1 }
                policyVersion: { type: string, minLength: 1 }
      responses:
        "200": { description: Consent recorded; returns the stored artefact. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
    delete:
      summary: Withdraw a data-processing consent (SEC-13)
      description: >-
        Withdrawal is as easy as grant — one call. The artefact is kept and
        marked withdrawn_at; withdrawing twice returns the same artefact.
      parameters:
        - name: purpose
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9_]{1,64}$" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Consent withdrawn; returns the stored artefact. }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "404": { description: No consent on file for this purpose. }

  /v1/account:
    delete:
      summary: Erase the account (FR-03, FR-04)
      description: >-
        One call erases presence, envelopes, profile, identity and blocks;
        pairs close with neutral reasons; ledger attribution is anonymised
        after the 90-day hold (NFR-21).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Account erased. }
  /v1/ops/geofences:
    post:
      summary: Author a geofence draft (TR-41)
      description: >-
        Venue-ops console (workforce realm, venue-ops role). The polygon is
        GeoJSON with a single closed ring — what the GeoLibre editor draws
        (ADR-0008). The density gate runs at authoring time for editor
        feedback and again, as the final authority, inside publish.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, venueId, polygon]
              additionalProperties: false
              properties:
                targetType: { type: string, enum: [venue, floor] }
                venueId: { type: string, format: uuid }
                floorId: { type: string, maxLength: 32 }
                polygon: { type: object, description: GeoJSON Polygon, one closed ring }
      responses:
        "200": { description: Draft created (status draft). }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Venue-ops role required. }
        "422": { description: Polygon invalid or fails the density gate. }
    get:
      summary: Geofence draft queue (TR-41)
      description: >-
        Venue-ops console. Optional status filter; each entry carries the
        workflow state plus its vertex count and area for review triage.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, in_review, approved, published, rejected] }
      responses:
        "200": { description: Draft list (newest first, capped at 200). }
        "403": { description: Venue-ops role required. }
  /v1/ops/geofences/{draftId}/submit:
    post:
      summary: Submit a draft for review (TR-41)
      description: Only the author submits their own draft (draft -> in_review).
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Draft submitted. }
        "403": { description: Venue-ops role required. }
        "409": { description: Draft cannot be submitted (wrong state or not the author). }
  /v1/ops/geofences/{draftId}/approve:
    post:
      summary: Approve a geofence draft — second person (TR-41)
      description: >-
        The reviewer is recorded and must not be the author (four-eyes, the
        taxonomy-release discipline). in_review -> approved.
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Draft approved; reviewer recorded. }
        "403": { description: Venue-ops role required. }
        "409": { description: Cannot be approved by this reviewer. }
  /v1/ops/geofences/{draftId}/reject:
    post:
      summary: Reject a geofence draft (TR-41)
      description: in_review -> rejected with a review note for the author.
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              additionalProperties: false
              properties:
                message: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { description: Draft rejected. }
        "403": { description: Venue-ops role required. }
        "409": { description: Cannot be rejected by this reviewer. }
  /v1/ops/geofences/{draftId}/publish:
    post:
      summary: Publish a geofence draft (TR-41, TR-42)
      description: >-
        The only path to live geometry. The database verifies in one
        transaction that the draft is approved, the caller is the recorded
        second person (never the author), and the polygon passes the density
        gate; venue-target polygons must additionally clear the overlap gate
        (TECH-24) — no publishing over another venue's ground; then the
        canonical PostGIS record (venues.geofence or venue_floors.geofence)
        is written and the action is audit-logged.
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Published to the canonical geometry record. }
        "403": { description: Venue-ops role required. }
        "409": { description: Not approved, not the second person, or density/overlap verification failed. }
  /v1/ops/geofences/overlap-check:
    post:
      summary: Overlap feedback for the editor (TECH-24)
      description: >-
        Venue-ops console. Read-only QA probe for the GeoLibre editor: runs
        the same geofence_overlap_check the publish gate enforces, so what
        the editor shows is what publish will enforce. Returns the
        conflicting venues with intersection areas; an empty list means the
        polygon claims no ground another venue already owns.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venueId, polygon]
              additionalProperties: false
              properties:
                venueId: { type: string, format: uuid }
                polygon: { type: object, description: GeoJSON Polygon, one closed ring }
      responses:
        "200": { description: Overlap verdict (ok plus any conflicts). }
        "400": { $ref: "#/components/responses/SchemaViolation" }
        "403": { description: Venue-ops role required. }
        "422": { description: Polygon could not be parsed. }
  /v1/ops/geofences/qa:
    get:
      summary: Geofence estate QA audit (TECH-24)
      description: >-
        Venue-ops console. The post-publish audit behind the QA dashboard:
        per venue — coverage (has a geofence), density re-verification of
        the live polygon, overlap conflicts against other venues, the
        geometry version attribution is bound to, and drafts in flight.
      responses:
        "200": { description: Per-venue QA rows for the whole estate. }
        "403": { description: Venue-ops role required. }
  /v1/ops/geofences/qa/geojson:
    get:
      summary: Estate geofences as GeoJSON (venue-ops; AMD-MAP-04)
      description: >-
        The console estate map's overlay source: every active venue's
        published geofence as a GeoJSON polygon with venue identity.
        Operational geometry only — no personal data — but still behind
        the venue-ops gate, so the estate view is a workforce surface by
        construction.
      responses:
        "200":
          description: Active geofenced venues, name-ordered.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    venueId: { type: string, format: uuid }
                    label: { type: string }
                    geofence: { type: object }
        "403": { description: Venue-ops role required. }
  /v1/presence/bond:
    post:
      summary: Place a presence bond (SRS Addendum 001, AMD-INN-01)
      description: >-
        Stakes the pinned bond (100,000 minor units) as a showing-up
        commitment, reserved through a standard wallet hold. One active
        bond per user; KYC-verified only; body empty.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201": { description: Bond placed; returns bondId. }
        "403": { description: KYC required. }
        "409": { description: A bond is already active, or no active wallet. }
        "422": { description: Insufficient funds. }
        "503": { description: The wallet rail is switched off (WALLET_RAIL). }
  /v1/presence/bond/release:
    post:
      summary: Release the caller's bond (AMD-INN-01)
      description: >-
        The owner releases an active bond; the hold voids and nothing
        moves. Body: { bondId }.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Released. }
        "404": { description: Unknown or not the caller's bond. }
        "503": { description: The wallet rail is switched off (WALLET_RAIL). }
  /v1/moderation/bonds/{bondId}/forfeit:
    post:
      summary: Forfeit a bond on a report (AMD-INN-01)
      description: >-
        Moderator-only. The hold posts and the value moves user ->
        platform as fee entries; forfeiture MUST name a report against the
        bond's owner. Audited in the admin audit log.
      parameters:
        - name: bondId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportId]
              additionalProperties: false
              properties:
                reportId: { type: string, format: uuid }
      responses:
        "200": { description: Forfeited. }
        "403": { description: Moderator role required. }
        "404": { description: Unknown bond. }
        "422": { description: The report does not name the bond's owner. }
        "503": { description: The wallet rail is switched off (WALLET_RAIL). }
  /v1/met-receipts:
    post:
      summary: Submit a verified-met co-attestation (AMD-INN-02)
      description: >-
        The caller's half of a pair co-attestation. A reciprocal
        submission inside the pinned 900-second window confirms the
        receipt. No location, no device data, no free text.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peer]
              additionalProperties: false
              properties:
                peer: { type: string, format: uuid }
      responses:
        "201": { description: Confirmed — the peer's half was waiting. }
        "202": { description: Pending — the caller's half is recorded. }
        "422": { description: Self or unknown peer. }
    get:
      summary: List the caller's met receipts (AMD-INN-02)
      responses:
        "200": { description: Own receipts, newest first. }
  /v1/escrows:
    post:
      summary: Create a trust escrow (AMD-INN-03)
      description: >-
        The milestone list is the contract: 1..12 positive amounts summing
        to at most 5,000,000 minor units, reserved up front as a single
        wallet hold. Both parties KYC-verified.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payee, milestones]
              additionalProperties: false
              properties:
                payee: { type: string, format: uuid }
                milestones:
                  type: array
                  minItems: 1
                  maxItems: 12
                  items: { type: integer, minimum: 1 }
      responses:
        "201": { description: Created; returns escrowId. }
        "403": { description: KYC required (either party). }
        "422": { description: Invalid amounts, unknown payee, self, or insufficient funds. }
        "409": { description: No active wallet. }
        "503": { description: The wallet rail is switched off (WALLET_RAIL). }
    get:
      summary: List the caller's escrows with milestones (AMD-INN-03)
      responses:
        "200": { description: Party-scoped escrows and their milestones. }
  /v1/escrows/{escrowId}/milestones/{seq}/release:
    post:
      summary: Release one escrow milestone (AMD-INN-03)
      description: >-
        Payer only; body strictly empty. Value moves payer -> payee. When
        the last pending milestone releases, the hold voids and the escrow
        completes.
      parameters:
        - name: escrowId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: seq
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Released, or completed when the last milestone released. }
        "404": { description: Unknown escrow or milestone. }
        "503": { description: The wallet rail is switched off (WALLET_RAIL). }
  /v1/escrows/{escrowId}/dispute:
    post:
      summary: Dispute an active escrow (AMD-INN-03)
      description: >-
        Either party may dispute; the remaining value stays held until a
        moderator resolves. Body strictly empty.
      parameters:
        - name: escrowId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Disputed. }
        "404": { description: Unknown escrow. }
  /v1/moderation/escrows/{escrowId}/resolve:
    post:
      summary: Resolve a disputed escrow (AMD-INN-03, AMD-ESC-01)
      description: >-
        Moderator-only. 'refund' voids the hold and refunds the remainder;
        'release' pays every remaining milestone to the payee and
        completes. Audited either way. When the remaining value exceeds
        the AMD-ESC-01 four-eyes threshold the call records a resolution
        request and moves no value — a second moderator approves or
        rejects it under /v1/moderation/escrow-resolutions.
      parameters:
        - name: escrowId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [refund, release] }
      responses:
        "200": { description: Resolved. }
        "202": { description: Four-eyes approval required (AMD-ESC-01); no value moved. }
        "403": { description: Moderator role required. }
        "404": { description: Unknown or undisputed escrow. }
        "503": { description: The wallet rail is switched off (WALLET_RAIL). }
  /v1/groups/{tableId}/stake:
    post:
      summary: Stake a group-table seat (AMD-INN-04)
      description: >-
        Reserves the pinned stake (50,000 minor) on an open table under
        the six-seat cap. One active stake per user per table; body
        strictly empty.
      parameters:
        - name: tableId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201": { description: Staked; returns stakeId. }
        "403": { description: KYC required. }
        "404": { description: Unknown table. }
        "409": { description: Table closed or full, or a stake already active. }
        "422": { description: Insufficient funds. }
        "503": { description: The wallet rail is switched off (WALLET_RAIL). }
  /v1/groups/{tableId}/stake/refund:
    post:
      summary: Refund a stake after verified check-in (AMD-INN-04)
      description: >-
        Presence proven before value returns: the FR-100 check-in token
        MUST verify against the table's venue before the hold voids.
      parameters:
        - name: tableId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stakeId, checkinToken]
              additionalProperties: false
              properties:
                stakeId: { type: string, format: uuid }
                checkinToken: { type: string, maxLength: 1024 }
      responses:
        "200": { description: Refunded. }
        "401": { description: Invalid or expired check-in token (FR-100). }
        "404": { description: Unknown stake. }
        "503": { description: The wallet rail is switched off (WALLET_RAIL). }
  /v1/moderation/sweeps:
    post:
      summary: Run a pinned expiry/forfeiture sweep (AMD-INN-02/04/10)
      description: >-
        Moderator-only. kind selects the sweep: met_receipts (expire
        unconfirmed windows), introductions (expire unanswered proposals),
        group_stakes (forfeit no-show stakes older than 24 h).
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [met_receipts, introductions, group_stakes] }
      responses:
        "200": { description: The number swept. }
        "403": { description: Moderator role required. }
        "503": { description: The wallet rail is switched off (WALLET_RAIL). }
  /v1/disclosure-grants:
    post:
      summary: Issue a selective-disclosure grant (AMD-INN-06)
      description: >-
        A single-use, 900-second TTL proof of exactly one claim. The
        secret is returned once and stored only as a digest.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claim]
              additionalProperties: false
              properties:
                claim: { type: string, enum: [over_18, kyc_verified] }
      responses:
        "201": { description: Issued; returns grantId, secret, expiresAt. }
        "403": { description: The claim is not proven for this account. }
        "422": { description: Claim outside the pinned vocabulary. }
  /v1/venues/disclosure-verify:
    post:
      summary: Redeem a disclosure grant (AMD-INN-06)
      description: >-
        Venue-ops only. Answers the claim — never the account, the birth
        year, or the KYC record. Single-use; expiry and reuse answer 410.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grantId, secret]
              additionalProperties: false
              properties:
                grantId: { type: string, format: uuid }
                secret: { type: string, pattern: "^[0-9a-f]{48}$" }
      responses:
        "200": { description: The claim, and nothing else. }
        "403": { description: Venue-ops role required. }
        "404": { description: Invalid grant or secret. }
        "410": { description: Used or expired. }
  /v1/serendipity/windows:
    post:
      summary: Declare a serendipity window (AMD-INN-08)
      description: >-
        A weekly availability window (weekday 0-6, hour range, market). At
        most four active per account.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weekday, hourStart, hourEnd, market]
              additionalProperties: false
              properties:
                weekday: { type: integer, minimum: 0, maximum: 6 }
                hourStart: { type: integer, minimum: 0, maximum: 23 }
                hourEnd: { type: integer, minimum: 1, maximum: 24 }
                market: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "201": { description: Added; returns windowId. }
        "409": { description: Four windows already active. }
        "422": { description: Invalid window. }
    get:
      summary: List the caller's serendipity windows (AMD-INN-08)
      responses:
        "200": { description: Own windows, newest first. }
  /v1/serendipity/windows/{windowId}/state:
    post:
      summary: Pause or resume a window (AMD-INN-08)
      description: >-
        Windows pause and resume; they are never deleted. Resuming honours
        the four-active cap.
      parameters:
        - name: windowId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              additionalProperties: false
              properties:
                state: { type: string, enum: [active, paused] }
      responses:
        "200": { description: Updated. }
        "404": { description: Unknown window. }
        "409": { description: Four windows already active. }
  /v1/serendipity/overlap:
    get:
      summary: Do the caller and a peer overlap? (AMD-INN-08)
      description: >-
        A boolean, computed server-side. The peer's windows are never
        revealed.
      parameters:
        - name: peer
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: "{ overlap: boolean }." }
  /v1/attestation:
    get:
      summary: Mint a verification passport (AMD-INN-09; wire name "attestation") (AMD-INN-09)
      description: >-
        KYC-verified only. Returns a one-hour HMAC-signed token carrying a
        pseudonymous subject and the caller's proven claims.
      responses:
        "200": { description: "{ token, claims }." }
        "403": { description: KYC required. }
        "503": { description: Passport signing unconfigured (PRESENCE_PASSPORT_SECRET). }
  /v1/attestation/verify:
    post:
      summary: Verify a passport — UNAUTHENTICATED (wire name "attestation") (AMD-INN-09)
      description: >-
        The caller is a third-party verifier with no account; the token
        itself is the credential. Answers valid (with the claims) |
        expired | invalid — never identity. Every verdict is counted in
        presence_attestation_verify_results_total.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, maxLength: 2048 }
      responses:
        "200": { description: The verdict. }
        "503": { description: Passport verification unconfigured. }
  /v1/introductions:
    post:
      summary: Propose a host-mediated introduction (AMD-INN-10)
      description: >-
        The caller hosts; both parties must exist and be KYC-verified; a
        block between the parties in either direction is an absolute
        refusal; one open introduction per pair.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partyA, partyB]
              additionalProperties: false
              properties:
                partyA: { type: string, format: uuid }
                partyB: { type: string, format: uuid }
      responses:
        "201": { description: Proposed; returns introId. }
        "403": { description: KYC required (host or a party). }
        "409": { description: Blocked pair or an open introduction exists. }
        "422": { description: Invalid parties. }
    get:
      summary: List introductions the caller hosts or parties (AMD-INN-10)
      responses:
        "200": { description: Own introductions, newest first. }
  /v1/introductions/{introId}/answer:
    post:
      summary: Answer an introduction (AMD-INN-10)
      description: >-
        A party answers for themselves. The second accept moves the
        introduction to accepted and opens the pair at MUTUAL through the
        FR-29 consent ledger — never by direct update.
      parameters:
        - name: introId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [accept, decline] }
      responses:
        "200": { description: Accepted (both) or declined. }
        "202": { description: Recorded — waiting on the other party. }
        "404": { description: Unknown introduction. }
  /v1/dating/preferences:
    post:
      summary: Set or refresh dating preferences (AMD-DATE-01)
      description: >-
        The dating profile is a structured, enumerated attribute set —
        gender, seeking (1-3 genders), goal, age range — and nothing
        else. No photo (FR-87), no free text (FR-96/SEC-37). The definer
        proves KYC-verified and adult at write.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gender, seeking, goal, ageMin, ageMax]
              additionalProperties: false
              properties:
                gender: { type: string, enum: [female, male, nonbinary] }
                seeking:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items: { type: string, enum: [female, male, nonbinary] }
                goal: { type: string, enum: [long_term, short_term, friendship, exploring] }
                ageMin: { type: integer, minimum: 18, maximum: 99 }
                ageMax: { type: integer, minimum: 18, maximum: 99 }
      responses:
        "200": { description: Recorded. }
        "400": { description: Invalid preferences. }
        "403": { description: Forbidden, kyc_required or underage. }
  /v1/dating/profile:
    get:
      summary: Read the caller's dating profile (AMD-DATE-01)
      description: Own profile only (RLS owner read). There is no browse of dating profiles.
      responses:
        "200": { description: The caller's profile, or null. }
  /v1/dating/state:
    post:
      summary: Pause or resume dating mode (AMD-DATE-05)
      description: >-
        Resuming re-proves KYC and age — both can move while the profile
        is paused.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              additionalProperties: false
              properties:
                state: { type: string, enum: [active, paused] }
      responses:
        "200": { description: Updated. }
        "400": { description: Invalid state. }
        "403": { description: Forbidden, kyc_required or underage on resume. }
        "404": { description: No dating profile. }
  /v1/dating/compatibility:
    get:
      summary: Is the caller mutually compatible with this peer? (AMD-DATE-03)
      description: >-
        A boolean, computed server-side: both profiles active, both
        KYC-verified adults, mutual seeking, mutual age range, same goal,
        no block. The cause is never revealed (FR-34 silence).
      parameters:
        - name: peer
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: "{ compatible: boolean }" }
        "400": { description: Invalid query. }
  /v1/dating/counterpart:
    get:
      summary: Read a counterpart's dating attributes (AMD-DATE-04)
      description: >-
        The only cross-user read of dating attributes: gender, seeking,
        goal and the age range — never a birth year. Revealed only when
        the pair is mutually compatible AND stands at NUDGED or later.
      parameters:
        - name: peer
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: "{ profile: {...} | null }" }
        "400": { description: Invalid query. }
  /v1/marketplace/listings:
    post:
      summary: Create a draft listing (AMD-MKT-01/04)
      description: >-
        A structured record and nothing else: kind, taxonomy category,
        price in minor units, market. No description, no photo, no free
        text. Terms are immutable once created — a price change is
        remove-and-recreate.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, category, priceMinor, market]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [item, service] }
                category: { type: string, description: taxonomy node id (dotted path, non-sensitive) }
                priceMinor: { type: integer, minimum: 1, maximum: 5000000 }
                market: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "201": { description: Created; returns listingId. }
        "403": { description: Forbidden or kyc_required. }
        "409": { description: Twelve live listings already. }
        "422": { description: Invalid kind, category, price or market. }
    get:
      summary: Browse live listings (AMD-MKT-04)
      description: >-
        Live (listed | held) listings, newest first, at most 50. RLS limits
        browse to KYC-verified callers; the projection carries no seller
        identity (FR-30).
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string, enum: [item, service] }
        - name: market
          in: query
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200": { description: Matching live listings. }
        "400": { description: Invalid query. }
  /v1/marketplace/listings/mine:
    get:
      summary: List the caller's own listings, any state (AMD-MKT-01)
      responses:
        "200": { description: Own listings, newest first. }
  /v1/marketplace/listings/{listingId}/list:
    post:
      summary: Publish a draft listing (AMD-MKT-01)
      parameters:
        - name: listingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Listed. }
        "404": { description: Unknown listing (or not the caller's). }
        "409": { description: Not a draft. }
  /v1/marketplace/listings/{listingId}/remove:
    post:
      summary: Seller takedown of a draft or listed listing (AMD-MKT-01)
      description: A held listing cannot be removed out from under an escrow.
      parameters:
        - name: listingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Removed. }
        "404": { description: Unknown listing (or not the caller's). }
        "409": { description: Not in a removable state. }
  /v1/marketplace/listings/{listingId}/purchase:
    post:
      summary: Buy a listed listing (AMD-MKT-03)
      description: >-
        One atomic transaction: the single-milestone AMD-INN-03 escrow
        (payee = seller, amount = price), the order row, and the listing's
        move to held — inside the AMD-PAY-15 settlement gate.
      parameters:
        - name: listingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201": { description: Purchased; returns orderId. }
        "403": { description: Forbidden or kyc_required. }
        "404": { description: Unknown listing. }
        "409": { description: Not listed, own listing, or wallet unavailable. }
        "422": { description: Insufficient funds. }
        "503": { description: Wallet rail disabled (AMD-PAY-15). }
  /v1/marketplace/orders:
    get:
      summary: List the caller's orders, either role (AMD-MKT-03)
      responses:
        "200": { description: Own orders as buyer or seller, newest first. }
  /v1/marketplace/orders/{orderId}/confirm:
    post:
      summary: Buyer confirms receipt (AMD-MKT-03)
      description: >-
        The escrow's milestone releases to the seller, the order completes,
        the listing sells — one transaction.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Completed. }
        "404": { description: Unknown order (or not the buyer). }
        "503": { description: Wallet rail disabled (AMD-PAY-15). }
  /v1/marketplace/orders/{orderId}/dispute:
    post:
      summary: Either party disputes an active order (AMD-MKT-03)
      description: The value stays held until moderation resolves.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Disputed. }
        "404": { description: Unknown order (or not a party). }
  /v1/moderation/marketplace/listings/{listingId}/remove:
    post:
      summary: Moderation takedown of a listing (AMD-MKT-05)
      description: >-
        Workforce role. Governed reason code, audited in the admin audit
        log. A held listing is never removed out from under an escrow.
      parameters:
        - name: listingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              additionalProperties: false
              properties:
                reasonCode: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200": { description: Removed. }
        "400": { description: Reason code required. }
        "404": { description: Unknown listing. }
        "409": { description: Not in a removable state. }
  /v1/moderation/marketplace/orders/{orderId}/resolve:
    post:
      summary: Resolve a disputed order (AMD-MKT-03/05)
      description: >-
        Workforce role. refund pays the buyer back and relists the
        listing; release pays the seller and completes the sale.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [refund, release] }
      responses:
        "200": { description: Resolved. }
        "202": { description: Four-eyes approval required (AMD-ESC-01); no value moved. }
        "400": { description: Invalid decision. }
        "404": { description: Unknown order. }
        "503": { description: Wallet rail disabled (AMD-PAY-15). }
  /v1/moderation/escrow-resolutions:
    get:
      summary: List escrow resolution requests (AMD-ESC-01)
      description: >-
        Moderator-only. The four-eyes queue of high-value dispute
        resolutions — pending first, then history. Each row freezes the
        escrow, the decision, the remaining value and the proposer.
      responses:
        "200": { description: The resolution queue. }
        "403": { description: Moderator role required. }
  /v1/moderation/escrow-resolutions/{approvalId}/approve:
    post:
      summary: Approve an escrow resolution (AMD-ESC-01)
      description: >-
        Moderator-only, and never the proposing moderator. Executes exactly
        the frozen decision in the same transaction; value moves under the
        wallet rail kill switch. Body strictly empty — the approval carries
        the terms.
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Approved and resolved. }
        "403": { description: Moderator role required. }
        "404": { description: Unknown approval. }
        "409": { description: Self-approval, already decided, or the escrow is no longer disputed. }
        "503": { description: The wallet rail is switched off (WALLET_RAIL). }
  /v1/moderation/escrow-resolutions/{approvalId}/reject:
    post:
      summary: Reject an escrow resolution (AMD-ESC-01)
      description: >-
        Moderator-only. Closes the request without moving value; the
        dispute stays open for a new proposal. Body strictly empty.
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Rejected. }
        "403": { description: Moderator role required. }
        "404": { description: Unknown approval. }
        "409": { description: Already decided. }
  /v1/swaps/listings:
    post:
      summary: Create a swap listing (AMD-SWP-01)
      description: >-
        A structured record and nothing else: a have category, one to three
        distinct want categories, a value estimate in minor units, a market.
        No description, no photo, no free text. Terms are immutable once
        created — a change is remove-and-recreate.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [haveCategory, wantCategories, valueEstimateMinor, market]
              additionalProperties: false
              properties:
                haveCategory: { type: string, description: taxonomy node id (dotted path, non-sensitive) }
                wantCategories:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items: { type: string, description: taxonomy node id (dotted path) }
                valueEstimateMinor: { type: integer, minimum: 1, maximum: 5000000 }
                market: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "201": { description: Created; returns swapListingId. }
        "400": { description: Invalid body. }
        "403": { description: Forbidden or kyc_required. }
        "409": { description: Twelve live swap listings already. }
        "422": { description: Unknown or sensitive category, invalid wants, value or market. }
        "503": { description: Wallet rail disabled (AMD-PAY-15). }
  /v1/swaps/listings/mine:
    get:
      summary: List my swap listings (AMD-SWP-01)
      description: >-
        The caller's own swap listings, newest first, every state. Owner
        only — RLS enforces it.
      responses:
        "200": { description: The caller's swap listings. }
  /v1/swaps/candidates:
    get:
      summary: Reciprocal swap candidates (AMD-SWP-02)
      description: >-
        Listed swaps whose have is covered by one of the caller's wants AND
        whose want set covers the caller's have, within the same market —
        coverage rides the TR-18 taxonomy closure. KYC-gated, block-aware
        both directions, callable only by a caller holding a listed swap,
        pinned to 50 rows. The projection carries no owner identity (FR-30).
      responses:
        "200": { description: Candidate rows — listing fields only, never an owner. }
  /v1/swaps/listings/{listingId}/remove:
    post:
      summary: Remove an own swap listing (AMD-SWP-01)
      description: >-
        Owner takedown of a listed swap. A held swap refuses — its
        agreement resolves first.
      parameters:
        - name: listingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Removed. }
        "403": { description: Not the owner. }
        "404": { description: Unknown listing. }
        "409": { description: The listing is held by an open agreement. }
  /v1/swaps/proposals:
    post:
      summary: Propose a swap (AMD-SWP-03)
      description: >-
        Names two listings — the proposer's and the counterparty's — an
        optional cash balancer (proposer → counterparty) and whether the
        pinned ₦1,000 swap bond is required. The balancer is reserved from
        the proposer's wallet as a hold at propose time, inside the
        settlement gate; a zero balancer places no hold. Both listings move
        to held atomically.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [myListingId, theirListingId, balanceMinor, requiresBond]
              additionalProperties: false
              properties:
                myListingId: { type: string, format: uuid }
                theirListingId: { type: string, format: uuid }
                balanceMinor: { type: integer, minimum: 0, maximum: 5000000 }
                requiresBond: { type: boolean }
      responses:
        "201": { description: Proposed; returns agreementId. }
        "400": { description: Invalid body. }
        "403": { description: KYC required, blocked pair, or not the listing owner. }
        "404": { description: Unknown listing. }
        "409": >
          A listing is not listed, the pair is not reciprocally compatible,
          or one listing already sits in an open agreement.
        "422": { description: Insufficient funds for the balancer hold. }
        "503": { description: Wallet rail disabled (AMD-PAY-15). }
  /v1/swaps/{agreementId}/respond:
    post:
      summary: Answer a swap proposal (AMD-SWP-03)
      description: >-
        Counterparty only. Acceptance re-proves both sides' KYC and, when
        the bond is required, refuses until both parties hold an active
        bond. Rejection unwinds everything: the balancer hold voids, the
        bonds release, the listings relist.
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept]
              additionalProperties: false
              properties:
                accept: { type: boolean }
      responses:
        "200": { description: Accepted or rejected; returns the new state. }
        "403": { description: Not the counterparty. }
        "404": { description: Unknown agreement. }
        "409": >
          The agreement is not proposed, a KYC re-proof failed, or a
          required bond is not yet staked.
        "503": { description: Wallet rail disabled (AMD-PAY-15). }
  /v1/swaps/{agreementId}/cancel:
    post:
      summary: Withdraw a swap proposal (AMD-SWP-03)
      description: >-
        Proposer only, while the proposal is unanswered. Everything unwinds:
        the balancer hold voids, the bonds release, the listings relist.
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Cancelled. }
        "403": { description: Not the proposer. }
        "404": { description: Unknown agreement. }
        "409": { description: The agreement is not proposed. }
        "503": { description: Wallet rail disabled (AMD-PAY-15). }
  /v1/swaps/{agreementId}/stake-bond:
    post:
      summary: Stake the swap bond (AMD-SWP-04)
      description: >-
        Either party stakes the pinned ₦1,000 bond on a bond-required
        agreement, reserved from their own wallet as a hold. One active
        bond per party per agreement.
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201": { description: Staked; returns bondId. }
        "403": { description: Not a party, or KYC required. }
        "404": { description: Unknown agreement. }
        "409": { description: Bond not required, already staked, or the agreement is closed. }
        "422": { description: Insufficient funds for the bond hold. }
        "503": { description: Wallet rail disabled (AMD-PAY-15). }
  /v1/swaps/{agreementId}/confirm:
    post:
      summary: Confirm the exchange (AMD-SWP-03)
      description: >-
        Either party confirms the physical exchange exactly once. The
        second confirmation settles atomically: the balancer posts to the
        counterparty, the bonds release, the agreement completes, both
        listings move to swapped.
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": >
          Confirmed — "confirmed" after the first confirmation,
          "completed" after the second.
        "403": { description: Not a party. }
        "404": { description: Unknown agreement. }
        "409": { description: The agreement is not accepted, or the caller already confirmed. }
        "503": { description: Wallet rail disabled (AMD-PAY-15). }
  /v1/swaps/{agreementId}/dispute:
    post:
      summary: Dispute a swap agreement (AMD-SWP-03/05)
      description: >-
        Either party, from accepted only. The balancer and the bonds stay
        frozen until moderation resolves.
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Disputed. }
        "403": { description: Not a party. }
        "404": { description: Unknown agreement. }
        "409": { description: The agreement is not accepted. }
  /v1/swaps/agreements:
    get:
      summary: List my swap agreements (AMD-SWP-03)
      description: >-
        The caller's agreements in either role (proposer or counterparty),
        newest first. Party only — RLS enforces it.
      responses:
        "200": { description: The caller's swap agreements. }
  /v1/swaps/agreements/{agreementId}:
    get:
      summary: Read one swap agreement (AMD-SWP-03)
      description: >-
        Party only. A non-party read answers 404 — agreement existence is
        never leaked.
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: The agreement. }
        "404": { description: Unknown agreement, or the caller is not a party. }
  /v1/moderation/swaps/disputed:
    get:
      summary: List disputed swap agreements (AMD-SWP-05)
      description: >-
        Moderator-only. The swap dispute queue, oldest first — the
        AMD-ESC-02 visibility discipline applied to barter.
      responses:
        "200": { description: The disputed swap queue. }
        "403": { description: Moderator role required. }
  /v1/moderation/swaps/{agreementId}/resolve:
    post:
      summary: Resolve a disputed swap (AMD-SWP-05)
      description: >-
        Moderator-only, disputed only. "refund" voids the balancer, cancels
        the agreement and relists both listings; "release" posts the
        balancer to the counterparty, completes the agreement and moves
        both listings to swapped. Either decision may additionally forfeit
        one party's active bond TO THE OTHER PARTY — never to the platform.
        Audited in the admin audit log.
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [refund, release] }
                forfeitBondId: { type: string, format: uuid }
      responses:
        "200": { description: Resolved; returns the new state. }
        "400": { description: Invalid decision. }
        "403": { description: Moderator role required. }
        "404": { description: Unknown agreement or bond. }
        "409": { description: The agreement is not disputed. }
        "503": { description: Wallet rail disabled (AMD-PAY-15). }
  /v1/services/bookings:
    post:
      summary: Book a service listing (AMD-SVC-02)
      description: >-
        One transaction: the AMD-INN-03 milestone escrow — an even split,
        the last milestone absorbing the remainder — IS the booking; the
        listing stays listed (a service offer is repeatable). The caller
        books; the listing's seller provides. Both sides must be
        KYC-verified; a block in either direction refuses.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingId, agreedMinor, milestones]
              additionalProperties: false
              properties:
                listingId: { type: string, format: uuid }
                agreedMinor:
                  type: integer
                  minimum: 1
                  maximum: 5000000
                  description: The agreed total in minor units (NGN only).
                milestones: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "201": { description: Booked; returns the booking id. }
        "400": { description: Invalid body. }
        "403": { description: KYC required, blocked, or the rail gate is off. }
        "404": { description: Unknown listing. }
        "409": { description: The listing is not available. }
        "422": { description: Not a service listing, self-booking, invalid amount or milestones, insufficient funds, or no active payee wallet. }
        "503": { description: Wallet rail disabled (AMD-PAY-15). }
  /v1/services/bookings/mine:
    get:
      summary: List my service bookings (AMD-SVC-02)
      description: >-
        The caller's bookings in either role (customer or provider), newest
        first. Party only — RLS enforces it.
      responses:
        "200": { description: The caller's service bookings. }
  /v1/services/bookings/{bookingId}:
    get:
      summary: Read one service booking (AMD-SVC-02/05)
      description: >-
        Party only; returns the booking plus its append-only event stream,
        oldest first. A non-party read answers 404 — booking existence is
        never leaked.
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: The booking and its events. }
        "404": { description: Unknown booking, or the caller is not a party. }
  /v1/services/bookings/{bookingId}/start:
    post:
      summary: Start work on a booking (AMD-SVC-02)
      description: >-
        Provider-only, accepted bookings only. No value moves — starting
        stops the AMD-SVC-04 168 h ghosting clock.
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Started; returns the new state. }
        "403": { description: The caller is not the provider. }
        "404": { description: Unknown booking. }
        "409": { description: The booking is not in the accepted state. }
  /v1/services/bookings/{bookingId}/milestones/{milestone}/confirm:
    post:
      summary: Confirm a milestone (AMD-SVC-02)
      description: >-
        Customer-only, in-progress bookings only. Releases one escrow
        milestone to the provider; the last release completes the escrow
        and the booking together.
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: milestone
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Confirmed (or completed on the last milestone); returns the new state. }
        "403": { description: The caller is not the customer. }
        "404": { description: Unknown booking or milestone. }
        "409": { description: The booking is not in progress. }
        "503": { description: Wallet rail disabled (AMD-PAY-15). }
  /v1/services/bookings/{bookingId}/dispute:
    post:
      summary: Dispute a service booking (AMD-SVC-03)
      description: >-
        Either party, live bookings only (accepted or in progress). The
        escrow freezes until moderation resolves. No value moves — a
        dispute is always available.
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Disputed; returns the new state. }
        "403": { description: The caller is not a party. }
        "404": { description: Unknown booking. }
        "409": { description: The booking is already closed or disputed. }
  /v1/moderation/services/disputed:
    get:
      summary: List disputed service bookings (AMD-SVC-03)
      description: >-
        Moderator-only. The service dispute queue, oldest first — the
        AMD-ESC-02 visibility discipline applied to services.
      responses:
        "200": { description: The disputed services queue. }
        "403": { description: Moderator role required. }
  /v1/moderation/services/{bookingId}/resolve:
    post:
      summary: Resolve a disputed service booking (AMD-SVC-03)
      description: >-
        Moderator-only, disputed only. "refund" returns the remaining
        milestones to the customer and cancels the booking; "release" pays
        them out and completes it. The AMD-ESC-01 four-eyes gate applies
        unchanged above 1,000,000 minor of remaining value: the request is
        recorded and answers 202 until a second moderator approves, and the
        booking resolves identically on either path. Audited in the admin
        audit log.
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [refund, release] }
      responses:
        "200": { description: Resolved; returns the new state. }
        "202": { description: Recorded; a second moderator must approve (AMD-ESC-01). }
        "400": { description: Invalid decision. }
        "403": { description: Moderator role required. }
        "404": { description: Unknown booking. }
        "409": { description: The booking is not disputed. }
        "503": { description: Wallet rail disabled (AMD-PAY-15). }
  /v1/account/onboarding:
    get:
      summary: Consumer onboarding stepper (AMD-ONB-06)
      description: >-
        The canonical first-run read model: age declared, KYC state, review
        requested, avatar set, verticals chosen and the overall complete
        flag — one ordered journey instead of five endpoint polls.
      responses:
        "200": { description: The caller's onboarding status. }
        "404": { description: Account not found. }
  /v1/identity/kyc/request:
    post:
      summary: Initiate KYC review (AMD-ONB-06)
      description: >-
        A member whose KYC state is pending or rejected asks for review;
        idempotent while a request is open (already_requested answers 200).
        A decision clears the stamp, so a rejected member can re-request.
        The moderation worklist is GET /v1/moderation/kyc-queue.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "201": { description: Request recorded. }
        "200": { description: A request is already open. }
        "404": { description: Account not found. }
        "409": { description: Verified or suspended members have nothing to request. }
  /v1/onboarding/applications:
    post:
      summary: Apply as a venue partner or provider (AMD-ONB-01/02)
      description: >-
        The governed entry point for the non-consumer stakeholder kinds.
        The caller must be KYC-verified. The payload is validated three
        times against one contract — the route schema, the edge module and
        the storage-layer validator: a venue partner application carries a
        name (2..80), a geofence polygon (4..64 [lon, lat] pairs), an
        optional operating schedule and a statement (10..500); a provider
        application carries the accepted terms version (v<major>.<minor>)
        and a statement. Idempotent on an open application (already_open
        answers 200 with the open application).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, payload]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [venue_partner, provider] }
                payload:
                  oneOf:
                    - type: object
                      required: [name, polygon, statement]
                      additionalProperties: false
                      properties:
                        name: { type: string, minLength: 2, maxLength: 80 }
                        polygon:
                          type: array
                          minItems: 4
                          maxItems: 64
                          items:
                            type: array
                            minItems: 2
                            maxItems: 2
                            items: { type: number }
                        schedule:
                          type: [object, "null"]
                          additionalProperties: false
                          properties:
                            timezone: { type: string, minLength: 1, maxLength: 64 }
                            weekly:
                              type: array
                              maxItems: 21
                              items:
                                type: object
                                required: [day, open, close]
                                additionalProperties: false
                                properties:
                                  day: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
                                  open: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
                                  close: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
                        statement: { type: string, minLength: 10, maxLength: 500 }
                    - type: object
                      required: [termsVersion, statement]
                      additionalProperties: false
                      properties:
                        termsVersion: { type: string, pattern: "^v[0-9]+\\.[0-9]+$" }
                        statement: { type: string, minLength: 10, maxLength: 500 }
      responses:
        "201": { description: Submitted; returns the application id. }
        "200": { description: An open application already exists; returns it. }
        "400": { description: Invalid body. }
        "403": { description: KYC verification required first. }
        "422": { description: Unknown kind or invalid payload. }
  /v1/onboarding/applications/mine:
    get:
      summary: List my onboarding applications (AMD-ONB-01)
      description: The caller's own applications, newest first — RLS enforces it.
      responses:
        "200": { description: The caller's applications. }
  /v1/onboarding/applications/{applicationId}/withdraw:
    post:
      summary: Withdraw a pending application (AMD-ONB-03)
      description: >-
        The applicant — and only the applicant — withdraws a pending
        application. Decided rows are immutable. Audited.
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Withdrawn. }
        "403": { description: Not the applicant. }
        "404": { description: Unknown application. }
        "409": { description: Only a pending application can be withdrawn. }
  /v1/moderation/onboarding:
    get:
      summary: Onboarding application queue (AMD-ONB-04)
      description: >-
        Moderator-only. Pending applications first (oldest waiting first),
        then recent decisions.
      responses:
        "200": { description: The onboarding queue. }
        "403": { description: Moderator role required. }
  /v1/moderation/onboarding/{applicationId}/approve:
    post:
      summary: Approve an onboarding application (AMD-ONB-04/05)
      description: >-
        Moderator-only, four-eyes: a moderator never decides their own
        application. A venue_partner approval provisions the venue as a
        prospect (never straight to live — activation is the separate
        venue-ops act POST /v1/venues/{venueId}/activate) and binds the
        operator as owner in venue_accounts; the venue_ids token claim
        replays from the binding. Every step lands in the admin audit log.
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Approved; returns the venue id for venue partners. }
        "403": { description: Moderator role required. }
        "404": { description: Unknown application. }
        "409": { description: Already decided, or the applicant is the decider (four-eyes). }
  /v1/moderation/onboarding/{applicationId}/reject:
    post:
      summary: Reject an onboarding application (AMD-ONB-04)
      description: >-
        Moderator-only, four-eyes. A rejection always carries a 10..500
        character reason the applicant can read.
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        "200": { description: Rejected. }
        "403": { description: Moderator role required. }
        "404": { description: Unknown application. }
        "409": { description: Already decided, or the applicant is the decider (four-eyes). }
        "422": { description: The reason is missing or out of bounds. }
  /v1/moderation/kyc-queue:
    get:
      summary: KYC review worklist (AMD-ONB-06)
      description: Moderator-only. Open member review requests, oldest first.
      responses:
        "200": { description: The KYC review queue. }
        "403": { description: Moderator role required. }
  /v1/venues/{venueId}/activate:
    post:
      summary: Activate a prospect venue (AMD-ONB-05)
      description: >-
        Venue-ops console only. The prospect -> active transition — a second
        governed act after the moderation approval that provisioned the
        prospect. Audited in the admin audit log.
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Active. }
        "403": { description: Venue-ops role required. }
        "404": { description: Unknown venue. }
        "409": { description: The venue is not a prospect. }
  /v1/identity/kyc/session:
    post:
      summary: Open a verification session (SRS Addendum 001, AMD-KYC-07/08)
      description: >-
        Issues an OpenKYC verification session: a randomized liveness
        challenge (3 of 5 actions, shuffled, per-action windows) whose
        sha256 digest is pinned in kyc_sessions, plus the single-use
        signed upload token the OpenKYC pipeline verifies before it
        decodes a frame. Only a pending or rejected member may open a
        session, at most one open session per member — a repeat while
        one is open answers 200 with the open session. Unset
        KYC_CHALLENGE_SECRET answers 503 (the wire exists; the credential
        arrives with the deployment). The capture itself uploads to the
        OpenKYC service directly — the platform API never carries a
        capture (AMD-KYC-10).
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: {} }
      responses:
        "200": { description: A session is already open (idempotent repeat). }
        "201": { description: Issued — sessionId, challenge, challengeToken, expiresAt, uploadUrl. }
        "404": { description: Unknown account. }
        "409": { description: Only a pending or rejected member opens a session. }
        "503": { description: Verification not configured. }
    get:
      summary: Own verification session status (AMD-KYC-08)
      description: >-
        The member's own latest session — state and timestamps only; the
        fused scores are never projected to the member (they would aid
        spoof probing).
      responses:
        "200": { description: The latest session. }
        "404": { description: No verification session. }
  /v1/moderation/kyc-sessions:
    get:
      summary: Verification review worklist (AMD-KYC-09)
      description: >-
        Moderator-only. Pipeline-routed 'review' sessions, oldest first,
        with the derived facts and fused scores the reviewer decides
        from; a decision lands through the existing KYC decision route.
      responses:
        "200": { description: The verification review queue. }
        "403": { description: Moderator role required. }
  /v1/webhooks/kyc-verdict:
    post:
      summary: OpenKYC verdict callback (SRS Addendum 001, AMD-KYC-09)
      description: >-
        The verification pipeline's verdict wire, outside the authed
        scope on purpose: the pipeline authenticates with an HMAC-SHA256
        signature over the canonical
        `timestamp|sessionId|challengeDigest|outcome|authenticityScore|livenessScore|providerRef`
        string in the x-kyc-signature header, where the timestamp is the
        unix epoch sent in x-kyc-timestamp — freshness (300 s skew) is
        checked BEFORE the signature (the AMD-PAY-22 discipline).
        complete_kyc_session runs under app.kyc_callback, re-checks the
        challenge digest against the issued session, records the purge
        receipt, and composes record_kyc_decision — including the legal
        rejected -> pending -> verified walk; a 'review' verdict routes
        to the AMD-ONB-06 manual queue instead of auto-deciding.
        Idempotent: a replayed verdict answers ok with outcome replayed.
        Unset KYC_VERDICT_SECRET answers 503.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - name: x-kyc-timestamp
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9]{1,12}$" }
        - name: x-kyc-signature
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sessionId, challengeDigest, outcome, credentialKind, over18, credentialValid, authenticityScore, livenessScore, providerRef]
              properties:
                sessionId: { type: string, format: uuid }
                challengeDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
                outcome: { type: string, enum: [verified, rejected, review] }
                credentialKind: { type: string, enum: [id_card, driving_permit, travel_document] }
                over18: { type: boolean }
                credentialValid: { type: boolean }
                authenticityScore: { type: number, minimum: 0, maximum: 1 }
                livenessScore: { type: number, minimum: 0, maximum: 1 }
                providerRef: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200": { description: Accepted (completed | review_routed | replayed). }
        "401": { description: Stale timestamp, bad signature or challenge mismatch. }
        "404": { description: Unknown session. }
        "409": { description: Session not open, or expired. }
        "422": { description: Malformed verdict or illegal outcome. }
        "503": { description: Verdict callback not configured. }
  /v1/webhooks/whatsapp:
    get:
      summary: WhatsApp verify handshake (SRS Addendum 001, AMD-WA-02)
      security: []
      description: >-
        Meta's subscription challenge, outside the authed scope on
        purpose: the caller proves nothing beyond holding the verify
        token. mode must be subscribe and hub.verify_token must equal
        WHATSAPP_VERIFY_TOKEN; a match answers the challenge as
        text/plain. Unset WHATSAPP_VERIFY_TOKEN answers 503.
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema: { type: string, enum: [subscribe] }
        - name: hub.verify_token
          in: query
          required: true
          schema: { type: string }
        - name: hub.challenge
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The challenge, echoed as text/plain.
          content:
            text/plain:
              schema: { type: string }
        "400": { description: Malformed handshake (missing fields or mode is not subscribe). }
        "403": { description: Verify token mismatch. }
        "503": { description: Webhook not configured. }
    post:
      summary: WhatsApp Cloud API intake (SRS Addendum 001, AMD-WA-02)
      security: []
      description: >-
        The signed inbound wire, outside the authed scope on purpose:
        Meta authenticates with X-Hub-Signature-256, the HMAC-SHA256 of
        the RAW request body under WHATSAPP_APP_SECRET. Inbound text is
        never stored — the parser reduces each message to its keyword
        (stop | start | help | other) and only the keyword, the sender
        phone and the timestamp reach the ledger. Meta redelivers on any
        non-2xx, so after signature and JSON validation the intake ALWAYS
        answers 200; idempotency is the wamid primary key inside
        whatsapp_apply_inbound. STOP revokes the opt-in from any state;
        START resumes only a stopped row that once verified. Delivery
        statuses advance the delivery ledger monotonically by wamid.
        Unset WHATSAPP_APP_SECRET answers 503.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - name: x-hub-signature-256
          in: header
          required: true
          schema: { type: string, pattern: "^sha256=[0-9a-f]{64}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: >-
                The Cloud API webhook envelope. The top level is strict;
                WITHIN entry[].changes[].value the parser is deliberately
                tolerant (unknown change fields and malformed entries are
                skipped, never fatal) so a poison entry cannot stall the
                redelivery queue behind it.
              properties:
                object: { type: string }
                entry:
                  type: array
                  items: { type: object }
      responses:
        "200": { description: Accepted and persisted (duplicates collapse on the wamid). }
        "400": { description: Body is not valid JSON. }
        "401": { description: Bad or missing signature. }
        "503": { description: Webhook not configured. }
  /v1/whatsapp:
    get:
      summary: My WhatsApp opt-in state (SRS Addendum 001, AMD-WA-03)
      description: >-
        The member's own opt-in row, minimal projection: the state, the
        phone ALWAYS masked (+ccc****last4), and the link/verify
        timestamps. The verify digest never leaves the database.
      responses:
        "200":
          description: The opt-in state (linked:false when no row exists).
          content:
            application/json:
              schema:
                type: object
                required: [linked]
                properties:
                  linked: { type: boolean }
                  state: { type: string, enum: [pending, active, stopped] }
                  phone: { type: string, example: "+234****5678" }
                  linkedAt: { type: string, format: date-time }
                  verifiedAt: { type: string, format: date-time, nullable: true }
  /v1/whatsapp/link:
    post:
      summary: Link a phone and send the verify code (AMD-WA-03)
      description: >-
        Puts the opt-in row into pending and sends the 6-digit verify
        code via the presence_verify_code template (10-minute TTL, 5
        attempts). The phone is normalized to strict E.164 — anything
        else is a 400. A repeat link of the SAME phone within 60 seconds
        answers 429 (the resend cooldown, enforced in the definer); a
        phone bound to another account answers 409. In compose
        (WHATSAPP_DEV_ECHO=1) the response carries devCode so the flow is
        walkable without Meta credentials — never in a deployed
        environment.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, example: "+2348012345678" }
      responses:
        "202":
          description: Code sent (or the documented unconfigured no-op).
          content:
            application/json:
              schema:
                type: object
                required: [ok, state, verification]
                properties:
                  ok: { type: boolean }
                  state: { type: string, enum: [pending] }
                  verification:
                    type: object
                    properties:
                      sent: { type: boolean }
                      reason: { type: string }
                  devCode: { type: string, description: compose dev-echo only }
        "400": { description: Phone is not strict E.164. }
        "409": { description: Phone is linked to another account. }
        "429": { description: Resend cooldown (60 s). }
    delete:
      summary: Unlink the WhatsApp channel (AMD-WA-03)
      description: >-
        The member's own revocation: any state goes stopped and the
        verification fields clear. No WhatsApp notice is ever sent to the
        phone again — a re-link demands a fresh verification.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Unlinked. }
        "404": { description: No link exists. }
  /v1/whatsapp/verify:
    post:
      summary: Redeem the verify code (AMD-WA-03)
      description: >-
        A digest match moves pending -> active. A mismatch counts an
        attempt; the fifth strike kills the code (request a fresh one).
        Expired codes answer 410, a missing pending row 409.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200": { description: Verified — the opt-in is active. }
        "400": { description: Code mismatch (an attempt is counted). }
        "409": { description: No pending verification. }
        "410": { description: Code expired. }
        "429": { description: Attempt ceiling reached. }
  /v1/maps/manifest:
    get:
      summary: The serving tile bundle's manifest (SRS Addendum 001, AMD-MAP-05; TR-44)
      description: >-
        Discovery for the static-tile tier: which governed bundle the
        platform serves (version, bbox, zoom range, tile count, the
        registry-pinned tiles hash, attribution, URL template). Tiles
        themselves are static files served by nginx (AMD-MAP-06) — this
        route governs discovery only. {available:false} when no bundle
        is published — clients keep their last cached manifest or stay
        geometry-only, never broken. Cache-Control: no-cache — the
        version inside is the client's cache key.
      responses:
        "200":
          description: The serving manifest, or {available:false}.
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available: { type: boolean }
                  bundleId: { type: string, format: uuid }
                  version: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" }
                  label: { type: string }
                  bbox:
                    type: object
                    properties:
                      west: { type: number }
                      south: { type: number }
                      east: { type: number }
                      north: { type: number }
                  minZoom: { type: integer }
                  maxZoom: { type: integer }
                  tileCount: { type: integer }
                  tilesSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                  attribution: { type: string }
                  urlTemplate: { type: string, example: "/tiles/{z}/{x}/{y}.png" }
                  vectorsUrl: { type: string, example: "/tiles/vectors.json" }
                  publishedAt: { type: string }
  /v1/maps/venues:
    get:
      summary: Partner venues near the member's own cell (AMD-MAP-05)
      description: >-
        The explore map's read model. Two honest modes, both
        coordinate-free (TR-15/SEC-08): the RN client passes ?cell= with
        the resolution-9 H3 cell it computed on-device (TR-29 — the cell
        it already publishes); the zero-dependency PWA passes NO cell
        and the edge resolves the member's live presence server-side
        (presence:"live"), so the lite client's cell never crosses the
        wire. No live presence answers presence:"absent" with an empty
        venue list — a first-class state, not an error. The projection
        carries venue identity and the published geofence (already
        member-visible through check-in), capped at 40, nearest first.
        Cache-Control: private, no-store.
      parameters:
        - name: cell
          in: query
          required: false
          schema: { type: string, pattern: "^[0-9a-f]{15}$" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 40 }
      responses:
        "200":
          description: The cell used (null when absent) and the venues.
          content:
            application/json:
              schema:
                type: object
                required: [cell, presence, venues]
                properties:
                  cell: { type: string, nullable: true }
                  presence: { type: string, enum: [presented, live, absent] }
                  venues:
                    type: array
                    items:
                      type: object
                      properties:
                        venueId: { type: string, format: uuid }
                        label: { type: string }
                        geofence: { type: object }
                        floors: { type: array, items: { type: string } }
        "422": { description: Malformed cell or limit. }
  /v1/ops/maps/bundles:
    get:
      summary: Tile bundle registry (venue-ops; AMD-MAP-02)
      description: >-
        Every registered bundle, newest first, with its state
        (draft/published/archived) and the pinned tiles hash.
      responses:
        "200": { description: The registry listing. }
        "403": { description: Venue-ops role required. }
    post:
      summary: Register a rendered bundle as a draft (venue-ops; AMD-MAP-02)
      description: >-
        Attests a rendered bundle's manifest: version, bbox, zoom range,
        tile count and the builder's tilesSha256. The draft is inert
        until published.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201": { description: Draft registered. }
        "403": { description: Venue-ops role required. }
        "409": { description: Version already registered. }
        "422": { description: Malformed registration. }
  /v1/ops/maps/bundles/{bundleId}/publish:
    post:
      summary: Publish a draft bundle (venue-ops; AMD-MAP-02)
      description: >-
        Version-monotonic publication: the draft must be NEWER than the
        serving bundle; the superseded bundle is archived in the same
        transaction. Exactly one published bundle exists at any time
        (registry partial unique index).
      parameters:
        - name: bundleId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Published — the bundle now serves. }
        "403": { description: Venue-ops role required. }
        "404": { description: Unknown bundle. }
        "409": { description: Not a draft, or not newer than the serving bundle. }
components:
  parameters:
    pairId:
      name: pairId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
      description: >-
        TR-24: dedupe key for this mutating request. Replays within 24 h
        return the recorded response with Idempotency-Replayed: true; a
        replay arriving while the first attempt is still in flight answers
        409. Keys are scoped per user; an invalid key answers 400.
  responses:
    SchemaViolation:
      description: >-
        TR-23 strict-schema rejection — a required field is missing or an
        unknown field was supplied (additionalProperties: false). The body
        follows the TR-25 error envelope; validation detail stays server-side.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    ErrorEnvelope:
      description: >-
        TR-25: every error response carries a stable machine-readable code, a
        human message, and a retry hint. The code is "<status>.<slug of the
        message>" and stays stable as long as the message text is stable.
        retryable is true only for 429 and 5xx; rate-limited responses also
        carry retryAfterSeconds. Error responses never leak internal
        identifiers or stack traces — validation detail and exception
        messages stay server-side.
      type: object
      required: [error, code, retryable]
      properties:
        error: { type: string, example: pair not found }
        code: { type: string, example: "404.pair_not_found" }
        retryable: { type: boolean }
        retryAfterSeconds: { type: integer, description: present on rate-limited (429) responses }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
